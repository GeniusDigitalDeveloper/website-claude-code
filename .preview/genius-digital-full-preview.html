/* ---------- 4) Dashboard ---------- */
function renderStats() {
  const box = $("#stats");
  const cards = [
    ["Total Products", "box", "", p => p.length], ["Active Products", "check", "s-ok", p => p.filter(x => x.status === "active").length],
    ["Coming Soon Products", "clock", "s-warn", p => p.filter(x => x.status === "coming-soon").length],
    ["Hidden Products", "eyeoff", "s-hid", p => p.filter(x => x.status === "hidden").length],
    ["Total Categories", "tag", "s-cat", p => new Set(p.map(x => (x.category || "").trim().toLowerCase()).filter(Boolean)).size]
  ];
  box.replaceChildren(...cards.map(([label, ic, cls, fn]) =>
    el("div", { class: `stat ${cls} ${products ? "" : "load"}` }, el("div", { class: "ico" }, icon(I[ic])), el("b", { text: products ? String(fn(products)) : "0" }), el("span", { text: label }))));
}

/* ---------- 5) Senarai produk ---------- */
function filtered() {
  const q = view.q.toLowerCase();
  return (products || []).filter(p =>
    (!view.cat || p.category === view.cat) && (!view.status || p.status === view.status) &&
    (!q || [p.name, p.slug, p.category].some(v => (v || "").toLowerCase().includes(q))));
}
function renderCategoryOptions() {
  const cats = [...new Set((products || []).map(p => p.category).filter(Boolean))].sort();
  const sel = $("#fCat"), keep = view.cat;
  sel.replaceChildren(el("option", { value: "", text: "Semua kategori" }), ...cats.map(c => el("option", { value: c, text: c })));
  if (cats.includes(keep)) sel.value = keep; else view.cat = "";
  $("#catList").replaceChildren(...cats.map(c => el("option", { value: c })));
}
function thumbOf(p) { return p.thumbnailURL || (THUMBS[p.slug] || ""); }
function rowFor(p, idx, all) {
  const img = el("img", { class: "t-img", src: thumbOf(p), alt: `Thumbnail ${p.name}`, loading: "lazy", width: 96, height: 60 });
  img.addEventListener("error", () => { img.removeAttribute("src"); img.style.visibility = "hidden"; });
  const full = (products || []);
  const pos = full.findIndex(x => x.id === p.id);
  const mk = (label, ic, fn, extra = {}) => { const b = el("button", { class: "btn btn-ghost btn-sm" + (extra.cls ? " " + extra.cls : ""), type: "button", "aria-label": `${label}: ${p.name}`, title: label, disabled: extra.disabled }, icon(I[ic]), extra.text ? el("span", { text: extra.text }) : null); b.addEventListener("click", fn); return b; };
  return el("tr", {},
    el("td", { class: "c-img" }, img),
    el("td", { class: "c-name" }, el("div", { class: "t-name", text: p.name }), el("div", { class: "t-slug", text: "/" + p.slug })),
    el("td", { class: "c-meta", "data-label": "Kategori" }, p.category || "—"),
    el("td", { class: "c-meta", "data-label": "Status" }, el("span", { class: "pill " + p.status }, el("i"), STATUS_LABEL[p.status] || p.status)),
    el("td", { class: "c-meta", "data-label": "Susunan" }, String(p.displayOrder ?? "—")),
    el("td", { class: "c-meta", "data-label": "Dikemas kini" }, fmtDate(p.updatedAt)),
    el("td", { class: "c-act" }, el("div", { class: "acts" },
      mk("Naik", "up", () => move(p, -1), { disabled: pos <= 0 }),
      mk("Turun", "down", () => move(p, 1), { disabled: pos === full.length - 1 }),
      mk("Edit", "edit", () => openForm(p), { text: "Edit" }),
      mk("Padam", "trash", () => openDelete(p), { text: "Padam", cls: "" }))));
}
function renderList(err) {
  const box = $("#listBox"), foot = $("#listFoot");
  if (err) {
    box.replaceChildren(stateBox("alert", "Gagal memuatkan produk", err.code === "permission-denied" ? "Akses ditolak oleh Firestore Rules. Pastikan custom claim admin telah ditetapkan, kemudian log keluar dan masuk semula." : "Sila semak sambungan internet dan cuba lagi.", [btn("Cuba lagi", () => location.reload())]));
    foot.textContent = ""; return;
  }
  if (!products) {
    box.replaceChildren(el("div", { class: "state", role: "status" }, el("div", { class: "spin", style: "margin:0 auto 12px;width:28px;height:28px;border-color:rgba(21,83,232,.2);border-top-color:#1553E8" }), el("p", { text: "Memuatkan produk…" })));
    foot.textContent = ""; return;
  }
  if (!products.length) {
    box.replaceChildren(stateBox("box", "Belum ada produk", "Tambah produk pertama anda, atau muat 2 produk contoh (QR Me Generator & Malaysia PDF Tools). Muat contoh tidak akan membuat pendua.", [btn("Add Product", () => openForm(), true), btn("Muat produk contoh", seedNow)]));
    foot.textContent = ""; return;
  }
  const rows = filtered();
  if (!rows.length) {
    box.replaceChildren(stateBox("box", "Tiada padanan", "Tiada produk sepadan dengan carian atau tapisan anda.", [btn("Set semula tapisan", () => { view.q = view.cat = view.status = ""; $("#q").value = $("#fCat").value = $("#fStatus").value = ""; renderList(); })]));
  } else {
    const table = el("table", { class: "tbl" },
      el("thead", {}, el("tr", {}, ...["Thumbnail", "Produk", "Kategori", "Status", "Susunan", "Dikemas kini", "Tindakan"].map(h => el("th", { scope: "col", text: h })))),
      el("tbody", {}, ...rows.map((p, i) => rowFor(p, i, rows))));
    box.replaceChildren(table);
  }
  foot.textContent = `Memaparkan ${rows.length} daripada ${products.length} produk`;
}
function btn(text, fn, primary) { const b = el("button", { class: "btn " + (primary ? "btn-primary" : "btn-ghost"), type: "button", text }); b.addEventListener("click", fn); return b; }
function stateBox(ic, title, text, actions = []) {
  return el("div", { class: "state" }, el("div", { class: "ico" }, icon(I[ic])), el("h3", { text: title }), el("p", { text }), el("div", { class: "acts", style: "justify-content:center" }, ...actions));
}
function renderAll(err) { renderStats(); renderCategoryOptions(); renderList(err); }

$("#q").addEventListener("input", e => { view.q = e.target.value.trim(); renderList(); });
$("#fCat").addEventListener("change", e => { view.cat = e.target.value; renderList(); });
$("#fStatus").addEventListener("change", e => { view.status = e.target.value; renderList(); });

async function seedNow(e) {
  const b = e.currentTarget; setBusy(b, true, "Memuatkan…");
  try { const n = await api.seed(); toast(n ? `${n} produk contoh dimasukkan.` : "Produk contoh sudah wujud — tiada pendua dibuat.", "ok"); }
  catch (err) { console.error(err); toast("Gagal memuat produk contoh: " + (err.code || err.message), "err"); setBusy(b, false); }
}
async function move(p, dir) {
  const list = [...products].sort((a, b) => (a.displayOrder ?? 0) - (b.displayOrder ?? 0));
  const i = list.findIndex(x => x.id === p.id), j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  const changes = list.map((x, k) => ({ id: x.id, displayOrder: k + 1 })).filter(c => products.find(x => x.id === c.id).displayOrder !== c.displayOrder);
  try { await api.reorder(changes); toast("Susunan dikemas kini.", "ok"); }
  catch (err) { console.error(err); toast("Gagal menukar susunan: " + (err.code || err.message), "err"); }
}

/* ---------- 6) Borang tambah / edit ---------- */
const dlg = $("#formDlg"), form = $("#productForm");
const F = { name: $("#fName"), slug: $("#fSlug"), cat: $("#fCategory"), desc: $("#fDesc"), status: $("#fStatusSel"), order: $("#fOrder"), url: $("#fURL"), file: $("#fFile") };
let editing = null, slugTouched = false, pendingFile = null, removeImage = false, previewURL = null;

function fieldErr(key, msg, input) {
  const e = $("#e" + key); e.hidden = !msg; e.textContent = msg || "";
  input?.setAttribute("aria-invalid", String(!!msg));
}
function setPreview(src) {
  const prev = $("#upPrev");
  if (src) { const im = el("img", { src, alt: "Pratonton thumbnail" }); im.addEventListener("error", () => { prev.textContent = "Imej tidak dapat dipaparkan"; }); prev.replaceChildren(im); }
  else prev.textContent = "Tiada imej dipilih";
  $("#upRemove").hidden = !src;
  $("#upLabel").textContent = src ? "Replace Image" : "Upload Image";
}
function openForm(p = null) {
  editing = p; slugTouched = !!p; pendingFile = null; removeImage = false;
  if (previewURL) { URL.revokeObjectURL(previewURL); previewURL = null; }
  $("#formTitle").textContent = p ? "Edit Product" : "Add Product";
  $("#formErr").hidden = true; $("#prog").hidden = true; $("#progBar").style.width = "0";
  ["Name", "Slug", "Category", "Desc", "Order", "URL", "File"].forEach(k => fieldErr(k, "", null));
  Object.values(F).forEach(i => i.removeAttribute("aria-invalid"));
  F.file.value = "";
  const maxOrder = Math.max(0, ...(products || []).map(x => x.displayOrder || 0));
  F.name.value = p?.name || ""; F.slug.value = p?.slug || ""; F.cat.value = p?.category || "";
  F.desc.value = p?.description || ""; F.status.value = p?.status || "active";
  F.order.value = p ? (p.displayOrder ?? 1) : maxOrder + 1; F.url.value = p?.productURL || "";
  $("#descCount").textContent = F.desc.value.length;
  setPreview(p?.thumbnailURL || "");
  $("#metaDates").hidden = !p; if (p) { $("#mCreated").textContent = fmtDate(p.createdAt); $("#mUpdated").textContent = fmtDate(p.updatedAt); }
  dlg.showModal(); F.name.focus();
}
const closeForm = () => dlg.close();
$("#addBtnTop").addEventListener("click", () => openForm());
$("#formX").addEventListener("click", closeForm); $("#formCancel").addEventListener("click", closeForm);
dlg.addEventListener("click", e => { if (e.target === dlg) closeForm(); });
F.name.addEventListener("input", () => { if (!slugTouched) F.slug.value = slugify(F.name.value); });
F.slug.addEventListener("input", () => { slugTouched = true; });
F.desc.addEventListener("input", () => { $("#descCount").textContent = F.desc.value.length; });
F.file.addEventListener("change", () => {
  const f = F.file.files[0]; fieldErr("File", "", null);
  if (!f) return;
  if (!IMG_TYPES.includes(f.type)) { F.file.value = ""; return fieldErr("File", "Format tidak disokong. Gunakan JPG, PNG atau WebP."); }
  if (f.size > MAX_IMG) { F.file.value = ""; return fieldErr("File", `Fail terlalu besar (${(f.size / 1048576).toFixed(1)} MB). Maksimum 2 MB.`); }
  pendingFile = f; removeImage = false;
  if (previewURL) URL.revokeObjectURL(previewURL);
  previewURL = URL.createObjectURL(f); setPreview(previewURL);
});
$("#upRemove").addEventListener("click", () => {
  pendingFile = null; F.file.value = ""; removeImage = !!editing?.thumbnailURL;
  if (previewURL) { URL.revokeObjectURL(previewURL); previewURL = null; }
  setPreview("");
});

function validate() {
  let ok = true; const bad = (k, m, i) => { fieldErr(k, m, i); ok = false; };
  const name = F.name.value.trim(), slug = F.slug.value.trim(), cat = F.cat.value.trim(), desc = F.desc.value.trim(), url = F.url.value.trim(), order = Number(F.order.value);
  fieldErr("Name", "", F.name); fieldErr("Slug", "", F.slug); fieldErr("Category", "", F.cat); fieldErr("Desc", "", F.desc); fieldErr("Order", "", F.order); fieldErr("URL", "", F.url);
  if (!name) bad("Name", "Nama produk diperlukan.", F.name);
  if (!slug) bad("Slug", "Slug diperlukan.", F.slug);
  else if (!SLUG_RE.test(slug)) bad("Slug", "Slug hanya boleh huruf kecil, nombor dan sempang (bukan di hujung).", F.slug);
  else if ((products || []).some(p => p.slug === slug && p.id !== editing?.id)) bad("Slug", "Slug ini sudah digunakan oleh produk lain.", F.slug);
  if (!cat) bad("Category", "Kategori diperlukan.", F.cat);
  if (!desc) bad("Desc", "Penerangan diperlukan.", F.desc);
  if (!Number.isInteger(order) || order < 0 || order > 9999) bad("Order", "Masukkan nombor bulat 0–9999.", F.order);
  if (url && !/^https?:\/\/[^\s]+$/i.test(url)) bad("URL", "URL mesti bermula dengan http:// atau https://", F.url);
  return ok && { name, slug, category: cat, description: desc, status: F.status.value, productURL: url, displayOrder: order };
}
form.addEventListener("submit", async e => {
  e.preventDefault();
  const data = validate();
  if (!data) { dlg.querySelector("[aria-invalid='true']")?.focus(); return; }
  const save = $("#formSave"); setBusy(save, true, pendingFile ? "Memuat naik…" : "Menyimpan…");
  $("#formErr").hidden = true;
  if (pendingFile) { $("#prog").hidden = false; }
  try {
    await api.save(editing?.id || null, data, { file: pendingFile, removeImage, old: editing, onProgress: r => { $("#progBar").style.width = Math.round(r * 100) + "%"; } });
    toast(editing ? "Produk dikemas kini." : "Produk ditambah.", "ok"); closeForm();
  } catch (err) {
    console.error(err);
    const msg = err.code === "permission-denied" || err.code === "storage/unauthorized" ? "Akses ditolak. Pastikan anda admin dan rules telah diterbitkan."
      : err.code === "storage/quota-exceeded" || err.code === "storage/unknown" ? "Storage tidak dapat digunakan. Semak sama ada Cloud Storage telah diaktifkan untuk projek ini."
      : "Gagal menyimpan: " + (err.code || err.message);
    $("#formErr").replaceChildren(icon(I.alert), el("span", { text: msg })); $("#formErr").hidden = false;
    dlg.querySelector(".d-body").scrollTo({ top: 0, behavior: "smooth" });
  } finally { setBusy(save, false); }
});

/* ---------- 7) Padam ---------- */
const delDlg = $("#delDlg"); let toDelete = null;
function openDelete(p) { toDelete = p; $("#delName").textContent = p.name; delDlg.showModal(); $("#delCancel").focus(); }
$("#delCancel").addEventListener("click", () => delDlg.close());
delDlg.addEventListener("click", e => { if (e.target === delDlg) delDlg.close(); });

    if (firebaseReady) api = await createFirebaseApi();
    else { api = createDemoApi(); $("#cfgWarn").hidden = false; $("#demoEntry").hidden = false; }

    showOnly("authView"); authMsg("err", "Tidak dapat memuatkan Firebase. Semak sambungan internet dan konfigurasi dalam GENIUS_CONFIG.");
    $("#loginBtn").disabled = true;
  }
}
init();

<script>
const files=["index.html", "admin.html", "firestore.rules"];
const get=id=>document.getElementById(id).textContent.replace(/<\\\/script/g,"</script");
const tabs=[...document.querySelectorAll('.tabs button')];
function show(t){tabs.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));
 document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+t);
 if(t[0]==='f')fill(+t.slice(1)); if(t==='preview')loadPv();scrollTo(0,0);history.replaceState(null,'','#'+t)}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
const filled={};
function fill(i){if(filled[i])return;filled[i]=1;const s=get('src-'+i);document.getElementById('c-'+i).textContent=s;
 document.getElementById('m-'+i).textContent=s.split('\n').length+' baris · '+(new Blob([s]).size/1024).toFixed(1)+' KB'}
document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const s=get('src-'+b.dataset.i);
 try{await navigator.clipboard.writeText(s)}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('c-'+b.dataset.i));const g=getSelection();g.removeAllRanges();g.addRange(r);document.execCommand('copy')}
 const o=b.textContent;b.textContent='Disalin ✓';setTimeout(()=>b.textContent=o,1600)});
let cur='website',loaded='';
function loadPv(){if(loaded===cur)return;loaded=cur;document.getElementById('pvf').srcdoc=get('pv-'+cur)}
document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{cur=b.dataset.pv;document.querySelectorAll('[data-pv]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));loadPv()});
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{document.getElementById('frame').style.width=b.dataset.w==='100%'?'100%':b.dataset.w+'px';document.querySelectorAll('[data-w]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
const h=location.hash.slice(1);show(tabs.some(b=>b.dataset.t===h)?h:'preview');
</script></body></html>
