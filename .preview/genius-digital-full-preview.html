<style>
/* ============ TOKEN ============ */
:root{
  --navy:#0B1F4B; --navy-2:#13306F; --blue:#1553E8; --blue-2:#3B7BFF; --cyan:#00C2E0;
  --bg:#F4F7FC; --surface:#fff; --text:#0B1F4B; --muted:#41506B; --line:#DCE5F3;
  --ok:#0E7A4F; --warn:#8A5A00; --danger:#B42318;
  --radius:20px; --radius-sm:12px;
  --shadow-sm:0 2px 10px rgba(11,31,75,.06);
  --shadow:0 12px 34px rgba(11,31,75,.10);
  --shadow-lg:0 26px 60px rgba(11,31,75,.18);
  --font-hero:'Bebas Neue','Oswald',Impact,sans-serif;
  --font-head:'Manrope','Montserrat',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gutter:clamp(16px,5vw,40px);
  --nav-h:68px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + 12px)}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.65;color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.15;margin:0;color:var(--navy)}
p{margin:0}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:var(--gutter)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:200}
.skip:focus{top:12px}
.icon{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============ BUTANG ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:48px;padding:.8rem 1.5rem;border-radius:999px;border:1.5px solid transparent;font-family:var(--font-head);font-weight:700;font-size:.97rem;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.btn-primary{background:linear-gradient(135deg,var(--blue),#2D6BFF);color:#fff;box-shadow:0 10px 24px rgba(21,83,232,.32)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(21,83,232,.42)}
.btn-ghost{background:rgba(255,255,255,.7);color:var(--navy);border-color:var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}
.btn-block{width:100%}
.btn:active{transform:translateY(0) scale(.98)}

/* ============ NAV ============ */
.nav{position:fixed;inset:0 0 auto 0;z-index:100;height:var(--nav-h);background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid rgba(220,229,243,.8);transition:box-shadow .25s}
.nav.scrolled{box-shadow:0 6px 24px rgba(11,31,75,.08)}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;color:var(--navy);font-family:var(--font-head);font-weight:800;letter-spacing:.06em;font-size:1.02rem}
.brand img{width:38px;height:38px}
.menu{display:none;list-style:none;margin:0;padding:0;gap:.25rem;align-items:center}
.menu a{display:inline-flex;align-items:center;min-height:44px;padding:0 .95rem;border-radius:999px;text-decoration:none;color:var(--navy);font-weight:600;font-size:.95rem;transition:background .2s,color .2s}
.menu a:hover{background:rgba(21,83,232,.08);color:var(--blue)}
.menu .login{background:var(--navy);color:#fff;margin-left:.5rem}
.menu .login:hover{background:var(--blue);color:#fff}
.burger{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--navy)}
.drawer{position:fixed;inset:var(--nav-h) 0 auto 0;z-index:99;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:.75rem var(--gutter) 1.25rem;transform:translateY(-12px);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility .25s}
.drawer.open{transform:none;opacity:1;visibility:visible}
.drawer a{display:flex;align-items:center;min-height:52px;padding:0 .5rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--navy);font-family:var(--font-head);font-weight:700}
.drawer a.login{margin-top:.9rem;border:0;justify-content:center;background:var(--navy);color:#fff;border-radius:999px}
@media(min-width:860px){.menu{display:flex}.burger,.drawer{display:none}}

/* ============ HERO ============ */
.hero{position:relative;isolation:isolate;overflow:hidden;padding:calc(var(--nav-h) + clamp(40px,8vw,96px)) 0 clamp(56px,9vw,110px);background:linear-gradient(180deg,#EAF1FF 0%,var(--bg) 100%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background-image:linear-gradient(rgba(21,83,232,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(21,83,232,.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%)}
.aurora{position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform;animation:drift 16s ease-in-out infinite alternate}
.aurora.a{width:46vmax;height:46vmax;max-width:560px;max-height:560px;right:-12%;top:-18%;background:radial-gradient(circle,var(--blue-2),transparent 65%)}
.aurora.b{width:38vmax;height:38vmax;max-width:480px;max-height:480px;left:-14%;bottom:-24%;background:radial-gradient(circle,var(--cyan),transparent 65%);animation-delay:-6s}
@keyframes drift{to{transform:translate3d(-40px,30px,0) scale(1.08)}}
.hero-grid{display:grid;gap:clamp(36px,6vw,64px);align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .9rem;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-family:var(--font-head);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(0,194,224,.25)}
.hero h1{font-family:var(--font-hero);font-weight:400;font-size:clamp(3.6rem,15vw,8.6rem);line-height:.9;letter-spacing:.015em;margin:1.1rem 0 .5rem;background:linear-gradient(120deg,var(--navy) 20%,var(--blue) 70%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-family:var(--font-head);font-weight:800;font-size:clamp(1.05rem,3.4vw,1.5rem);color:var(--navy)}
.slogan{margin-top:.9rem;font-size:clamp(1.02rem,2.6vw,1.2rem);color:var(--blue);font-weight:600;font-style:italic;max-width:34rem}
.intro{margin-top:1rem;max-width:36rem;color:var(--muted);font-size:clamp(1rem,2.2vw,1.08rem)}
.cta-row{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
.cta-row .btn{flex:1 1 220px}
@media(min-width:560px){.cta-row .btn{flex:0 0 auto}}

/* visual 3D */
.stage{position:relative;height:clamp(300px,70vw,440px);perspective:1100px;display:grid;place-items:center}
.stack{position:relative;width:min(340px,80%);height:70%;transform-style:preserve-3d;transform:rotateX(52deg) rotateZ(-34deg);animation:float 7s ease-in-out infinite}
.layer{position:absolute;inset:0;border-radius:24px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-lg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.layer.l1{transform:translateZ(0)}
.layer.l2{transform:translateZ(46px);background:linear-gradient(135deg,rgba(21,83,232,.92),rgba(0,194,224,.85));border-color:rgba(255,255,255,.4)}
.layer.l3{transform:translateZ(92px)}
.layer svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes float{50%{transform:rotateX(52deg) rotateZ(-34deg) translate3d(0,-14px,24px)}}
.chip{position:absolute;display:flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--font-head);font-weight:700;font-size:.82rem;color:var(--navy);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:bob 6s ease-in-out infinite}
.chip .icon{color:var(--blue)}
.chip.c1{left:0;top:10%}
.chip.c2{right:0;bottom:12%;animation-delay:-3s}
@keyframes bob{50%{transform:translateY(-10px)}}
@media(min-width:960px){.hero-grid{grid-template-columns:1.1fr .9fr}.stage{height:500px}}

/* ============ SEKSYEN ============ */
section{position:relative}
.section{padding:clamp(64px,10vw,120px) 0}
.sec-head{max-width:46rem;margin-bottom:clamp(32px,5vw,56px)}
.sec-head.center{margin-inline:auto;text-align:center}
.kicker{font-family:var(--font-head);font-weight:800;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.sec-head h2{font-family:var(--font-hero);font-weight:400;font-size:clamp(2.4rem,8vw,4.4rem);letter-spacing:.03em;line-height:1;margin-top:.5rem}
.sec-head p{margin-top:.9rem;color:var(--muted);font-size:clamp(1rem,2.2vw,1.12rem)}
.bar{display:block;width:64px;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--cyan));margin-top:1.1rem}
.sec-head.center .bar{margin-inline:auto}

/* About */
.about-grid{display:grid;gap:clamp(24px,4vw,48px)}
.about-copy p{font-size:clamp(1.02rem,2.3vw,1.16rem);color:var(--muted)}
.pillars{display:grid;gap:16px;margin-top:8px}
.pillar{position:relative;padding:24px;border-radius:var(--radius);background:rgba(255,255,255,.78);border:1px solid var(--line);box-shadow:var(--shadow-sm);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s,box-shadow .25s}
.pillar:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.pillar .ico{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;margin-bottom:16px;box-shadow:0 8px 18px rgba(21,83,232,.28)}
.pillar .ico .icon{width:26px;height:26px}
.pillar h3{font-size:1.15rem;margin-bottom:.4rem}
.pillar p{color:var(--muted);font-size:.97rem}
@media(min-width:900px){.about-grid{grid-template-columns:1fr 1.25fr;align-items:start}.pillars{grid-template-columns:1fr 1fr}.pillar:first-child{grid-column:1/-1}}

/* Products */
.products{background:linear-gradient(180deg,var(--bg),#EAF1FF 60%,var(--bg))}
.grid{display:grid;gap:clamp(18px,3vw,28px);grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow .3s,border-color .3s;transform-style:preserve-3d;will-change:transform}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{box-shadow:var(--shadow-lg)}
.card:hover::after{opacity:1}
.thumb{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--navy),var(--blue));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.05)}
.badge{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .75rem;border-radius:999px;font-family:var(--font-head);font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.92);box-shadow:var(--shadow-sm)}
.badge.active{color:var(--ok)}
.badge.coming-soon{color:var(--warn)}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.body{display:flex;flex-direction:column;flex:1;padding:22px 22px 24px}
.cat{font-family:var(--font-head);font-weight:800;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.card h3{font-size:1.4rem;margin:.35rem 0 .6rem}
.card p{color:var(--muted);font-size:.97rem;flex:1}
.card .btn{margin-top:1.3rem}

/* state */
.state{grid-column:1/-1;text-align:center;padding:clamp(36px,6vw,64px) 20px;border-radius:var(--radius);background:rgba(255,255,255,.8);border:1px dashed #B9C8E4}
.state .ico{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:rgba(21,83,232,.1);color:var(--blue)}
.state h3{font-size:1.25rem;margin-bottom:.4rem}
.state p{color:var(--muted);max-width:30rem;margin:0 auto}
.state .btn{margin-top:1.1rem}
.skeleton{border-radius:var(--radius);background:#fff;border:1px solid var(--line);overflow:hidden}
.skeleton .s-img,.skeleton .s-line{background:linear-gradient(90deg,#E8EEF9 25%,#F4F7FC 50%,#E8EEF9 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.skeleton .s-img{aspect-ratio:16/10}
.skeleton .s-body{padding:22px;display:grid;gap:12px}
.skeleton .s-line{height:14px;border-radius:7px}
@keyframes shimmer{to{background-position:-200% 0}}
.notice{display:flex;gap:.7rem;align-items:flex-start;margin-bottom:22px;padding:14px 16px;border-radius:14px;background:#FFF6DB;border:1px solid #F0D98A;color:#5C4200;font-size:.92rem}
.notice .icon{margin-top:2px}

/* Contact */
.contact{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#0F4AB8 100%);color:#fff;overflow:hidden;isolation:isolate}

.contact-grid{display:grid;gap:14px}

/* ---------- 1) Utiliti ---------- */
document.body.classList.remove("no-js");

  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else n.setAttribute(k, v === true ? "" : v);

  s.setAttribute("class", "icon"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
  if (size) { s.style.width = s.style.height = size; }
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", paths); s.append(p); return s;
}
const ICONS = {
  arrow: "M5 12h14M13 6l6 6-6 6",
  mail: "M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM22 6l-10 7L2 6",
  chat: "M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.1A8.4 8.4 0 1 1 21 11.5z",

// Nav: bayang bila scroll + hamburger
const nav = $("#nav"), burger = $("#burger"), drawer = $("#drawer"), burgerIcon = $("#burgerIcon path");
const onScroll = () => nav.classList.toggle("scrolled", scrollY > 8);
addEventListener("scroll", onScroll, { passive: true }); onScroll();
function setDrawer(open) {
  drawer.classList.toggle("open", open);
  burger.setAttribute("aria-expanded", String(open));
  burger.setAttribute("aria-label", open ? "Tutup menu" : "Buka menu");
  burgerIcon.setAttribute("d", open ? "M6 6l12 12M18 6 6 18" : "M4 7h16M4 12h16M4 17h16");
}
burger.addEventListener("click", () => setDrawer(!drawer.classList.contains("open")));
drawer.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setDrawer(false)));
addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
matchMedia("(min-width:860px)").addEventListener("change", e => e.matches && setDrawer(false));

// Scroll reveal
const revealObs = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); revealObs.unobserve(e.target); } }), { threshold: .12, rootMargin: "0px 0px -40px 0px" })
  : null;
function observeReveal(root = document) {
  root.querySelectorAll(".rv:not(.in)").forEach(n => revealObs ? revealObs.observe(n) : n.classList.add("in"));
}
observeReveal();

// Tilt 3D kad (penunjuk halus sahaja; tiada pada skrin sentuh / reduced motion)
const canTilt = matchMedia("(hover:hover) and (pointer:fine)").matches && !reducedMotion;
function attachTilt(card) {
  if (!canTilt) return;
  let raf = 0;
  card.addEventListener("pointermove", e => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `perspective(900px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg) translateY(-6px)`;
    });
  });
  card.addEventListener("pointerleave", () => { cancelAnimationFrame(raf); card.style.transform = ""; });
}

// Modal "Product Coming Soon"
const modal = $("#soonModal");
function openComingSoon(name) {
  $("#soonName").textContent = name || "";
  if (typeof modal.showModal === "function") modal.showModal(); else modal.setAttribute("open", "");
}
$("#soonClose").addEventListener("click", () => modal.close ? modal.close() : modal.removeAttribute("open"));
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });

/* ---------- 3) Contact (dari GENIUS_CONFIG) ---------- */
(function renderContact() {
  const c = CFG.contact || {};
  const grid = $("#contactGrid"), social = $("#socialRow");
  const items = [
    { label: "Emel", value: c.email, href: c.email && "mailto:" + c.email, ph: "Emel syarikat — akan dikemas kini", icon: ICONS.mail },
    { label: "WhatsApp", value: c.whatsapp && "+" + c.whatsapp, href: c.whatsapp && "https://wa.me/" + c.whatsapp.replace(/\D/g, ""), ph: "Nombor WhatsApp — akan dikemas kini", icon: ICONS.chat }
  ];
  const socials = [
    { label: "Facebook", href: c.facebook }, { label: "Instagram", href: c.instagram }, { label: "LinkedIn", href: c.linkedin }
  ];
  items.forEach(i => {
    const body = [el("span", { class: "ico" }, icon(i.icon, "22px")),
      el("span", {}, el("small", { text: i.label }), el("strong", { text: i.value || i.ph }))];
    grid.append(i.href ? el("a", { class: "c-item", href: i.href, target: "_blank", rel: "noopener" }, body)
                       : el("div", { class: "c-item pending" }, body));
  });
  const soc = socials.map(s => s.href
    ? el("a", { class: "s", href: s.href, target: "_blank", rel: "noopener" }, icon(ICONS.link), s.label)
    : el("span", { class: "s pending", title: "Placeholder — akan dikemas kini" }, icon(ICONS.link), s.label + " (akan datang)"));
  const pendingCount = socials.filter(s => !s.href).length;
  // Letak kad Social Media dalam grid
  grid.append(el("div", { class: "c-item pending" }, el("span", { class: "ico" }, icon(ICONS.link, "22px")),
    el("span", {}, el("small", { text: "Social Media" }), el("strong", { text: pendingCount === 3 ? "Akaun akan dikemas kini" : "Ikuti kami" }))));
  social.append(...soc);
})();

/* ---------- 4) Data produk ---------- */
const grid = $("#productGrid");
const DEMO_PRODUCTS = [
  { id: "demo-qr", name: "QR Me Generator", slug: "qr-me-generator", category: "Digital Tools", status: "active", displayOrder: 1, thumbnailURL: "",
    description: "Sistem penjana kod QR yang membolehkan pengguna menghasilkan QR Code dengan mudah, pantas dan praktikal untuk pelbagai kegunaan.", productURL: "" },
  { id: "demo-pdf", name: "Malaysia PDF Tools", slug: "malaysia-pdf-tools", category: "Productivity Tools", status: "coming-soon", displayOrder: 2, thumbnailURL: "",
    description: "Platform pengurusan dokumen PDF yang menyediakan pelbagai fungsi untuk membantu pengguna mengurus, memproses dan menghasilkan dokumen secara lebih mudah dan efisien.", productURL: "" }
];

function renderLoading() {
  grid.setAttribute("aria-busy", "true"); grid.replaceChildren(
    ...[0, 1, 2].map(() => el("div", { class: "skeleton", "aria-hidden": "true" }, el("div", { class: "s-img" }),
      el("div", { class: "s-body" }, el("div", { class: "s-line", style: "width:35%" }), el("div", { class: "s-line", style: "width:70%;height:22px" }), el("div", { class: "s-line" }), el("div", { class: "s-line", style: "width:80%" })))));

  const ic = kind === "error" ? ICONS.alert : ICONS.box;
  grid.replaceChildren(el("div", { class: "state", role: kind === "error" ? "alert" : null },
    el("div", { class: "ico" }, icon(ic, "30px")), el("h3", { text: title }), el("p", { text }),
    retry ? el("button", { class: "btn btn-primary", type: "button", onclick: "" , id: "retryBtn" }, "Cuba lagi") : null));
  if (retry) $("#retryBtn").addEventListener("click", retry);
}
// Thumbnail: URL admin → fail aset ikut slug → penjana SVG generik (tiada gambar rosak)
function genericThumb(name) {
  const initials = (name || "GD").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F4B"/><stop offset=".6" stop-color="#1553E8"/><stop offset="1" stop-color="#00C2E0"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/><text x="400" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="190" fill="#fff" fill-opacity=".9">${initials}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function thumbSrc(p) {

function productCard(p, i) {

  const img = el("img", { src: thumbSrc(p), alt: `Thumbnail ${p.name}`, loading: i > 1 ? "lazy" : "eager", decoding: "async", width: 800, height: 500 });
  let triedFallback = false;
  img.addEventListener("error", () => { if (triedFallback) return; triedFallback = true; img.src = genericThumb(p.name); });
  const btn = el("button", { class: "btn btn-primary", type: "button", "aria-label": `Explore Product: ${p.name}` }, "Explore Product", icon(ICONS.arrow));
  btn.addEventListener("click", () => openProduct(p));

  observeReveal(grid);
}

async function start() {
  renderLoading();
  if (!firebaseReady) {
    $("#demoNotice").hidden = false;
    setTimeout(() => renderProducts(DEMO_PRODUCTS), 450); // simulasi muat ringkas
    return;
  }
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VER}`;
    const [{ initializeApp }, fs] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-firestore.js`)]);

    const q = fs.query(fs.collection(db, "products"), fs.where("status", "in", ["active", "coming-soon"]));

start();

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Butang */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.65rem 1.2rem;border-radius:12px;border:1.5px solid transparent;font-family:var(--font-head);font-weight:700;font-size:.93rem;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--blue),#2D6BFF);color:#fff;box-shadow:0 8px 20px rgba(21,83,232,.28)}
.btn-primary:hover:not([disabled]){box-shadow:0 12px 26px rgba(21,83,232,.4)}
.btn-ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn-ghost:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not([disabled]){background:#8F1A10}
.btn-sm{min-height:44px;min-width:44px;padding:.4rem .8rem;font-size:.86rem}
.btn-icon{padding:0;width:44px}
.spin{width:1.1em;height:1.1em;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
.btn-ghost .spin{border-color:rgba(11,31,75,.2);border-top-color:var(--blue)}
@keyframes rot{to{transform:rotate(360deg)}}

/* Borang */
label{display:block;font-family:var(--font-head);font-weight:700;font-size:.88rem;margin-bottom:.4rem}
.req{color:var(--danger)}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:.7rem .9rem;border-radius:12px;border:1.5px solid #C5D2EA;background:#fff;color:var(--text);font:inherit;font-size:16px;transition:border-color .2s,box-shadow .2s}
textarea.input{min-height:110px;resize:vertical}
.input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,83,232,.15)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:.82rem;color:var(--muted);margin-top:.35rem}
.err{font-size:.84rem;color:var(--danger);margin-top:.35rem;font-weight:500}
.field{margin-bottom:16px}
.row2{display:grid;gap:0 16px}
@media(min-width:600px){.row2{grid-template-columns:1fr 1fr}}

/* ===== Skrin log masuk ===== */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(160deg,#EAF1FF,#F4F7FC)}
.auth::before{content:"";position:absolute;width:60vmax;height:60vmax;max-width:640px;max-height:640px;right:-20%;top:-25%;background:radial-gradient(circle,rgba(59,123,255,.45),transparent 65%);filter:blur(60px);z-index:-1}
.auth::after{content:"";position:absolute;width:48vmax;height:48vmax;max-width:520px;max-height:520px;left:-18%;bottom:-25%;background:radial-gradient(circle,rgba(0,194,224,.4),transparent 65%);filter:blur(60px);z-index:-1}
.auth-card{width:100%;max-width:420px;padding:clamp(24px,6vw,36px);border-radius:24px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-lg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.auth-brand{display:flex;align-items:center;gap:.7rem;margin-bottom:22px}
.auth-brand img{width:44px;height:44px}
.auth-brand b{font-family:var(--font-hero);font-weight:400;font-size:1.7rem;letter-spacing:.06em;line-height:1;color:var(--navy)}
.auth-brand small{display:block;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.auth h1{font-size:1.5rem;margin-bottom:.3rem}
.auth .sub{color:var(--muted);margin-bottom:20px;font-size:.95rem}
.alert{display:flex;gap:.6rem;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:.9rem;margin-bottom:16px}
.alert .icon{margin-top:2px}
.alert.error{background:var(--danger-bg);color:#7A1409}
.alert.warn{background:var(--warn-bg);color:#5C4200}
.alert.info{background:#E6EEFF;color:#0F2F7A}
.link{background:none;border:0;padding:10px 0;color:var(--blue);font-weight:600;text-decoration:underline;min-height:44px}
.auth-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:.9rem}
.auth-foot a{color:var(--blue);font-weight:600;display:inline-flex;align-items:center;min-height:44px}

/* ===== Shell ===== */
.shell{min-height:100vh;min-height:100dvh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:60;display:flex;flex-direction:column;padding:20px 14px;background:linear-gradient(180deg,var(--navy),#0A1A40);color:#fff;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);overflow-y:auto}
.side.open{transform:none;box-shadow:var(--shadow-lg)}
.scrim{position:fixed;inset:0;background:rgba(6,21,52,.55);backdrop-filter:blur(3px);z-index:55;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.scrim.show{opacity:1;visibility:visible}
.s-brand{display:flex;align-items:center;gap:.65rem;padding:4px 8px 22px}
.s-brand img{width:38px;height:38px}
.s-brand b{font-family:var(--font-hero);font-weight:400;font-size:1.45rem;letter-spacing:.07em;line-height:1}
.s-brand small{display:block;color:#9FB4E0;font-size:.72rem}
.s-nav{display:grid;gap:4px}
.s-nav a,.s-nav button{display:flex;align-items:center;gap:.8rem;width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:#C9D6F2;text-decoration:none;font-family:var(--font-head);font-weight:700;font-size:.95rem;text-align:left;transition:background .2s,color .2s}
.s-nav a:hover,.s-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.s-nav a[aria-current="page"]{background:linear-gradient(135deg,rgba(21,83,232,.9),rgba(0,194,224,.55));color:#fff}
.s-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.s-user{padding:10px 14px;font-size:.82rem;color:#9FB4E0;overflow-wrap:anywhere}
.top{position:sticky;top:0;z-index:40;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{padding:20px 16px 56px;max-width:1280px}
@media(min-width:960px){
  .side{transform:none;box-shadow:none}
  .scrim{display:none}
  .top,.main-wrap{margin-left:var(--side)}
  .top{padding:0 32px}
  .main{padding:28px 32px 64px}
  #menuBtn{display:none}
}

/* Stats */
.stats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);margin-bottom:26px}
@media(min-width:760px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{padding:18px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;margin-bottom:12px;background:rgba(21,83,232,.1);color:var(--blue)}
.stat.s-ok .ico{background:var(--ok-bg);color:var(--ok)}
.stat.s-warn .ico{background:var(--warn-bg);color:var(--warn)}
.stat.s-hid .ico{background:var(--hid-bg);color:var(--hid)}
.stat.s-cat .ico{background:#DDF6FA;color:#046B7C}
.stat b{display:block;font-family:var(--font-head);font-weight:800;font-size:2rem;line-height:1;color:var(--navy)}
.stat span{display:block;margin-top:6px;color:var(--muted);font-size:.86rem;font-weight:500}
.stat.load b{color:transparent;background:linear-gradient(90deg,#E8EEF9 25%,#F4F7FC 50%,#E8EEF9 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:8px;width:3ch}
@keyframes sh{to{background-position:-200% 0}}

/* Panel & toolbar */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.p-head{display:flex;flex-direction:column;gap:14px;padding:18px;border-bottom:1px solid var(--line)}
.p-head h2{font-size:1.2rem}
.tools{display:grid;gap:10px}
.search{position:relative}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:42px}
@media(min-width:760px){
  .p-head{flex-direction:row;align-items:center;justify-content:space-between;padding:20px 22px}
  .tools{grid-template-columns:minmax(220px,1fr) 190px 170px;flex:1;max-width:760px}
}

/* Jadual → kad pada mobile */
.tbl{width:100%;border-collapse:collapse}
.tbl thead{display:none}
.tbl tbody{display:grid;gap:12px;padding:14px}
.tbl tr{display:grid;grid-template-columns:84px 1fr;gap:4px 14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.tbl td{padding:0;min-width:0}
.tbl td.c-img{grid-row:span 3}
.tbl td.c-meta,.tbl td.c-act{grid-column:1/-1}
.tbl td[data-label]::before{content:attr(data-label)": ";font-size:.78rem;color:var(--muted);font-weight:600}
.tbl td.c-img::before,.tbl td.c-name::before,.tbl td.c-act::before{content:none}
.tbl td.c-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.t-img{width:84px;aspect-ratio:16/10;border-radius:10px;object-fit:cover;background:var(--navy)}
.t-name{font-family:var(--font-head);font-weight:800;color:var(--navy);overflow-wrap:anywhere}
.t-slug{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem;border-radius:999px;font-family:var(--font-head);font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.active{background:var(--ok-bg);color:var(--ok)}
.pill.coming-soon{background:var(--warn-bg);color:var(--warn)}
.pill.hidden{background:var(--hid-bg);color:var(--hid)}
@media(min-width:900px){
  .tbl thead{display:table-header-group}
  .tbl th{padding:12px 16px;text-align:left;font-family:var(--font-head);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#F7F9FD;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl tbody{display:table-row-group;padding:0}
  .tbl tr{display:table-row;border:0;border-radius:0;padding:0}
  .tbl td{display:table-cell;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl td[data-label]::before{content:none}
  .tbl td.c-act{display:table-cell;border-top:0;margin:0;white-space:nowrap}
  .tbl td.c-act .acts{display:flex;gap:6px}
  .tbl td.c-img{width:110px}.t-img{width:96px}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr:hover td{background:#FAFCFF}
}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.tbl td.c-act .acts{display:contents}
@media(min-width:900px){.tbl td.c-act .acts{display:flex}}
.state{text-align:center;padding:48px 20px}
.state .ico{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 14px;border-radius:18px;background:rgba(21,83,232,.1);color:var(--blue)}
.state h3{font-size:1.15rem;margin-bottom:.35rem}
.state p{color:var(--muted);max-width:28rem;margin:0 auto 16px}
.p-foot{padding:12px 22px;font-size:.84rem;color:var(--muted);border-top:1px solid var(--line)}

/* Dialog */
dialog.dlg{border:0;padding:0;border-radius:22px;width:calc(100vw - 24px);max-width:640px;max-height:calc(100dvh - 24px);background:#fff;box-shadow:var(--shadow-lg);color:var(--text)}
dialog.dlg::backdrop{background:rgba(6,21,52,.6);backdrop-filter:blur(4px)}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.sm{max-width:440px}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 16px 22px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.2rem}
.d-body{padding:20px 22px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.d-foot{display:flex;flex-direction:column-reverse;gap:10px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#F9FBFF}
@media(min-width:520px){.d-foot{flex-direction:row;justify-content:flex-end}}
.up{display:grid;gap:12px}
.up-prev{aspect-ratio:16/10;border-radius:14px;border:2px dashed #B9C8E4;background:#F4F7FC;display:grid;place-items:center;overflow:hidden;color:var(--muted);text-align:center;font-size:.88rem;padding:10px}
.up-prev img{width:100%;height:100%;object-fit:cover}
.up-btns{display:flex;flex-wrap:wrap;gap:8px}
.prog{height:8px;border-radius:8px;background:#E3EAF7;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s}
.meta-dates{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.84rem;color:var(--muted);margin-top:4px}
.del-body{text-align:center;padding:28px 24px 8px}
.del-body .ico{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 14px;border-radius:18px;background:var(--danger-bg);color:var(--danger)}
.del-body p{color:var(--muted);margin-top:.5rem}

/* Toast */
.toasts{position:fixed;z-index:300;inset:auto 12px calc(12px + env(safe-area-inset-bottom)) 12px;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:.6rem;align-items:center;max-width:460px;width:100%;padding:13px 16px;border-radius:14px;background:var(--navy);color:#fff;box-shadow:var(--shadow-lg);font-size:.92rem;animation:tin .25s ease-out}
.toast.ok{background:#0B5A3A}.toast.err{background:#8F1A10}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.banner{padding:10px 16px;background:#FFF1CF;color:#5C4200;font-size:.88rem;text-align:center;font-weight:500}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

<body>
<div id="boot" class="auth" role="status"><div class="auth-card" style="text-align:center"><div class="spin" style="margin:0 auto 12px;width:28px;height:28px;border-color:rgba(21,83,232,.2);border-top-color:var(--blue)"></div><p>Memuatkan Admin Panel…</p></div></div>

<!-- ============ LOG MASUK ============ -->
<main id="authView" class="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><img data-logo alt="" width="44" height="44"><div><b>GENIUS DIGITAL</b><small>Admin Panel</small></div></div>
    <h1>Log masuk admin</h1>
    <p class="sub">Gunakan akaun Firebase Authentication yang diberi akses admin.</p>

    <div class="alert warn" id="cfgWarn" hidden>

      <button class="btn btn-ghost" style="width:100%" id="demoBtn" type="button">Lihat UI demo (tanpa Firebase)</button>

<!-- ============ APLIKASI ============ -->
<div class="shell" id="appView" hidden>
  <aside class="side" id="side" aria-label="Menu admin">

    <nav class="s-nav">
      <a href="#dashboard" id="navDash" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a>
      <a href="#products" id="navProd"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>Products</a>
      <a href="index.html" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>Lihat Website</a>
    </nav>
    <div class="s-foot">
      <div class="s-user" id="userLabel"></div>
      <div class="s-nav"><button id="logoutBtn" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Log Keluar</button></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main-wrap">

      <button class="btn btn-ghost btn-icon" id="menuBtn" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="side"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="pageTitle">Dashboard</h1>
      <button class="btn btn-primary btn-sm" id="addBtnTop" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add Product</span></button>

<!-- Modal tambah/edit -->
<dialog class="dlg" id="formDlg" aria-labelledby="formTitle">
  <form id="productForm" novalidate method="dialog" style="display:flex;flex-direction:column;min-height:0;flex:1">
    <div class="d-head"><h2 id="formTitle">Add Product</h2><button class="btn btn-ghost btn-icon" type="button" id="formX" aria-label="Tutup"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="d-body">
      <div class="alert error" id="formErr" role="alert" hidden></div>
      <div class="field"><label for="fName">Product Name <span class="req">*</span></label><input class="input" id="fName" maxlength="80" required><div class="err" id="eName" hidden></div></div>
      <div class="row2">
        <div class="field"><label for="fSlug">Product Slug <span class="req">*</span></label><input class="input" id="fSlug" maxlength="80" autocapitalize="none" spellcheck="false" required><div class="hint">Huruf kecil, nombor dan sempang. Contoh: qr-me-generator</div><div class="err" id="eSlug" hidden></div></div>
        <div class="field"><label for="fCategory">Product Category <span class="req">*</span></label><input class="input" id="fCategory" list="catList" maxlength="40" required><datalist id="catList"></datalist><div class="err" id="eCategory" hidden></div></div>
      </div>

    async remove(p) {
      await fsM.deleteDoc(fsM.doc(col, p.id));
      if (p.thumbnailPath) await deleteThumb(p.thumbnailPath).catch(e => { console.warn(e); toast("Produk dipadam, tetapi imej dalam Storage gagal dipadam.", "err"); });
    },
    async reorder(changes) {
      const b = fsM.writeBatch(db);
      changes.forEach(c => b.update(fsM.doc(col, c.id), { displayOrder: c.displayOrder, updatedAt: fsM.serverTimestamp() }));
      await b.commit();
    },
    async seed() {                       // idempotent: ID dokumen = slug, hanya ditulis jika belum wujud
      let n = 0;
      for (const s of SEED) {
        const ref = fsM.doc(col, s.slug);
        if ((await fsM.getDoc(ref)).exists()) continue;
        await fsM.setDoc(ref, { ...s, thumbnailURL: "", thumbnailPath: "", createdAt: fsM.serverTimestamp(), updatedAt: fsM.serverTimestamp() }); n++;
      }
      return n;
    }
  };
}

function createDemoApi() {
  let list = [], subs = new Set(), n = 0;
  const now = () => ({ toDate: () => new Date() });
  const emit = () => subs.forEach(cb => cb(list.map(x => ({ ...x }))));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  list = SEED.map((s, i) => ({ id: "demo" + i, ...s, thumbnailURL: "", thumbnailPath: "", createdAt: now(), updatedAt: now() }));
  return {
    mode: "demo",
    onAuth(cb) { this._cb = cb; },
    enter() { this._cb({ email: "demo (tanpa Firebase)", isAdmin: true }); },
    signIn() { throw Object.assign(new Error("demo"), { code: "demo/no-auth" }); },
    signOut: async function () { this._cb(null); },
    resetPassword: async () => {},
    subscribe(cb) { subs.add(cb); setTimeout(emit, 350); return () => subs.delete(cb); },
    async save(id, data, { file, removeImage, onProgress } = {}) {
      for (const p of [.3, .7, 1]) { if (file) { onProgress?.(p); await sleep(120); } }
      const extra = file ? { thumbnailURL: URL.createObjectURL(file), thumbnailPath: "demo/" + file.name } : removeImage ? { thumbnailURL: "", thumbnailPath: "" } : {};
      if (id) list = list.map(p => p.id === id ? { ...p, ...data, ...extra, updatedAt: now() } : p);
      else list.push({ id: "demo-n" + ++n, thumbnailURL: "", thumbnailPath: "", ...data, ...extra, createdAt: now(), updatedAt: now() });
      emit();
    },
    async remove(p) { await sleep(150); list = list.filter(x => x.id !== p.id); emit(); },
    async reorder(ch) { ch.forEach(c => { const p = list.find(x => x.id === c.id); if (p) p.displayOrder = c.displayOrder; }); list.sort((a, b) => a.displayOrder - b.displayOrder); emit(); },
    async seed() { const miss = SEED.filter(s => !list.some(p => p.slug === s.slug)); miss.forEach((s, i) => list.push({ id: "demo-s" + i + s.slug, ...s, thumbnailURL: "", thumbnailPath: "", createdAt: now(), updatedAt: now() })); emit(); return miss.length; }
  };
}

  if (!name) bad("Name", "Nama produk diperlukan.", F.name);
  if (!slug) bad("Slug", "Slug diperlukan.", F.slug);
  else if (!SLUG_RE.test(slug)) bad("Slug", "Slug hanya boleh huruf kecil, nombor dan sempang (bukan di hujung).", F.slug);

<script type="text/plain" id="src-2">rules_version = '2';

// Genius Digital — Cloud Firestore Security Rules
// Admin = pengguna Firebase Authentication yang mempunyai custom claim `admin: true`
// (ditetapkan melalui Admin SDK di server/komputer anda sahaja — lihat scripts/set-admin.js).
// Klien (browser) TIDAK boleh menetapkan claim ini.

service cloud.firestore {
  match /databases/{database}/documents {

    function isAdmin() {
      return request.auth != null && request.auth.token.admin == true;
    }

    function validProduct(d) {
      return d.keys().hasOnly(['name', 'slug', 'category', 'description', 'thumbnailURL', 'thumbnailPath',
                               'status', 'productURL', 'displayOrder', 'createdAt', 'updatedAt'])
        && d.name is string && d.name.size() > 0 && d.name.size() <= 80
        && d.slug is string && d.slug.matches('^[a-z0-9]+(-[a-z0-9]+)*$') && d.slug.size() <= 80
        && d.category is string && d.category.size() > 0 && d.category.size() <= 40
        && d.description is string && d.description.size() > 0 && d.description.size() <= 500
        && d.thumbnailURL is string && d.thumbnailURL.size() <= 2000
        && (!('thumbnailPath' in d) || (d.thumbnailPath is string && d.thumbnailPath.size() <= 300))
        && d.status in ['active', 'coming-soon', 'hidden']
        && d.productURL is string && d.productURL.size() <= 300
        && (d.productURL == '' || d.productURL.matches('^https?://.+'))
        && d.displayOrder is int && d.displayOrder >= 0 && d.displayOrder <= 9999
        && d.updatedAt is timestamp;
    }

    match /products/{productId} {
      // Awam: hanya produk yang dipaparkan (Hidden tidak boleh dibaca).
      // Query awam MESTI menapis: where('status','in',['active','coming-soon']).
      allow get, list: if resource.data.status in ['active', 'coming-soon'] || isAdmin();

      // Tulis: admin sahaja + data mesti sah.
      allow create: if isAdmin() && validProduct(request.resource.data)
                    && request.resource.data.createdAt is timestamp;
      allow update: if isAdmin() && validProduct(request.resource.data)
                    && request.resource.data.createdAt == resource.data.createdAt;
      allow delete: if isAdmin();
    }

    // Semua laluan lain ditutup.
    match /{document=**} {
      allow read, write: if false;
    }
  }
}

drawer.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setDrawer(false)));
addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
matchMedia("(min-width:860px)").addEventListener("change", e => e.matches && setDrawer(false));

// Scroll reveal
const revealObs = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); revealObs.unobserve(e.target); } }), { threshold: .12, rootMargin: "0px 0px -40px 0px" })
  : null;
function observeReveal(root = document) {
  root.querySelectorAll(".rv:not(.in)").forEach(n => revealObs ? revealObs.observe(n) : n.classList.add("in"));
}
observeReveal();

// Tilt 3D kad (penunjuk halus sahaja; tiada pada skrin sentuh / reduced motion)
const canTilt = matchMedia("(hover:hover) and (pointer:fine)").matches && !reducedMotion;
function attachTilt(card) {
  if (!canTilt) return;
  let raf = 0;
  card.addEventListener("pointermove", e => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `perspective(900px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg) translateY(-6px)`;
    });
  });
  card.addEventListener("pointerleave", () => { cancelAnimationFrame(raf); card.style.transform = ""; });
}

// Modal "Product Coming Soon"
const modal = $("#soonModal");
function openComingSoon(name) {
  $("#soonName").textContent = name || "";
  if (typeof modal.showModal === "function") modal.showModal(); else modal.setAttribute("open", "");
}
$("#soonClose").addEventListener("click", () => modal.close ? modal.close() : modal.removeAttribute("open"));
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });

/* ---------- 3) Contact (dari GENIUS_CONFIG) ---------- */
(function renderContact() {
  const c = CFG.contact || {};
  const grid = $("#contactGrid"), social = $("#socialRow");
  const items = [
    { label: "Emel", value: c.email, href: c.email && "mailto:" + c.email, ph: "Emel syarikat — akan dikemas kini", icon: ICONS.mail },
    { label: "WhatsApp", value: c.whatsapp && "+" + c.whatsapp, href: c.whatsapp && "https://wa.me/" + c.whatsapp.replace(/\D/g, ""), ph: "Nombor WhatsApp — akan dikemas kini", icon: ICONS.chat }
  ];
  const socials = [
    { label: "Facebook", href: c.facebook }, { label: "Instagram", href: c.instagram }, { label: "LinkedIn", href: c.linkedin }
  ];
  items.forEach(i => {
    const body = [el("span", { class: "ico" }, icon(i.icon, "22px")),
      el("span", {}, el("small", { text: i.label }), el("strong", { text: i.value || i.ph }))];
    grid.append(i.href ? el("a", { class: "c-item", href: i.href, target: "_blank", rel: "noopener" }, body)
                       : el("div", { class: "c-item pending" }, body));
  });
  const soc = socials.map(s => s.href
    ? el("a", { class: "s", href: s.href, target: "_blank", rel: "noopener" }, icon(ICONS.link), s.label)
    : el("span", { class: "s pending", title: "Placeholder — akan dikemas kini" }, icon(ICONS.link), s.label + " (akan datang)"));
  const pendingCount = socials.filter(s => !s.href).length;
  // Letak kad Social Media dalam grid
  grid.append(el("div", { class: "c-item pending" }, el("span", { class: "ico" }, icon(ICONS.link, "22px")),
    el("span", {}, el("small", { text: "Social Media" }), el("strong", { text: pendingCount === 3 ? "Akaun akan dikemas kini" : "Ikuti kami" }))));
  social.append(...soc);
})();

/* ---------- 4) Data produk ---------- */
const grid = $("#productGrid");
const DEMO_PRODUCTS = [
  { id: "demo-qr", name: "QR Me Generator", slug: "qr-me-generator", category: "Digital Tools", status: "active", displayOrder: 1, thumbnailURL: "",
    description: "Sistem penjana kod QR yang membolehkan pengguna menghasilkan QR Code dengan mudah, pantas dan praktikal untuk pelbagai kegunaan.", productURL: "" },
  { id: "demo-pdf", name: "Malaysia PDF Tools", slug: "malaysia-pdf-tools", category: "Productivity Tools", status: "coming-soon", displayOrder: 2, thumbnailURL: "",
    description: "Platform pengurusan dokumen PDF yang menyediakan pelbagai fungsi untuk membantu pengguna mengurus, memproses dan menghasilkan dokumen secara lebih mudah dan efisien.", productURL: "" }
];

function renderLoading() {
  grid.setAttribute("aria-busy", "true"); grid.replaceChildren(
    ...[0, 1, 2].map(() => el("div", { class: "skeleton", "aria-hidden": "true" }, el("div", { class: "s-img" }),
      el("div", { class: "s-body" }, el("div", { class: "s-line", style: "width:35%" }), el("div", { class: "s-line", style: "width:70%;height:22px" }), el("div", { class: "s-line" }), el("div", { class: "s-line", style: "width:80%" })))));
  grid.prepend(el("p", { class: "sr-only", text: "Memuatkan produk…" }));
}
function renderState(kind, title, text, retry) {
  grid.setAttribute("aria-busy", "false");
  const ic = kind === "error" ? ICONS.alert : ICONS.box;
  grid.replaceChildren(el("div", { class: "state", role: kind === "error" ? "alert" : null },
    el("div", { class: "ico" }, icon(ic, "30px")), el("h3", { text: title }), el("p", { text }),
    retry ? el("button", { class: "btn btn-primary", type: "button", onclick: "" , id: "retryBtn" }, "Cuba lagi") : null));
  if (retry) $("#retryBtn").addEventListener("click", retry);
}
// Thumbnail: URL admin → fail aset ikut slug → penjana SVG generik (tiada gambar rosak)
function genericThumb(name) {
  const initials = (name || "GD").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1F4B"/><stop offset=".6" stop-color="#1553E8"/><stop offset="1" stop-color="#00C2E0"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/><text x="400" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="190" fill="#fff" fill-opacity=".9">${initials}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function thumbSrc(p) {
  if (p.thumbnailURL) return p.thumbnailURL;
  if (THUMBS[p.slug]) return THUMBS[p.slug];
  return genericThumb(p.name);
}
function productCard(p, i) {
  const soon = p.status === "coming-soon";
  const img = el("img", { src: thumbSrc(p), alt: `Thumbnail ${p.name}`, loading: i > 1 ? "lazy" : "eager", decoding: "async", width: 800, height: 500 });
  let triedFallback = false;
  img.addEventListener("error", () => { if (triedFallback) return; triedFallback = true; img.src = genericThumb(p.name); });
  const btn = el("button", { class: "btn btn-primary", type: "button", "aria-label": `Explore Product: ${p.name}` }, "Explore Product", icon(ICONS.arrow));
  btn.addEventListener("click", () => openProduct(p));
  const card = el("article", { class: "card rv", style: `--d:${Math.min(i, 5) * .08}s`, "data-slug": p.slug },
    el("div", { class: "thumb" }, img, el("span", { class: "badge " + (soon ? "coming-soon" : "active") }, el("i"), soon ? "Coming Soon" : "Available")),
    el("div", { class: "body" }, el("span", { class: "cat", text: p.category || "Digital Product" }), el("h3", { text: p.name }), el("p", { text: p.description || "" }), btn));
  attachTilt(card);
  return card;
}
/* Titik sambungan masa depan: bila setiap produk ada halaman sendiri, tukar productPagesEnabled
   dalam GENIUS_CONFIG. Buat masa ini semua butang memaparkan "Product Coming Soon." */
function openProduct(p) {
  if (CFG.productPagesEnabled && p.status === "active" && p.productURL) {
    window.open(p.productURL, "_blank", "noopener"); return;
  }
  openComingSoon(p.name);
}
function renderProducts(list) {
  const visible = list.filter(p => p.status === "active" || p.status === "coming-soon")
    .sort((a, b) => (a.displayOrder ?? 9999) - (b.displayOrder ?? 9999) || (a.name || "").localeCompare(b.name || ""));
  grid.setAttribute("aria-busy", "false");
  if (!visible.length) return renderState("empty", "Produk akan datang", "Belum ada produk dipaparkan buat masa ini. Sila kembali tidak lama lagi.");
  grid.replaceChildren(...visible.map(productCard));
  observeReveal(grid);
}

async function start() {
  renderLoading();
  if (!firebaseReady) {
    $("#demoNotice").hidden = false;
    setTimeout(() => renderProducts(DEMO_PRODUCTS), 450); // simulasi muat ringkas
    return;
  }
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VER}`;
    const [{ initializeApp }, fs] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-firestore.js`)]);
    const app = initializeApp(FB);
    const db = fs.getFirestore(app);
    // Hanya status yang dibenarkan rules awam (hidden tidak boleh dibaca). Susun di klien: elak indeks komposit.
    const q = fs.query(fs.collection(db, "products"), fs.where("status", "in", ["active", "coming-soon"]));
    fs.onSnapshot(q,
      snap => renderProducts(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => { console.error(err); renderState("error", "Tidak dapat memuatkan produk", err.code === "permission-denied" ? "Akses ditolak. Semak Firestore Security Rules." : "Sila semak sambungan internet anda dan cuba lagi.", start); });
  } catch (err) {
    console.error(err);
    renderState("error", "Tidak dapat menyambung ke Firebase", "Sila semak sambungan internet atau konfigurasi Firebase dalam GENIUS_CONFIG.", start);
  }
}
start();
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="pv-admin"><!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Panel — Genius Digital</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1F4B">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3 56 17v30L32 61 8 47V17z' fill='%230B1F4B'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2300C2E0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0B1F4B; --navy-2:#13306F; --blue:#1553E8; --blue-2:#3B7BFF; --cyan:#00C2E0;
  --bg:#F4F7FC; --surface:#fff; --text:#0B1F4B; --muted:#41506B; --line:#DCE5F3;
  --ok:#0E7A4F; --ok-bg:#E3F6EC; --warn:#8A5A00; --warn-bg:#FFF1CF; --danger:#B42318; --danger-bg:#FDE8E6; --hid:#41506B; --hid-bg:#E8EDF6;
  --radius:18px; --shadow-sm:0 2px 10px rgba(11,31,75,.06); --shadow:0 12px 34px rgba(11,31,75,.10); --shadow-lg:0 26px 60px rgba(11,31,75,.22);
  --font-hero:'Bebas Neue',Impact,sans-serif; --font-head:'Manrope',system-ui,sans-serif; --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --side:264px; --top:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55;color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-head);margin:0;color:var(--navy);line-height:1.2}
p{margin:0}
img,svg{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px;border-radius:6px}
.icon{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Butang */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.65rem 1.2rem;border-radius:12px;border:1.5px solid transparent;font-family:var(--font-head);font-weight:700;font-size:.93rem;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--blue),#2D6BFF);color:#fff;box-shadow:0 8px 20px rgba(21,83,232,.28)}
.btn-primary:hover:not([disabled]){box-shadow:0 12px 26px rgba(21,83,232,.4)}
.btn-ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn-ghost:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not([disabled]){background:#8F1A10}
.btn-sm{min-height:44px;min-width:44px;padding:.4rem .8rem;font-size:.86rem}
.btn-icon{padding:0;width:44px}
.spin{width:1.1em;height:1.1em;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
.btn-ghost .spin{border-color:rgba(11,31,75,.2);border-top-color:var(--blue)}
@keyframes rot{to{transform:rotate(360deg)}}

/* Borang */
label{display:block;font-family:var(--font-head);font-weight:700;font-size:.88rem;margin-bottom:.4rem}
.req{color:var(--danger)}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:.7rem .9rem;border-radius:12px;border:1.5px solid #C5D2EA;background:#fff;color:var(--text);font:inherit;font-size:16px;transition:border-color .2s,box-shadow .2s}
textarea.input{min-height:110px;resize:vertical}
.input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,83,232,.15)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:.82rem;color:var(--muted);margin-top:.35rem}
.err{font-size:.84rem;color:var(--danger);margin-top:.35rem;font-weight:500}
.field{margin-bottom:16px}
.row2{display:grid;gap:0 16px}
@media(min-width:600px){.row2{grid-template-columns:1fr 1fr}}

/* ===== Skrin log masuk ===== */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(160deg,#EAF1FF,#F4F7FC)}
.auth::before{content:"";position:absolute;width:60vmax;height:60vmax;max-width:640px;max-height:640px;right:-20%;top:-25%;background:radial-gradient(circle,rgba(59,123,255,.45),transparent 65%);filter:blur(60px);z-index:-1}
.auth::after{content:"";position:absolute;width:48vmax;height:48vmax;max-width:520px;max-height:520px;left:-18%;bottom:-25%;background:radial-gradient(circle,rgba(0,194,224,.4),transparent 65%);filter:blur(60px);z-index:-1}
.auth-card{width:100%;max-width:420px;padding:clamp(24px,6vw,36px);border-radius:24px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-lg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.auth-brand{display:flex;align-items:center;gap:.7rem;margin-bottom:22px}
.auth-brand img{width:44px;height:44px}
.auth-brand b{font-family:var(--font-hero);font-weight:400;font-size:1.7rem;letter-spacing:.06em;line-height:1;color:var(--navy)}
.auth-brand small{display:block;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.auth h1{font-size:1.5rem;margin-bottom:.3rem}
.auth .sub{color:var(--muted);margin-bottom:20px;font-size:.95rem}
.alert{display:flex;gap:.6rem;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:.9rem;margin-bottom:16px}
.alert .icon{margin-top:2px}
.alert.error{background:var(--danger-bg);color:#7A1409}
.alert.warn{background:var(--warn-bg);color:#5C4200}
.alert.info{background:#E6EEFF;color:#0F2F7A}
.link{background:none;border:0;padding:10px 0;color:var(--blue);font-weight:600;text-decoration:underline;min-height:44px}
.auth-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:.9rem}
.auth-foot a{color:var(--blue);font-weight:600;display:inline-flex;align-items:center;min-height:44px}

/* ===== Shell ===== */
.shell{min-height:100vh;min-height:100dvh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:60;display:flex;flex-direction:column;padding:20px 14px;background:linear-gradient(180deg,var(--navy),#0A1A40);color:#fff;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);overflow-y:auto}
.side.open{transform:none;box-shadow:var(--shadow-lg)}
.scrim{position:fixed;inset:0;background:rgba(6,21,52,.55);backdrop-filter:blur(3px);z-index:55;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.scrim.show{opacity:1;visibility:visible}
.s-brand{display:flex;align-items:center;gap:.65rem;padding:4px 8px 22px}
.s-brand img{width:38px;height:38px}
.s-brand b{font-family:var(--font-hero);font-weight:400;font-size:1.45rem;letter-spacing:.07em;line-height:1}
.s-brand small{display:block;color:#9FB4E0;font-size:.72rem}
.s-nav{display:grid;gap:4px}
.s-nav a,.s-nav button{display:flex;align-items:center;gap:.8rem;width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:#C9D6F2;text-decoration:none;font-family:var(--font-head);font-weight:700;font-size:.95rem;text-align:left;transition:background .2s,color .2s}
.s-nav a:hover,.s-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.s-nav a[aria-current="page"]{background:linear-gradient(135deg,rgba(21,83,232,.9),rgba(0,194,224,.55));color:#fff}
.s-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.s-user{padding:10px 14px;font-size:.82rem;color:#9FB4E0;overflow-wrap:anywhere}
.top{position:sticky;top:0;z-index:40;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{padding:20px 16px 56px;max-width:1280px}
@media(min-width:960px){
  .side{transform:none;box-shadow:none}
  .scrim{display:none}
  .top,.main-wrap{margin-left:var(--side)}
  .top{padding:0 32px}
  .main{padding:28px 32px 64px}
  #menuBtn{display:none}
}

/* Stats */
.stats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);margin-bottom:26px}
@media(min-width:760px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{padding:18px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;margin-bottom:12px;background:rgba(21,83,232,.1);color:var(--blue)}
.stat.s-ok .ico{background:var(--ok-bg);color:var(--ok)}
.stat.s-warn .ico{background:var(--warn-bg);color:var(--warn)}
.stat.s-hid .ico{background:var(--hid-bg);color:var(--hid)}
.stat.s-cat .ico{background:#DDF6FA;color:#046B7C}
.stat b{display:block;font-family:var(--font-head);font-weight:800;font-size:2rem;line-height:1;color:var(--navy)}
.stat span{display:block;margin-top:6px;color:var(--muted);font-size:.86rem;font-weight:500}
.stat.load b{color:transparent;background:linear-gradient(90deg,#E8EEF9 25%,#F4F7FC 50%,#E8EEF9 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:8px;width:3ch}
@keyframes sh{to{background-position:-200% 0}}

/* Panel & toolbar */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.p-head{display:flex;flex-direction:column;gap:14px;padding:18px;border-bottom:1px solid var(--line)}
.p-head h2{font-size:1.2rem}
.tools{display:grid;gap:10px}
.search{position:relative}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:42px}
@media(min-width:760px){
  .p-head{flex-direction:row;align-items:center;justify-content:space-between;padding:20px 22px}
  .tools{grid-template-columns:minmax(220px,1fr) 190px 170px;flex:1;max-width:760px}
}

/* Jadual → kad pada mobile */
.tbl{width:100%;border-collapse:collapse}
.tbl thead{display:none}
.tbl tbody{display:grid;gap:12px;padding:14px}
.tbl tr{display:grid;grid-template-columns:84px 1fr;gap:4px 14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.tbl td{padding:0;min-width:0}
.tbl td.c-img{grid-row:span 3}
.tbl td.c-meta,.tbl td.c-act{grid-column:1/-1}
.tbl td[data-label]::before{content:attr(data-label)": ";font-size:.78rem;color:var(--muted);font-weight:600}
.tbl td.c-img::before,.tbl td.c-name::before,.tbl td.c-act::before{content:none}
.tbl td.c-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.t-img{width:84px;aspect-ratio:16/10;border-radius:10px;object-fit:cover;background:var(--navy)}
.t-name{font-family:var(--font-head);font-weight:800;color:var(--navy);overflow-wrap:anywhere}
.t-slug{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem;border-radius:999px;font-family:var(--font-head);font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.active{background:var(--ok-bg);color:var(--ok)}
.pill.coming-soon{background:var(--warn-bg);color:var(--warn)}
.pill.hidden{background:var(--hid-bg);color:var(--hid)}
@media(min-width:900px){
  .tbl thead{display:table-header-group}
  .tbl th{padding:12px 16px;text-align:left;font-family:var(--font-head);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#F7F9FD;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl tbody{display:table-row-group;padding:0}
  .tbl tr{display:table-row;border:0;border-radius:0;padding:0}
  .tbl td{display:table-cell;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl td[data-label]::before{content:none}
  .tbl td.c-act{display:table-cell;border-top:0;margin:0;white-space:nowrap}
  .tbl td.c-act .acts{display:flex;gap:6px}
  .tbl td.c-img{width:110px}.t-img{width:96px}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr:hover td{background:#FAFCFF}
}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.tbl td.c-act .acts{display:contents}
@media(min-width:900px){.tbl td.c-act .acts{display:flex}}
.state{text-align:center;padding:48px 20px}
.state .ico{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 14px;border-radius:18px;background:rgba(21,83,232,.1);color:var(--blue)}
.state h3{font-size:1.15rem;margin-bottom:.35rem}
.state p{color:var(--muted);max-width:28rem;margin:0 auto 16px}
.p-foot{padding:12px 22px;font-size:.84rem;color:var(--muted);border-top:1px solid var(--line)}

/* Dialog */
dialog.dlg{border:0;padding:0;border-radius:22px;width:calc(100vw - 24px);max-width:640px;max-height:calc(100dvh - 24px);background:#fff;box-shadow:var(--shadow-lg);color:var(--text)}
dialog.dlg::backdrop{background:rgba(6,21,52,.6);backdrop-filter:blur(4px)}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.sm{max-width:440px}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 16px 22px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:1.2rem}
.d-body{padding:20px 22px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.d-foot{display:flex;flex-direction:column-reverse;gap:10px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#F9FBFF}
@media(min-width:520px){.d-foot{flex-direction:row;justify-content:flex-end}}
.up{display:grid;gap:12px}
.up-prev{aspect-ratio:16/10;border-radius:14px;border:2px dashed #B9C8E4;background:#F4F7FC;display:grid;place-items:center;overflow:hidden;color:var(--muted);text-align:center;font-size:.88rem;padding:10px}
.up-prev img{width:100%;height:100%;object-fit:cover}
.up-btns{display:flex;flex-wrap:wrap;gap:8px}
.prog{height:8px;border-radius:8px;background:#E3EAF7;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s}
.meta-dates{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.84rem;color:var(--muted);margin-top:4px}
.del-body{text-align:center;padding:28px 24px 8px}
.del-body .ico{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 14px;border-radius:18px;background:var(--danger-bg);color:var(--danger)}
.del-body p{color:var(--muted);margin-top:.5rem}

/* Toast */
.toasts{position:fixed;z-index:300;inset:auto 12px calc(12px + env(safe-area-inset-bottom)) 12px;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:.6rem;align-items:center;max-width:460px;width:100%;padding:13px 16px;border-radius:14px;background:var(--navy);color:#fff;box-shadow:var(--shadow-lg);font-size:.92rem;animation:tin .25s ease-out}
.toast.ok{background:#0B5A3A}.toast.err{background:#8F1A10}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.banner{padding:10px 16px;background:#FFF1CF;color:#5C4200;font-size:.88rem;text-align:center;font-weight:500}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

/* ---------- 2) Lapisan data ----------
   Antara muka sama untuk Firebase dan Demo:
   onAuth(cb) signIn(e,p) signOut() resetPassword(e)
   subscribe(cb,errCb)->unsub  save(id|null,data,{file,removeImage,onProgress})  remove(product)
   reorder([{id,displayOrder}])  seed()->bilangan dimasukkan                                      */
async function createFirebaseApi() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VER}`;
  const [appM, authM, fsM, stM] = await Promise.all([
    import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`),
    import(`${base}/firebase-firestore.js`), import(`${base}/firebase-storage.js`)]);
  const app = appM.initializeApp(FB);
  const auth = authM.getAuth(app), db = fsM.getFirestore(app), storage = stM.getStorage(app);
  const col = fsM.collection(db, "products");

  async function uploadThumb(productId, file, onProgress) {
    const safe = file.name.toLowerCase().replace(/[^a-z0-9.]+/g, "-").slice(-60);
    const path = `products/${productId}/${Date.now()}-${safe}`;
    const task = stM.uploadBytesResumable(stM.ref(storage, path), file, { contentType: file.type });
    await new Promise((res, rej) => task.on("state_changed", s => onProgress && onProgress(s.bytesTransferred / s.totalBytes), rej, res));
    return { url: await stM.getDownloadURL(task.snapshot.ref), path };
  }
  async function deleteThumb(path) {
    if (!path) return;
    try { await stM.deleteObject(stM.ref(storage, path)); }
    catch (e) { if (e.code !== "storage/object-not-found") throw e; }
  }
  return {
    mode: "firebase",
    onAuth(cb) {
      return authM.onAuthStateChanged(auth, async user => {
        if (!user) return cb(null);
        try {
          const t = await user.getIdTokenResult(true);        // segarkan claim terkini
          cb({ email: user.email, isAdmin: t.claims.admin === true });
        } catch (e) { console.error(e); cb({ email: user.email, isAdmin: false, error: e }); }
      });
    },
    signIn: (e, p) => authM.signInWithEmailAndPassword(auth, e, p),
    signOut: () => authM.signOut(auth),
    resetPassword: e => authM.sendPasswordResetEmail(auth, e),
    subscribe(cb, errCb) {
      return fsM.onSnapshot(fsM.query(col, fsM.orderBy("displayOrder")), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), errCb);
    },
    async save(id, data, { file, removeImage, onProgress, old } = {}) {
      const ref = id ? fsM.doc(col, id) : fsM.doc(col);        // id baharu dijana dahulu untuk laluan Storage
      const payload = { ...data, updatedAt: fsM.serverTimestamp() };
      let uploaded = null;
      if (file) { uploaded = await uploadThumb(ref.id, file, onProgress); payload.thumbnailURL = uploaded.url; payload.thumbnailPath = uploaded.path; }
      else if (removeImage) { payload.thumbnailURL = ""; payload.thumbnailPath = ""; }
      try {
        if (id) await fsM.updateDoc(ref, payload);
        else await fsM.setDoc(ref, { thumbnailURL: "", thumbnailPath: "", ...payload, createdAt: fsM.serverTimestamp() });
      } catch (e) { if (uploaded) await deleteThumb(uploaded.path).catch(() => {}); throw e; } // elak fail yatim
      if ((file || removeImage) && old?.thumbnailPath) await deleteThumb(old.thumbnailPath).catch(e => console.warn("Imej lama tidak dapat dipadam", e));
      return ref.id;
    },
    async remove(p) {
      await fsM.deleteDoc(fsM.doc(col, p.id));
      if (p.thumbnailPath) await deleteThumb(p.thumbnailPath).catch(e => { console.warn(e); toast("Produk dipadam, tetapi imej dalam Storage gagal dipadam.", "err"); });
    },
    async reorder(changes) {
      const b = fsM.writeBatch(db);
      changes.forEach(c => b.update(fsM.doc(col, c.id), { displayOrder: c.displayOrder, updatedAt: fsM.serverTimestamp() }));
      await b.commit();
    },
    async seed() {                       // idempotent: ID dokumen = slug, hanya ditulis jika belum wujud
      let n = 0;
      for (const s of SEED) {
        const ref = fsM.doc(col, s.slug);
        if ((await fsM.getDoc(ref)).exists()) continue;
        await fsM.setDoc(ref, { ...s, thumbnailURL: "", thumbnailPath: "", createdAt: fsM.serverTimestamp(), updatedAt: fsM.serverTimestamp() }); n++;
      }
      return n;
    }
  };
}

function createDemoApi() {
  let list = [], subs = new Set(), n = 0;
  const now = () => ({ toDate: () => new Date() });
  const emit = () => subs.forEach(cb => cb(list.map(x => ({ ...x }))));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  list = SEED.map((s, i) => ({ id: "demo" + i, ...s, thumbnailURL: "", thumbnailPath: "", createdAt: now(), updatedAt: now() }));
  return {
    mode: "demo",
    onAuth(cb) { this._cb = cb; },
    enter() { this._cb({ email: "demo (tanpa Firebase)", isAdmin: true }); },
    signIn() { throw Object.assign(new Error("demo"), { code: "demo/no-auth" }); },
    signOut: async function () { this._cb(null); },
    resetPassword: async () => {},
    subscribe(cb) { subs.add(cb); setTimeout(emit, 350); return () => subs.delete(cb); },
    async save(id, data, { file, removeImage, onProgress } = {}) {
      for (const p of [.3, .7, 1]) { if (file) { onProgress?.(p); await sleep(120); } }
      const extra = file ? { thumbnailURL: URL.createObjectURL(file), thumbnailPath: "demo/" + file.name } : removeImage ? { thumbnailURL: "", thumbnailPath: "" } : {};
      if (id) list = list.map(p => p.id === id ? { ...p, ...data, ...extra, updatedAt: now() } : p);
      else list.push({ id: "demo-n" + ++n, thumbnailURL: "", thumbnailPath: "", ...data, ...extra, createdAt: now(), updatedAt: now() });
      emit();
    },
    async remove(p) { await sleep(150); list = list.filter(x => x.id !== p.id); emit(); },
    async reorder(ch) { ch.forEach(c => { const p = list.find(x => x.id === c.id); if (p) p.displayOrder = c.displayOrder; }); list.sort((a, b) => a.displayOrder - b.displayOrder); emit(); },
    async seed() { const miss = SEED.filter(s => !list.some(p => p.slug === s.slug)); miss.forEach((s, i) => list.push({ id: "demo-s" + i + s.slug, ...s, thumbnailURL: "", thumbnailPath: "", createdAt: now(), updatedAt: now() })); emit(); return miss.length; }
  };
}

  catch (err) { authMsg("err", AUTH_ERRORS[err.code] || "Tidak dapat menghantar emel."); }

$("#logoutBtn").addEventListener("click", () => api.signOut());

/* Navigasi / drawer */
const side = $("#side"), scrim = $("#scrim"), menuBtn = $("#menuBtn");
function setSide(open) { side.classList.toggle("open", open); scrim.classList.toggle("show", open); menuBtn.setAttribute("aria-expanded", String(open)); menuBtn.setAttribute("aria-label", open ? "Tutup menu" : "Buka menu"); }

  $("#navProd").toggleAttribute("aria-current", h === "products"); if (h === "products") $("#navProd").setAttribute("aria-current", "page");
