# Blueprint Render: pelayan muat turun Fetchr Box (pelan percuma).
# Dari telefon: render.com -> New -> Blueprint -> pilih repo ini -> Apply.
services:
  - type: web
    name: fetchrbox-server
    runtime: docker
    plan: free
    branch: claude/video-download-system-6g7ipu
    rootDir: sites/fetchrbox
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://fetchrbox-app-izzul.web.app,https://fetchrbox-admin-app-izzul.web.app
      - key: MAX_DURATION_MIN
        value: "60"
      - key: MAX_JOBS
        value: "2"
