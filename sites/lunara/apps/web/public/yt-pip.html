<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNARA MUSIC</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#m{width:100vw;height:100vh}</style>
</head>
<body>
<div id="m"></div>
<script>
// Hosts the YouTube player inside LUNARA's pop-out window (a real page on our domain, so YouTube
// knows who embeds it). The main app controls this player directly (same origin).
(function () {
  var q = new URLSearchParams(location.search);
  var ready = {};
  window.lunaraPipReady = new Promise(function (res, rej) { ready.res = res; ready.rej = rej; });
  window.lunaraPipState = null; // set by the app: function(state)
  window.lunaraPipError = null; // set by the app: function(code)
  window.onYouTubeIframeAPIReady = function () {
    var pl = new YT.Player("m", {
      width: "100%", height: "100%", videoId: q.get("v"),
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0, disablekb: 1, iv_load_policy: 3, fs: 0, origin: location.origin, start: Number(q.get("t") || 0), autoplay: q.get("play") === "1" ? 1 : 0 },
      events: {
        onReady: function () { ready.res(pl); },
        onStateChange: function (e) { if (window.lunaraPipState) window.lunaraPipState(e.data); },
        onError: function (e) { if (window.lunaraPipError) window.lunaraPipError(e.data); }
      }
    });
  };
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = function () { ready.rej(new Error("YouTube unreachable")); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
