<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY DEVICE CONTROL — Preview</title>
<style>
:root{--primary:#0F172A;--accent:#0369A1;--bg:#F8FAFC;--line:#E2E8F0;--ok:#047857}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#020617}
header{background:var(--primary);color:#fff;padding:14px 16px;font-weight:800;letter-spacing:.02em}
.tabs{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
.tabs button{flex:none;font:inherit;font-weight:700;min-height:42px;padding:0 18px;border-radius:10px;border:1px solid transparent;background:transparent;color:#334155;cursor:pointer;transition:background .25s,color .25s}
.tabs button:hover{background:#E8ECF1}
.tabs button[aria-selected="true"]{background:var(--primary);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:16px}
.panel{display:none}.panel.on{display:block;animation:in .45s cubic-bezier(.22,1,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar b{font-size:16px}.bar small{color:#475569;display:block;font-size:12px;font-weight:400}
button.cp{font:inherit;font-weight:700;min-height:44px;padding:0 22px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;transition:transform .15s,background .25s}
button.cp:hover{background:#075985}button.cp:active{transform:scale(.96)}button.cp.ok{background:var(--ok)}
pre{margin:0;background:#0F172A;color:#E2E8F0;border-radius:12px;padding:16px;overflow:auto;max-height:calc(100vh - 190px);min-height:300px;font:12px/1.55 ui-monospace,Consolas,monospace;tab-size:2}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.frame{display:grid;place-items:start center;background:#E2E8F0;border-radius:12px;padding:10px}
iframe{border:0;background:#fff;width:100%;height:calc(100vh - 200px);min-height:520px;border-radius:8px;transition:width .35s cubic-bezier(.22,1,.36,1)}
.note{font-size:12px;color:#475569;margin:8px 2px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:99}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>MY DEVICE CONTROL</header>
<div class="tabs" role="tablist" aria-label="Bahagian">
  <button role="tab" data-t="preview" aria-selected="true">Preview</button>
  <button role="tab" data-t="index" aria-selected="false">index.html</button>
  <button role="tab" data-t="admin" aria-selected="false">admin.html</button>
  <button role="tab" data-t="rtdb" aria-selected="false">Rules Database</button>
  <button role="tab" data-t="fs" aria-selected="false">Rules Firestore</button>
</div>
<main>
  <section class="panel on" id="p-preview" role="tabpanel">
    <div class="bar">
      <div class="seg" role="group" aria-label="Halaman"><button data-pv="index" aria-pressed="false">Halaman log masuk</button><button data-pv="admin" aria-pressed="true">Admin panel</button></div>
      <div class="seg" role="group" aria-label="Saiz"><button data-w="100%" aria-pressed="true">Desktop</button><button data-w="390px" aria-pressed="false">Telefon</button></div>
    </div>
    <div class="frame"><iframe id="fr" title="Preview"></iframe></div>
    <p class="note">Paparan sebenar fail di tab sebelah. Firebase tidak disambung di sini, jadi admin dipaparkan kosong. Klik menu kiri untuk lihat animasi.</p>
  </section>
  <section class="panel" id="p-index" role="tabpanel"></section>
  <section class="panel" id="p-admin" role="tabpanel"></section>
  <section class="panel" id="p-rtdb" role="tabpanel"></section>
  <section class="panel" id="p-fs" role="tabpanel"></section>
</main>
<script>
const F = /*__DATA__*/{};
const toast = (t) => { const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); };
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { const t = document.createElement("textarea"); t.value = text; t.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (x) {} t.remove(); return ok; }
}
for (const k of ["index", "admin", "rtdb", "fs"]) {
  const f = F[k], p = document.getElementById("p-" + k), lines = f.code.split("\n").length;
  p.innerHTML = `<div class="bar"><div><b>${f.label}</b><small>${f.file} · ${lines} baris · satu fail lengkap</small></div><button class="cp">Salin semua</button></div><pre><code></code></pre>`;
  p.querySelector("code").textContent = f.code;
  const b = p.querySelector(".cp");
  b.onclick = async () => { const ok = await copy(f.code); toast(ok ? `${f.file} disalin` : "Gagal salin. Pilih kod dan salin manual."); if (ok) { b.classList.add("ok"); b.textContent = "Disalin ✓"; setTimeout(() => { b.classList.remove("ok"); b.textContent = "Salin semua"; }, 1600); } };
}
const tabs = [...document.querySelectorAll(".tabs button")];
tabs.forEach((t) => t.onclick = () => {
  tabs.forEach((x) => x.setAttribute("aria-selected", x === t));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", p.id === "p-" + t.dataset.t));
});
const fr = document.getElementById("fr"); let which = "admin";
const load = () => { fr.srcdoc = F[which].code.replace("<head>", "<head><script>window.__MDC_PREVIEW__=true<\/script>"); };
document.querySelectorAll("[data-pv]").forEach((b) => b.onclick = () => { which = b.dataset.pv; document.querySelectorAll("[data-pv]").forEach((x) => x.setAttribute("aria-pressed", x === b)); load(); });
document.querySelectorAll("[data-w]").forEach((b) => b.onclick = () => { fr.style.width = b.dataset.w; document.querySelectorAll("[data-w]").forEach((x) => x.setAttribute("aria-pressed", x === b)); });
load();
</script>
</body>
</html>
