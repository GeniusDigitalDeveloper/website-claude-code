[k] = true));\n}\n\n/* ---------- Firebase ---------- */\nconst getCfg = () => CONFIG;\nlet call = previewBlock, fsdb = null, auth = null;\nasync function boot() {\n  if (PREVIEW) { loadPreview(); render(); return; }\n  const cfg = getCfg();\n  const [{ initializeApp }, A, F, FN] = await Promise.all([\"app\", \"auth\", \"firestore\", \"functions\"].map((m) => import(`${SDK}firebase-${m}.js`)));\n  fb = { A, F };\n  const app = initializeApp(cfg);\n  auth = A.getAuth(app); fsdb = F.getFirestore(app);\n  const fns = FN.getFunctions(app, REGION);\n  call = (name, data) => FN.httpsCallable(fns, name)(data).then((r) => r.data);\n  A.onAuthStateChanged(auth, async (u) => {\n    if (!u) { S.user = null; S.claims = {}; subscribedOrg = null; unsubs.forEach((f) => f()); unsubs = []; S.screen = \"login\"; render(); return; }\n    S.screen = null; S.user = u; await readClaims(false); subscribeAll(); render();\n  });\n  A.onIdTokenChanged(auth, async (u) => { if (u) { await readClaims(false); render(); } });\n}\nasync function readClaims(force) {\n  const u = auth.currentUser, r = await u.getIdTokenResult(force);\n  if (r.claims.orgId && r.claims.role) { S.claims = { orgId: r.claims.orgId, role: r.claims.role }; return; }\n  const F = fb.F;\n  S.claims = { orgId: null, role: null };\n  try {\n    const m = await F.getDoc(F.doc(fsdb, \"members\", u.uid));\n    if (m.exists()) { S.claims = { orgId: m.data().orgId, role: m.data().role }; return; }\n    const em = (u.email || \"\").toLowerCase();\n    if (em && u.emailVerified) {   // dijemput oleh admin? sambung secara automatik\n      const inv = await F.getDoc(F.doc(fsdb, \"invites\", em)).catch(() => null);\n      if (inv && inv.exists()) {\n        const d = inv.data(), bt = F.writeBatch(fsdb);\n        bt.set(F.doc(fsdb, \"members\", u.uid), { orgId: d.orgId, role: d.role, email: em, displayName: u.displayName || null, createdAt: F.serverTimestamp() });\n        bt.delete(inv.ref); await bt.commit();\n        S.claims = { orgId: d.orgId, role: d.role };\n      }\n    }\n  } catch (e) { S.claimErr = e.message; }\n}\n\nlet unsubs = [], subscribedOrg = null;\nfunction subscribeAll() {\n  if (!S.claims.orgId || subscribedOrg === S.claims.orgId) return;\n  unsubs.forEach((u) => u()); unsubs = []; subscribedOrg = S.claims.orgId;\n  const { collection, onSnapshot, query, orderBy, limit } = fb.F;\n  const sub = (key, name, order, max) => {\n    const q = query(collection(fsdb, \"organizations\", S.claims.orgId, name), ...(order ? [orderBy(order, \"desc\")] : []), limit(max));\n    unsubs.push(onSnapshot(q, (s) => { S[key] = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded[key] = true; delete S.errors[key]; render(); },\n      (e) => { S.errors[key] = e.message; S.loaded[key] = true; render(); }));\n  };\n  sub(\"devices\", \"devices\", \"createdAt\", 500); sub(\"groups\", \"deviceGroups\", null, 200);\n  sub(\"commands\", \"commands\", \"createdAt\", 300); sub(\"logs\", \"activityLogs\", \"createdAt\", 300);\n  const { where } = fb.F;\n  const top = (key, name, map) => unsubs.push(onSnapshot(query(collection(fsdb, name), where(\"orgId\", \"==\", S.claims.orgId)),\n    (s) => { S[key] = s.docs.map((d) => ({ id: d.id, uid: d.id, ...d.data() })); S.loaded[key] = true; delete S.errors[key]; render(); },\n    (e) => { S.errors[key] = e.message; S.loaded[key] = true; render(); }));\n  if (can(\"DEVICE_MANAGER\")) top(\"users\", \"members\"); else S.loaded.users = true;\n  if (can(\"ORG_ADMIN\")) top(\"invites\", \"invites\"); else S.loaded.invites = true;\n}\nasync function fsWrite(fn) { if (PREVIEW) return previewBlock(); return fn(fb.F); }\nconst ref = (...p) => fb.F.doc(fsdb, \"organizations\", S.claims.orgId, ...p);\n\n/* ---------- Navigasi ---------- */\nconst NAV = [[\"dashboard\", \"Dashboard\", \"dash\"], [\"devices\", \"All Devices\", \"dev\"], [\"groups\", \"Device Groups\", \"grp\"], [\"apps\", \"App Management\", \"app\"],\n  [\"filtering\", \"Web Filtering\", \"web\"], [\"monitoring\", \"Live Monitoring\", \"eye\"], [\"commands\", \"Device Commands\", \"cmd\"], [\"logs\", \"Activity Logs\", \"log\"], [\"users\", \"Users & Roles\", \"usr\"], [\"settings\", \"Settings\", \"set\"]];\nconst setPage = () => { const h = location.hash.slice(1); S.page = NAV.some((n) => n[0] === h) ? h : \"dashboard\"; S.nav = false; S.pg = 0; S.sel = new Set(); S.animPending = true; S.leaving = false; render(); };\nwindow.addEventListener(\"hashchange\", setPage);\n\n/* ---------- Komponen ---------- */\nconst badge = (s) => `<span class=\"badge b-${esc(s)}\">${esc(String(s).replace(\"_\", \" \"))}<\/span>`;\nconst head = (t, sub, actions = \"\") => `<div class=\"head\"><div><h1>${esc(t)}<\/h1>${sub ? `<p>${esc(sub)}<\/p>` : \"\"}<\/div><div class=\"row\">${actions}<\/div><\/div>`;\nconst empty = (t, h) => `<div class=\"empty\"><b>${esc(t)}<\/b>${esc(h || \"\")}<\/div>`;\nconst state = (key, ok) => !S.loaded[key] ? `<div class=\"loading\">Memuatkan…<\/div>` : S.errors[key] ? `<div class=\"card\" role=\"alert\"><b>Ralat memuatkan data<\/b><p class=\"sm\">${esc(S.errors[key])}<\/p><\/div>` : ok();\nconst gname = (id) => (S.groups.find((g) => g.id === id) || {}).name || \"—\";\nconst dname = (id) => (S.devices.find((d) => d.id === id) || {}).deviceName || id;\n\nfunction openModal(html, onMount) {\n  const m = $(\"#modal\");\n  m.innerHTML = `<div class=\"modal\" data-close-bg><div class=\"card\" role=\"dialog\" aria-modal=\"true\">${html}<\/div><\/div>`;\n  const first = m.querySelector(\"input,select,button.p,button.d\"); if (first) first.focus();\n  if (onMount) onMount(m);\n}\nconst closeModal = () => { const m = $(\"#modal .modal\"); if (!m || REDUCE) { $(\"#modal\").innerHTML = \"\"; return; } m.classList.add(\"out\"); setTimeout(() => { $(\"#modal\").innerHTML = \"\"; }, 180); };\ndocument.addEventListener(\"keydown\", (e) => { if (e.key === \"Escape\") closeModal(); });\nfunction confirmBox({ title, body, label, danger, requireText, run }) {\n  openModal(`<h2>${esc(title)}<\/h2><div class=\"sm\" style=\"font-size:14px;color:#334155\">${body}<\/div>\n    ${requireText ? `<label class=\"f\">Taip <b>${esc(requireText)}<\/b> untuk sahkan<input id=\"ct\" autocomplete=\"off\"><\/label>` : \"\"}\n    <div class=\"row\" style=\"justify-content:flex-end;margin-top:16px\"><button class=\"btn\" data-close>Batal<\/button><button class=\"btn ${danger ? \"d\" : \"p\"}\" id=\"cok\" ${requireText ? \"disabled\" : \"\"}>${esc(label)}<\/button><\/div>`,\n  (m) => {\n    const ok = m.querySelector(\"#cok\"), ct = m.querySelector(\"#ct\");\n    if (ct) ct.oninput = () => (ok.disabled = ct.value !== requireText);\n    ok.onclick = async () => { ok.disabled = true; try { await run(); closeModal(); } catch (e) { if (e.message !== \"preview\") toast(errMsg(e), true); ok.disabled = false; } };\n  });\n}\n\n/* ---------- Halaman ---------- */\nfunction pageDashboard() {\n  const D = S.devices, by = (s) => D.filter((d) => d.status === s).length;\n  const stat = (l, v, i, c = \"#0F172A\") => `<div class=\"card stat lift\"><div class=\"ic\">${ic(i, 20, c)}<\/div><div><b data-n=\"${v}\">${v}<\/b><span>${l}<\/span><\/div><\/div>`;\n  const attention = D.filter((d) => d.status === \"ERROR\" || (typeof d.batteryLevel === \"number\" && d.batteryLevel < 15)).length;\n  const pending = D.filter((d) => d.status === \"ENROLLMENT_PENDING\" || d.enrollmentStatus === \"PENDING\").length;\n  const COL = { ONLINE: \"#047857\", OFFLINE: \"#64748B\", LOCKED: \"#B45309\", ENROLLMENT_PENDING: \"#0369A1\", ERROR: \"#DC2626\" };\n  // donut\n  const cnt = {}; D.forEach((d) => (cnt[d.status] = (cnt[d.status] || 0) + 1));\n  let acc = 0, ci = 0; const R = 40, C = 2 * Math.PI * R;\n  const donut = Object.entries(cnt).map(([k, v]) => { const len = (v / D.length) * C; const s = `<circle class=\"dn\" r=\"${R}\" cx=\"60\" cy=\"60\" fill=\"none\" stroke=\"${COL[k] || \"#94a3b8\"}\" stroke-width=\"18\" stroke-dasharray=\"${len} ${C - len}\" stroke-dashoffset=\"${-acc}\" transform=\"rotate(-90 60 60)\"/>`; acc += len; return s; }).join(\"\");\n  // 7 hari\n  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d.toLocaleDateString(\"en-CA\"); });\n  const dk = (t) => (ms(t) ? new Date(ms(t)).toLocaleDateString(\"en-CA\") : \"\");\n  const series = [[\"Peranti\", D, \"#0369A1\"], [\"Arahan\", S.commands, \"#0F172A\"], [\"Aktiviti\", S.logs, \"#64748B\"]];\n  const vals = series.map(([n, arr]) => days.map((k) => arr.filter((x) => dk(x.createdAt) === k).length));\n  const mx = Math.max(1, ...vals.flat()), bw = 12, gw = 3 * bw + 12;\n  const bars = days.map((k, i) => series.map((s, j) => { const h = (vals[j][i] / mx) * 120; return `<rect class=\"cb\" style=\"--d:${i * 70 + j * 25}ms\" x=\"${i * gw + j * bw + 6}\" y=\"${130 - h}\" width=\"${bw - 2}\" height=\"${h}\" fill=\"${s[2]}\" rx=\"2\"><title>${s[0]} ${k}: ${vals[j][i]}<\/title><\/rect>`; }).join(\"\") + `<text x=\"${i * gw + gw / 2}\" y=\"146\" font-size=\"10\" text-anchor=\"middle\" fill=\"#475569\">${k.slice(5)}<\/text>`).join(\"\");\n  const cs = {}; S.commands.forEach((c) => (cs[c.status] = (cs[c.status] || 0) + 1));\n  const cmx = Math.max(1, ...Object.values(cs));\n  return head(\"Dashboard\", \"Data masa nyata dari Cloud Firestore\") + state(\"devices\", () => `\n    <div class=\"grid g4\">${stat(\"Total Devices\", D.length, \"dev\")}${stat(\"Online\", by(\"ONLINE\"), \"wifi\", \"#047857\")}${stat(\"Offline\", by(\"OFFLINE\"), \"wifioff\", \"#64748B\")}${stat(\"Locked\", by(\"LOCKED\"), \"lock\", \"#B45309\")}\n    ${stat(\"Android\", D.filter((d) => d.deviceType === \"ANDROID\").length, \"dev\")}${stat(\"Windows\", D.filter((d) => d.deviceType === \"WINDOWS\").length, \"laptop\")}${stat(\"Pending Enrollment\", pending, \"clock\", \"#0369A1\")}${stat(\"Perlu Perhatian\", attention, \"warn\", \"#DC2626\")}<\/div>\n    ${!D.length ? `<div class=\"card\" style=\"margin-top:16px\">${empty(\"Belum ada peranti didaftarkan\", \"Pergi ke All Devices → Daftar peranti untuk menjana token enrollment.\")}<\/div>` : `\n    <div class=\"grid g2\" style=\"margin-top:16px\">\n      <div class=\"card\"><b>Taburan status peranti<\/b><div class=\"row\" style=\"margin-top:8px\"><svg width=\"150\" height=\"150\" viewBox=\"0 0 120 120\" role=\"img\" aria-label=\"Carta donat status peranti\">${donut}<text x=\"60\" y=\"65\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"800\">${D.length}<\/text><\/svg>\n        <div class=\"legend\" style=\"flex-direction:column\">${Object.entries(cnt).map(([k, v]) => `<span><i style=\"background:${COL[k] || \"#94a3b8\"}\"><\/i>${k.replace(\"_\", \" \")}: ${v}<\/span>`).join(\"\")}<\/div><\/div>\n        <p class=\"sm\">Sejarah trend online/offline memerlukan snapshot berkala (fasa seterusnya); carta ini ialah keadaan semasa.<\/p><\/div>\n      <div class=\"card\"><b>Enrollment, arahan &amp; aktiviti (7 hari)<\/b><svg viewBox=\"0 0 ${7 * gw + 12} 152\" width=\"100%\" role=\"img\" aria-label=\"Carta bar 7 hari\">${bars}<\/svg>\n        <div class=\"legend\">${series.map((s) => `<span><i style=\"background:${s[2]}\"><\/i>${s[0]}<\/span>`).join(\"\")}<\/div><\/div>\n      <div class=\"card\"><b>Sejarah pelaksanaan arahan<\/b>${!S.commands.length ? empty(\"Belum ada arahan\") : `<div class=\"bars\" style=\"margin-top:10px\">${Object.entries(cs).map(([k, v]) => `<div class=\"bar\"><span>${k}<\/span><i style=\"width:${(v / cmx) * 100}%;--d:${Object.keys(cs).indexOf(k) * 80}ms\"><\/i><b>${v}<\/b><\/div>`).join(\"\")}<\/div>`}<\/div>\n      <div class=\"card tw\"><div style=\"padding:16px 16px 0\"><b>Peranti terkini<\/b><\/div><table style=\"min-width:420px\"><thead><tr><th>Nama<\/th><th>Jenis<\/th><th>Status<\/th><th>Last seen<\/th><\/tr><\/thead><tbody>\n        ${D.slice(0, 6).map((d) => `<tr><td><b>${esc(d.deviceName)}<\/b><\/td><td>${esc(d.deviceType)}<\/td><td>${badge(d.status)}<\/td><td>${ago(d.lastSeen)}<\/td><\/tr>`).join(\"\")}<\/tbody><\/table><\/div>\n    <\/div>`}`);\n}\n\nfunction pageDevices() {\n  const q = S.q.toLowerCase();\n  const rows = S.devices.filter((d) => (!S.fs || d.status === S.fs) && (!S.ft || d.deviceType === S.ft) && (!q || `${d.deviceName} ${d.deviceId} ${d.deviceModel} ${d.assignedUserId || \"\"}`.toLowerCase().includes(q)));\n  const PER = 10, pages = Math.max(1, Math.ceil(rows.length / PER)); if (S.pg >= pages) S.pg = pages - 1;\n  const view = rows.slice(S.pg * PER, S.pg * PER + PER), mg = can(\"DEVICE_MANAGER\"), ad = can(\"ORG_ADMIN\");\n  const opts = (arr, cur, all) => `<option value=\"\">${all}<\/option>` + arr.map((a) => `<option ${a === cur ? \"selected\" : \"\"}>${a}<\/option>`).join(\"\");\n  return head(\"All Devices\", S.devices.length + \" peranti\", (mg ? `<button class=\"btn p\" data-act=\"enroll\">${ic(\"plus\", 16)}Daftar peranti<\/button>` : \"\") + (ad ? `<button class=\"btn d\" data-act=\"lockall\" ${S.devices.length ? \"\" : \"disabled\"}>${ic(\"lock\", 16)}Lock All Devices<\/button>` : \"\")) + `\n  <div class=\"card row\" style=\"margin-bottom:12px\"><div class=\"search\">${ic(\"search\", 16, \"#94a3b8\")}<input id=\"q\" aria-label=\"Cari peranti\" placeholder=\"Cari nama / ID / model\" value=\"${esc(S.q)}\"><\/div>\n    <select id=\"fs\" aria-label=\"Tapis status\" style=\"width:auto\">${opts([\"ONLINE\", \"OFFLINE\", \"LOCKED\", \"ENROLLMENT_PENDING\", \"ERROR\"], S.fs, \"Semua status\")}<\/select>\n    <select id=\"ft\" aria-label=\"Tapis jenis\" style=\"width:auto\">${opts([\"ANDROID\", \"WINDOWS\"], S.ft, \"Semua jenis\")}<\/select>\n    ${mg && S.sel.size ? `<button class=\"btn\" data-act=\"lock-sel\">${ic(\"lock\", 16)}Lock (${S.sel.size})<\/button><button class=\"btn\" data-act=\"unlock-sel\">${ic(\"unlock\", 16)}Unlock (${S.sel.size})<\/button>` : \"\"}<\/div>\n  <div class=\"card tw\">${state(\"devices\", () => !rows.length ? empty(S.devices.length ? \"Tiada padanan\" : \"Belum ada peranti\", S.devices.length ? \"Ubah carian atau penapis.\" : 'Klik \"Daftar peranti\ alue=\"${esc(d.assignedUserId || \"\")}\"><\/label>\n      <label class=\"f\">Kumpulan<select id=\"eg\"><option value=\"\">— tiada —<\/option>${S.groups.map((g) => `<option value=\"${esc(g.id)}\" ${g.id === d.groupId ? \"selected\" : \"\"}>${esc(g.name)}<\/option>`).join(\"\")}<\/select><\/label>\n      <div class=\"row\" style=\"justify-content:flex-end;margin-top:16px\"><button class=\"btn\" data-close>Batal<\/button><button class=\"btn p\" id=\"ok\">Simpan<\/button><\/div>`, (m) => {\n      m.querySelector(\"#ok\").onclick = async () => { try { await fsWrite((F) => F.updateDoc(ref(\"devices\", d.id), { deviceName: m.querySelector(\"#en\").value.trim(), assignedUserId: m.querySelector(\"#eu\").value.trim() || null, groupId: m.querySelector(\"#eg\").value || null, updatedAt: F.serverTimestamp() })); toast(\"Peranti dikemas kini.\"); closeModal(); } catch (e) { if (e.message !== \"preview\") toast(errMsg(e), true); } };\n    });\n  },\n  enroll() {\n    openModal(`<h2>Daftar peranti baharu<\/h2><div id=\"ebody\"><label class=\"f\">Jenis<select id=\"et\"><option>ANDROID<\/option><option>WINDOWS<\/option><\/select><\/label>\n      <label class=\"f\">Nama peranti<input id=\"en\" maxlength=\"80\" placeholder=\"HONOR TABLET 01\"><\/label>\n      <label class=\"f\">Kumpulan (pilihan)<select id=\"eg\"><option value=\"\">— tiada —<\/option>${S.groups.map((g) => `<option value=\"${esc(g.id)}\">${esc(g.name)}<\/option>`).join(\"\")}<\/select><\/label>\n      <div class=\"row\" style=\"justify-content:flex-end;margin-top:16px\"><button class=\"btn\" data-close>Batal<\/button><button class=\"btn p\" id=\"ok\">Jana token<\/button><\/div><\/div>`, (m) => {\n      m.querySelector(\"#ok\").onclick = async () => {\n        const name = m.querySelector(\"#en\").value.trim(); if (!name) return toast(\"Masukkan nama peranti.\", true);\n        try {\n          const r = await call(\"createEnrollment\", { deviceType: m.querySelector(\"#et\").value, deviceName: name, groupId: m.querySelector(\"#eg\").value || undefined });\n          let qr = \"\"; try { await loadQR(); const q = window.qrcode(0, \"M\"); q.addData(r.qrPayload); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { qr = '<p class=\"sm\">Kod QR tidak dapat dijana (pustaka tidak dimuat). Gunakan token di bawah.<\/p>'; }\n          m.querySelector(\"#ebody\").innerHTML = `<div style=\"width:230px;margin:0 auto\" role=\"img\" aria-label=\"Kod QR enrollment\">${qr}<\/div><p class=\"sm\" style=\"font-size:14px\">Imbas kod QR dari agent peranti, atau salin token. <b>Token dipaparkan sekali sahaja<\/b>, sah 24 jam, sekali guna.<\/p>\n            <div class=\"row\" style=\"flex-wrap:nowrap\"><input readonly id=\"tk\" aria-label=\"Token enrollment\" class=\"mono\" value=\"${esc(r.token)}\"><button class=\"btn i\" id=\"cp\" aria-label=\"Salin token\">${ic(\"copy\", 16)}<\/button><\/div>\n            <div class=\"row\" style=\"justify-content:flex-end;margin-top:16px\"><button class=\"btn p\" data-close>Selesai<\/button><\/div>`;\n          m.querySelector(\"#cp\").onclick = () => { navigator.clipboard.writeText(r.token); toast(\"Token disalin.\"); };\n        } catch (e) { if (e.message !== \"preview\") toast(errMsg(e), true); }\n      };\n    });\n  },\n  gnew() { groupForm(); }, gedit(el) { groupForm(S.groups.find((g) => g.id === el.dataset.id)); },\n  gdel(el) {\n    const g = S.groups.find((x) => x.id === el.dataset.id), n = S.devices.filter((d) => d.groupId === g.id);\n    confirmBox({ title: \"Padam kumpulan\", body: `Kumpulan <b>${esc(g.name)}<\/b> dipadam. ${n.length} peranti dilepaskan daripada kumpulan (peranti tidak dipadam).`, label: \"Padam\", danger: true, requireText: g.name,\n      run: () => fsWrite(async (F) => { await Promise.all(n.map((d) => F.updateDoc(ref(\"devices\", d.id), { groupId: null, updatedAt: F.serverTimestamp() }))); await F.deleteDoc(ref(\"deviceGroups\", g.id)); toast(\"Kumpulan dipadam.\"); }) });\n  },\n  glock(el) { groupCmd(el.dataset.id, \"LOCK\"); }, gunlock(el) { groupCmd(el.dataset.id, \"UNLOCK\"); },\n  uadd() {\n    openModal(`<h2>Tambah pengguna<\/h2><p class=\"sm\" style=\"font-size:14px\">Masukkan e-mel akaun (apa-apa penyedia log masuk). Mereka akan disambungkan automatik bila log masuk dengan e-mel itu.<\/p>\n      <label class=\"f\">E-mel<input id=\"ue\" type=\"email\"><\/label><label class=\"f\">Peranan<select id=\"ur\">${grantRoles().map((r) => `<option value=\"${r}\">${ROLE[r]}<\/option>`).join(\"\")}<\/select><\/label>\n      <div class=\"row\" style=\"justify-content:flex-end;margin-top:16px\"><button class=\"btn\" data-close>Batal<\/button><button class=\"btn p\" id=\"ok\">Hantar jemputan<\/button><\/div>`, (m) => {\n      m.querySelector(\"#ok\").onclick = async () => {\n        const em = m.querySelector(\"#ue\").value.trim().toLowerCase(); if (!/^\\S+@\\S+\\.\\S+$/.test(em)) return toast(\"E-mel tidak sah.\", true);\n        try { await fsWrite((F) => F.setDoc(F.doc(fsdb, \"invites\", em), { orgId: S.claims.orgId, role: m.querySelector(\"#ur\").value, createdBy: S.user.uid, createdAt: F.serverTimestamp() })); toast(\"Jemputan dicipta untuk \" + em + \".\"); closeModal(); }\n        catch (e) { if (e.message !== \"preview\") toast(errMsg(e), true); }\n      };\n    });\n  },\n  invdel(el) { fsWrite((F) => F.deleteDoc(F.doc(fsdb, \"invites\", el.dataset.id))).then(() => toast(\"Jemputan dibatalkan.\")).catch((e) => { if (e.message !== \"preview\") toast(errMsg(e), true); }); },\n  urm(el) { const u = S.users.find((x) => x.uid === el.dataset.id); confirmBox({ title: \"Buang pengguna\", body: `${esc(u.email)} akan hilang akses ke organisasi ini.`, label: \"Buang\", danger: true, run: async () => { await fsWrite((F) => F.deleteDoc(F.doc(fsdb, \"members\", u.uid))); toast(\"Pengguna dibuang.\"); } }); }\n};\nfunction groupForm(g) {\n  openModal(`<h2>${g ? \"Sunting\" : \"Baharu\"} kumpulan<\/h2><label class=\"f\">Nama<input id=\"gn\" maxlength=\"80\" value=\"${esc(g ;\n    S.nav = false; const c = $(\"#content\");\n    // tanda halaman aktif serta-merta supaya indicator mula meluncur sambil kandungan lama pudar\n    S.page = id; updateNav();\n    if (c && !REDUCE) { S.leaving = true; c.classList.add(\"leave\"); setTimeout(() => { location.hash = id; }, 200); } else location.hash = id;\n    return;\n  }\n  if (e.target.closest(\"[data-close]\") || (e.target.matches(\"[data-close-bg]\"))) return closeModal();\n  const a = e.target.closest(\"[data-act]\"); if (a && ACTIONS[a.dataset.act]) ACTIONS[a.dataset.act](a);\n});\ndocument.addEventListener(\"change\", (e) => {\n  const t = e.target;\n  if (t.dataset && t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); render(); }\n  else if (t.id === \"selall\") { const q = S.q.toLowerCase(); S.devices.filter((d) => (!S.fs || d.status === S.fs) && (!S.ft || d.deviceType === S.ft) && (!q || `${d.deviceName} ${d.deviceId} ${d.deviceModel} ${d.assignedUserId || \"\"}`.toLowerCase().includes(q))).slice(S.pg * 10, S.pg * 10 + 10).forEach((d) => (t.checked ? S.sel.add(d.id) : S.sel.delete(d.id))); render(); }\n  else if (t.dataset && t.dataset.role) { fsWrite((F) => F.updateDoc(F.doc(fsdb, \"members\", t.dataset.role), { role: t.value })).then(() => toast(\"Peranan dikemas kini.\")).catch((e) => { if (e.message !== \"preview\") toast(errMsg(e), true); render(); }); }\n  else if (t.id === \"fs\") { S.fs = t.value; S.pg = 0; render(); } else if (t.id === \"ft\") { S.ft = t.value; S.pg = 0; render(); }\n});\ndocument.addEventListener(\"input\", (e) => { if (e.target.id === \"q\") { S.q = e.target.value; S.pg = 0; render(); } });\n\nsetPage();\nboot().catch((e) => { $(\"#root\").innerHTML = `<div class=\"loading\" role=\"alert\">Gagal memulakan: ${esc(errMsg(e))}<br><br><button class=\"btn\" onclick=\"location.reload()\">Cuba semula<\/button><\/div>`; });\n<\/script>\n<\/body>\n<\/html>\n"}, "rtdb": {"file": "database.rules.json", "label": "Rules Database", "code": "{\n  \"rules\": {\n    \".read\": false,\n    \".write\": false,\n    \"presence\": {\n      \"$orgId\": {\n        \".read\": \"auth != null && (auth.token.orgId === $orgId || auth.token.role === 'SUPER_ADMIN')\",\n        \"$deviceId\": {\n          \".write\": \"auth != null && auth.token.role === 'DEVICE' && auth.token.orgId === $orgId && auth.token.deviceId === $deviceId\",\n          \".validate\": \"newData.hasChildren(['status', 'lastSeen'])\",\n          \"status\": { \".validate\": \"newData.isString() && (newData.val() === 'ONLINE' || newData.val() === 'LOCKED' || newData.val() === 'ERROR')\" },\n          \"batteryLevel\": { \".validate\": \"newData.isNumber() && newData.val() >= 0 && newData.val() <= 100\" },\n          \"lastSeen\": { \".validate\": \"newData.val() === now\" },\n          \"appVersion\": { \".validate\": \"newData.isString() && newData.val().length <= 32\" },\n          \"$other\": { \".validate\": false }\n        }\n      }\n    }\n  }\n}\n"}, "fs": {"file": "firestore.rules", "label": "Rules Firestore", "code": "rules_version = '2';\n\n// MY DEVICE CONTROL — Firestore Security Rules\n// Peranan admin disimpan dalam dokumen members/{uid} (BUKAN bergantung pada Cloud Functions).\n// Berfungsi dengan SEMUA penyedia log masuk (E-mel, Google, Microsoft...). Custom Claims\n// (jika ada) juga diterima. Peranti menggunakan token khas { role:'DEVICE', orgId, deviceId }.\n// Peranan: SUPER_ADMIN > ORG_ADMIN > DEVICE_MANAGER > VIEWER\n\nservice cloud.firestore {\n  match /databases/{database}/documents {\n\n    // >>> EDIT: e-mel yang dibenarkan mencipta organisasi pertama (dan menjadi SUPER_ADMIN) <<<\n    function bootstrapEmails() { return ['izzulmedia01@gmail.com']; }\n\n    // ---------- Identiti & peranan ----------\n    function signedIn() { return request.auth != null; }\n    function memberPath() { return /databases/$(database)/documents/members/$(request.auth.uid); }\n    function hasMember() { return exists(memberPath()); }\n    function claimRole() { return 'role' in request.auth.token ? request.auth.token.role : null; }\n    function myRole() { return claimRole() != null ? claimRole() : (hasMember() ? get(memberPath()).data.role : null); }\n    function myOrg() { return 'orgId' in request.auth.token ? request.auth.token.orgId : (hasMember() ? get(memberPath()).data.orgId : null); }\n    function myEmail() { return request.auth.token.email.lower(); }\n    function verified() { return request.auth.token.email_verified == true; }\n\n    function isHuman() { return signedIn() && myRole() in ['SUPER_ADMIN', 'ORG_ADMIN', 'DEVICE_MANAGER', 'VIEWER']; }\n    function isSuper() { return isHuman() && myRole() == 'SUPER_ADMIN'; }\n    function inOrg(orgId) { return isHuman() && (isSuper() || myOrg() == orgId); }\n    function canRead(orgId)   { return inOrg(orgId); }\n    function canManage(orgId) { return inOrg(orgId) && myRole() in ['SUPER_ADMIN', 'ORG_ADMIN', 'DEVICE_MANAGER']; }\n    function canAdmin(orgId)  { return inOrg(orgId) && myRole() in ['SUPER_ADMIN', 'ORG_ADMIN']; }\n    // Peranan yang boleh diberikan oleh pemanggil (Org Admin tidak boleh melantik Super Admin)\n    function grantable(role) { return role in ['VIEWER', 'DEVICE_MANAGER', 'ORG_ADMIN'] || (role == 'SUPER_ADMIN' && isSuper()); }\n\n    function isDevice(orgId) { return signedIn() && claimRole() == 'DEVICE' && request.auth.token.orgId == orgId; }\n    function isThisDevice(orgId, deviceId) { return isDevice(orgId) && request.auth.token.deviceId == deviceId; }\n    function onlyChanges(keys) { return request.resource.data.diff(resource.data).affectedKeys().hasOnly(keys); }\n\n    // ---------- members/{uid}: siapa pengguna ini & peranannya ----------\n    match /members/{uid} {\n      allow get: if signedIn() && (request.auth.uid == uid || canAdmin(resource.data.orgId));\n      allow list: if isHuman() && canManage(resource.data.orgId);\n\n      // (a) Admin pertama: cipta organisasi + dirinya sebagai SUPER_ADMIN dalam satu batch\n      allow create: if signedIn() && request.auth.uid == uid && verified()\n          && myEmail() in bootstrapEmails()\n          && request.resource.data.role == 'SUPER_ADMIN'\n          && request.resource.data.keys().hasOnly(['orgId', 'role', 'email', 'displayName', 'createdAt'])\n          && getAfter(/databases/$(database)/documents/organizations/$(request.resource.data.orgId)).data.ownerUid == uid\n          && !exists(/databases/$(database)/documents/organizations/$(request.resource.data.orgId))\n        // (b) Pengguna dijemput oleh admin (jemputan mengikut e-mel yang disahkan)\n        || signedIn() && request.auth.uid == uid && verified()\n          && exists(/databases/$(database)/documents/invites/$(myEmail()))\n          && get(/databases/$(database)/documents/invites/$(myEmail())).data.orgId == request.resource.data.orgId\n          && get(/databases/$(database)/documents/invites/$(myEmail())).data.role == request.resource.data.role\n          && request.resource.data.keys().hasOnly(['orgId', 'role', 'email', 'displayName', 'createdAt'])\n        // (c) Admin menambah/ubah ahli organisasinya\n        || canAdmin(request.resource.data.orgId) && grantable(request.resource.data.role);\n      allow update: if canAdmin(resource.data.orgId) && grantable(request.resource.data.role)\n          && request.resource.data.orgId == resource.data.orgId && resource.data.role != 'SUPER_ADMIN' || isSuper() && onlyChanges(['role', 'displayName']);\n      allow delete: if canAdmin(resource.data.orgId) && request.auth.uid != uid\n          && (resource.data.role != 'SUPER_ADMIN' || isSuper());\n    }\n\n    // ---------- invites/{email}: jemputan sambung akaun Auth baharu ----------\n    match /invites/{email} {\n      allow get: if signedIn() && ((verified() && myEmail() == email) || canAdmin(resource.data.orgId));\n      allow list: if canAdmin(resource.data.orgId);\n      allow create, update: if canAdmin(request.resource.data.orgId) && grantable(request.resource
