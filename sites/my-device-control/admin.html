<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY DEVICE CONTROL — Admin</title>
<style>
:root{--primary:#0F172A;--accent:#0369A1;--bg:#F8FAFC;--line:#E2E8F0;--muted:#475569;--danger:#DC2626;--ok:#047857;--warn:#B45309;--chip:#E8ECF1}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#020617}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;font-weight:800;font-size:13px;line-height:1.15}
.brand i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
nav a{display:flex;gap:10px;align-items:center;padding:0 12px;min-height:40px;border-radius:10px;color:#334155;text-decoration:none;font-weight:600;font-size:14px}
nav a:hover{background:var(--chip)}nav a.on{background:var(--primary);color:#fff}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;font-size:12px}
.me b{display:block;word-break:break-all}
main{padding:24px 28px;min-width:0;max-width:1300px}
.top{display:none}
h1{margin:0;font-size:24px;letter-spacing:-.01em}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{background:#f0f9ff;border:1px solid #bae6fd;color:#0c4a6e;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stat{display:flex;gap:12px;align-items:center}
.stat .ic{width:40px;height:40px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}
.stat b{font-size:24px;line-height:1;display:block;font-weight:800}.stat span{font-size:12px;color:var(--muted);font-weight:600}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:#0f172a}
.btn:hover{background:var(--chip)}.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.p:hover{background:#075985}
.btn.d{background:var(--danger);border-color:var(--danger);color:#fff}.btn.d:hover{background:#b91c1c}
.btn.i{padding:0 10px}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.f{display:block;font-size:13px;font-weight:700;margin-top:12px}.f input,.f select{margin-top:4px;font-weight:400}
.search{position:relative;flex:1;min-width:200px}.search svg{position:absolute;left:10px;top:11px}.search input{padding-left:34px}
.tw{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px}
td{padding:10px 12px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.sm{font-size:12px;color:var(--muted)}
.badge{display:inline-block;border:1px solid;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
.b-ONLINE,.b-EXECUTED{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}.b-OFFLINE,.b-EXPIRED{background:#f1f5f9;color:#334155;border-color:#cbd5e1}
.b-LOCKED{background:#fffbeb;color:#78350f;border-color:#fde68a}.b-ENROLLMENT_PENDING,.b-PENDING{background:#f0f9ff;color:#0c4a6e;border-color:#bae6fd}
.b-ERROR,.b-FAILED{background:#fef2f2;color:#991b1b;border-color:#fecaca}.b-SENT{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}.b-ACKNOWLEDGED{background:#f5f3ff;color:#5b21b6;border-color:#ddd6fe}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty b{display:block;color:#020617;font-size:16px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{width:100%;max-width:440px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:18px}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100% - 32px);width:360px}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:0 4px 12px rgba(15,23,42,.15)}.toast.err{border-left-color:var(--danger)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:13px}.bar i{display:block;height:12px;border-radius:6px;background:var(--accent)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}.tl li:first-child{border-top:0}
.tl time{width:170px;font-size:12px;font-weight:700;color:var(--muted)}.tl code{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.pw{display:block;position:relative;margin-top:4px}.pw input{padding-right:46px}
.pw .eye{position:absolute;right:3px;top:0;width:40px;height:40px;padding:0;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.pw .eye:hover{background:var(--chip);color:#020617}
.sk{position:absolute;left:-9999px}.sk:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:99}

/* ===== ANIMASI (transform & opacity sahaja; dihormati prefers-reduced-motion) ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
nav{position:relative}
.ind{position:absolute;left:0;right:0;top:0;height:40px;border-radius:10px;background:var(--primary);z-index:0;opacity:0;will-change:transform;box-shadow:0 6px 16px rgba(15,23,42,.25)}
.ind.on{opacity:1}.ind.anim{transition:transform .6s var(--ease),height .6s var(--ease)}
nav a{position:relative;z-index:1;transition:color .35s var(--ease),transform .35s var(--ease)}
nav a.on{background:transparent;color:#fff}
nav a:not(.on):hover{transform:translateX(3px)}
nav a svg{transition:transform .5s var(--spring)}
nav a:hover svg{transform:scale(1.12)}
nav a.pop svg{animation:iconpop .7s var(--spring)}
@keyframes iconpop{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.35) rotate(-12deg)}70%{transform:scale(.95) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
#scrimbox{display:contents}
#content{will-change:transform,opacity}
#content.leave{opacity:0;transform:translateY(-10px) scale(.992);filter:blur(2px);transition:opacity .22s ease,transform .22s ease,filter .22s ease}
.rv{opacity:0;animation:rise .85s var(--ease) var(--d,0ms) forwards}
tr.rv{animation-name:slidein2;animation-duration:.7s}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slidein2{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.go .cb{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1s var(--ease) var(--d,0ms) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.go .bar i{transform-origin:0 50%;animation:growx 1.1s var(--ease) var(--d,0ms) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.go .dn{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.3s var(--ease) both}
@keyframes spin{from{opacity:0;transform:rotate(-140deg) scale(.55)}to{opacity:1;transform:none}}
.lift{transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.lift:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(15,23,42,.12)}
.btn{transition:transform .2s var(--ease),background .25s,box-shadow .25s,opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 14px rgba(15,23,42,.14)}
.btn:active:not(:disabled){transform:scale(.96)}
tbody tr{transition:background .25s}tbody tr:hover{background:#f8fafc}
.modal{animation:fadein .28s ease both}
.modal .card{animation:cardin .55s var(--spring) both}
.modal.out{animation:fadeout .18s ease both}.modal.out .card{animation:cardout .18s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes fadeout{to{opacity:0}}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
@keyframes cardout{to{opacity:0;transform:translateY(10px) scale(.97)}}
.toast{animation:toastin .55s var(--spring) both}
@keyframes toastin{from{opacity:0;transform:translateX(40px) scale(.95)}to{opacity:1;transform:none}}
.shellin{animation:fadein .6s ease both}
.scrim{animation:fadein .25s ease both}
@media(prefers-reduced-motion:reduce){.rv{opacity:1!important;animation:none!important}.ind.anim{transition:none}}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:860px){
 .app{display:block}
 aside{position:fixed;z-index:40;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .2s}
 aside.open{transform:none}
 .top{display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:8px 12px;font-weight:800}
 main{padding:16px}
 .scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:35}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const S = { user: null, claims: {}, devices: [], groups: [], commands: [], logs: [], enrollments: [], selLog: new Set(), selCmd: new Set(), apps: [], webRules: [], devInfo: null, live: null, mon: "", fscope: "", keep: {},

  // Tiga log pada Status, satu kitaran sahaja: Admin lock -> Online (pengguna buka telefon) -> Lock sendiri (kali terakhir telefon dikunci/dipadam).

};
const lastSeenCell = (d) => d.deviceType === "ANDROID" ? clk(d.selfLockAt) : ago(d.lastSeen);

  if (S._waitInit) list.filter((d) => isWaiting(d) && !(S._wait || new Set()).has(d.id)).forEach((d) => { toast(`Peranti baharu "${d.deviceName}" menunggu pengesahan anda. Buka All Devices dan tekan Sahkan.`); playSound(true); });

}
// Status berkesan: tiada heartbeat > 10 minit = OFFLINE (dikira di panel, tiada Cloud Functions)
function effStatus(d) { const raw = d._raw || d.status; return ["ONLINE", "LOCKED", "ERROR"].includes(raw) && ms(d.lastSeen) && Date.now() - ms(d.lastSeen) > OFFLINE_MS ? "OFFLINE" : raw; }
function applyStatus(list) { list.forEach((d) => { if (d._raw === undefined) d._raw = d.status; d.status = effStatus(d); }); }
function applyCmdStatus(list) { list.forEach((c) => { if (c._raw === undefined) c._raw = c.status; c.status = ["PENDING", "SENT"].includes(c._raw) && ms(c.expiresAt) && ms(c.expiresAt) < Date.now() ? "EXPIRED" : c._raw; }); }

async function boot() {
  if (PREVIEW) { loadPreview(); render(); return; }
  const [appMod, A, F] = await Promise.all(["app", "auth", "firestore"].map((m) => import(`${SDK}firebase-${m}.js`)));
  const { initializeApp } = appMod;
  fb = { A, F, appMod };
  const app = initializeApp(CONFIG);
  auth = A.getAuth(app); fsdb = F.getFirestore(app);
  A.onAuthStateChanged(auth, (u) => {
    if (!u || u.isAnonymous) { S.user = null; unsubs.forEach((f) => f()); unsubs = []; subscribed = false; S.screen = "login"; render(); return; }
    S.screen = null; S.user = u; S.claims = { role: "ADMIN" }; subscribeAll(); render();   // terus masuk dashboard
  });
  setInterval(() => { applyStatus(S.devices); applyCmdStatus(S.commands); if (S.mon && !S.monDay && actKey && actKey !== dayKey()) { watchActivity(S.mon); return; } render(); }, 60000);   // lewat tengah malam: mula kiraan hari baharu
}

let unsubs = [], subscribed = false;
function subscribeAll() {
  if (subscribed) return; subscribed = true;
  const { collection, onSnapshot, query, orderBy, limit } = fb.F;
  const sub = (key, name, order, max, post) => {
    const q = query(collection(fsdb, name), ...(order ? [orderBy(order, "desc")] : []), limit(max));
    unsubs.push(onSnapshot(q, (s) => { S[key] = s.docs.map((d) => ({ id: d.id, ...d.data() })); if (post) post(S[key]); S.loaded[key] = true; delete S.errors[key]; render(); },
      (e) => { S.errors[key] = e.message; S.loaded[key] = true; render(); }));
  };
  sub("devices", "devices", "createdAt", 500, onDevices); sub("groups", "deviceGroups", null, 200);
  sub("apps", "applications", null, 300); sub("webRules", "webFilteringRules", null, 500); sub("commands", "commands", "createdAt", 300, applyCmdStatus); sub("logs", "activityLogs", "createdAt", 300); sub("enrollments", "enrollments", "createdAt", 100);
}

// ---------- Live Monitoring = aktiviti aplikasi (tiada kongsi skrin) ----------
// Setiap rekod appEvents ialah "satu aplikasi menjadi di hadapan". Penanda __HOME__ / __SCREEN_OFF__ = ditutup.
// Kiraan mengikut hari kalendar (00:00 hingga 24:00) jadi ia reset sendiri pukul 12 malam.
let actUnsub = null, actKey = "";
const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const hm = (t) => ms(t) ? new Date(ms(t)).toLocaleTimeString("ms-MY", { hour: "numeric", minute: "2-digit" }) : "—";
function buildUsage(events) {
  const sess = []; let cur = null;
  for (const e of events) {
    const t = ms(e.at); if (!t) continue;
    if (cur) { cur.close = t; cur = null; }
    if (String(e.packageName || "").startsWith("__")) continue;
    cur = { pkg: e.packageName, label: e.label || e.packageName, open: t, close: 0 }; sess.push(cur);
  }
  const by = new Map();
  for (const x of sess) {
    let a = by.get(x.pkg); if (!a) by.set(x.pkg, a = { pkg: x.pkg, label: x.label, first: x.open, last: 0, count: 0, active: false, total: 0 });
    a.count++; a.first = Math.min(a.first, x.open);
    if (x.close) { a.last = Math.max(a.last, x.close); a.total += x.close - x.open; } else a.active = true;
  }
  return { sess, apps: [...by.values()].sort((p, q) => q.count - p.count || p.first - q.first) };
}
const dur = (m) => { const mn = Math.round(m / 60000); return mn < 1 ? "< 1 min" : mn < 60 ? mn + " min" : Math.floor(mn / 60) + " j " + (mn % 60) + " min"; };
function watchActivity(id) {
  if (actUnsub) { actUnsub(); actUnsub = null; }
  S.mon = id || ""; S.monEvents = null; actKey = dayKey(); render();
  if (!id) return;
  if (PREVIEW) { S.monEvents = []; render(); return; }
  const [y, m, d] = (S.monDay || dayKey()).split("-").map(Number);
  const { collection, onSnapshot, query, orderBy, where, limit, Timestamp } = fb.F;
  actUnsub = onSnapshot(query(collection(fsdb, "devices", id, "appEvents"), where("at", ">=", Timestamp.fromDate(new Date(y, m - 1, d))), where("at", "<", Timestamp.fromDate(new Date(y, m - 1, d + 1))), orderBy("at", "desc"), limit(3000)),
    (sn) => { S.monEvents = sn.docs.map((x) => x.data()).reverse(); render(); }, () => { S.monEvents = []; render(); });
}
async function saveApp(p) {

  await fsWrite(async (F) => { const bt = F.writeBatch(fsdb);
    if (ex) bt.update(ref("applications", ex.id), { label: p.label, policy: p.policy, updatedAt: F.serverTimestamp() });
    else bt.set(F.doc(F.collection(fsdb, "applications")), { packageName: p.packageName, label: p.label, policy: p.policy, groupId: p.groupId || null, createdAt: F.serverTimestamp(), createdBy: S.user.uid });

}

function countUp(el) {
  const to = +el.dataset.n; if (!to) return; const t0 = performance.now(), D = 1100;
  const tick = (t) => { const p = Math.min(1, (t - t0) / D), e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p); el.textContent = Math.round(to * e); if (p < 1) requestAnimationFrame(tick); };
  el.textContent = "0"; requestAnimationFrame(tick);
}
function playIn(c) {

  });

}

// Hantar arahan: satu dokumen PENDING setiap peranti (rules mengesahkan jenis, tamat dalam 24 jam, peranti wujud)
const send = async (data) => {
  const live = S.devices.filter((d) => !isWaiting(d)), ids = data.all ? live.map((d) => d.id) : data.groupId ? live.filter((d) => d.groupId === data.groupId).map((d) => d.id) : data.deviceIds;
  if (!ids.length) { toast("Tiada peranti sasaran.", true); return; }
  await fsWrite(async (F) => {
    for (let i = 0; i < ids.length; i += 200) {
      const bt = F.writeBatch(fsdb);
      ids.slice(i, i + 200).forEach((id) => { const r = F.doc(F.collection(fsdb, "commands")); bt.set(r, { commandId: r.id, deviceId: id, commandType: data.commandType, status: "PENDING", createdBy: S.user.uid, createdAt: F.serverTimestamp(), expiresAt: F.Timestamp.fromMillis(Date.now() + 23.5 * 3600e3), sentAt: null, executedAt: null, errorMessage: null }); });
      if (i + 200 >= ids.length) logEv(F, bt, "COMMAND_CREATED", `${data.commandType} → ${ids.length} peranti`);
      await bt.commit();
    }
  });
  toast(`${ids.length} arahan ${data.commandType} dimasukkan ke queue (PENDING). Status dikemas kini bila peranti mengesahkan.`); S.sel = new Set(); render();
};
const QUEUE_NOTE = "Arahan dimasukkan ke queue dengan status <b>PENDING</b> dan tamat dalam 24 jam. Peranti offline menerimanya apabila kembali online. <b>EXECUTED</b> hanya dipaparkan selepas peranti mengesahkan.";
async function mkEnroll(d) {

    logEv(F, bt, "ENROLLMENT_CREATED", `Enrollment ${d.deviceType} "${d.deviceName}"`); await bt.commit();
    return { token, qrPayload: token };   // kod biasa (32 aksara): sama untuk QR dan salin
  });
}
/** Sahkan e-mel + kata laluan salah satu akaun Firebase Authentication (sesi kedua, tidak mengganggu sesi semasa). */
async function verifyCreds(email, pass) {
  if (PREVIEW) return previewBlock();
  const { appMod, A } = fb, vapp = appMod.initializeApp(CONFIG, "verify-" + Date.now());
  try {
    const vauth = A.initializeAuth(vapp, { persistence: A.inMemoryPersistence });
    if (window.__MDC_EMULATOR__) A.connectAuthEmulator(vauth, "http://127.0.0.1:9099", { disableWarnings: true });
    const cred = await A.signInWithEmailAndPassword(vauth, email, pass);
    if (cred.user.isAnonymous) throw new Error("Akaun tidak sah.");
    await A.signOut(vauth);
    return cred.user.email;
  } finally { await appMod.deleteApp(vapp).catch(() => {}); }
}

    S.commands.filter((c) => c.deviceId === d.id && ["PENDING", "SENT"].includes(c._raw || c.status)).forEach((c) => bt.update(ref("commands", c.id), { status: "EXPIRED", errorMessage: "Peranti dinyahdaftar" }));
    bt.delete(ref("devices", d.id)); bt.delete(ref("publicStatus", d.id));

  toast("Peranti dinyahdaftar.");
}
/** Padam rekod terpilih (kelompok 400). Satu catatan audit ditinggalkan supaya ada jejak. */
function removeRecords(col, ids, noun, selSet) {

    run: () => fsWrite(async (F) => {
      for (let i = 0; i < ids.length; i += 400) { const bt = F.writeBatch(fsdb); ids.slice(i, i + 400).forEach((id) => bt.delete(ref(col, id)));
        if (i + 400 >= ids.length && col !== "activityLogs") logEv(F, bt, "RECORDS_DELETED", `${ids.length} ${noun} dipadam`); await bt.commit(); }
      if (col === "activityLogs") { const bt = F.writeBatch(fsdb); logEv(F, bt, "RECORDS_DELETED", `${ids.length} ${noun} dipadam`); await bt.commit(); }
      selSet.clear(); toast(`${ids.length} ${noun} dipadam.`); }) });
}
/** Padam SEMUA rekod dalam koleksi (termasuk yang belum dipaparkan), kemudian tinggalkan satu catatan audit. */
function clearAll(col, noun, selSet) {
  confirmBox({ title: `Padam semua ${noun}`, body: `Semua ${noun} akan dipadam, termasuk yang tidak dipaparkan di sini. Tindakan ini tidak boleh dibatalkan.`, label: "Padam semua", danger: true, requireText: "PADAM SEMUA",
    run: () => fsWrite(async (F) => { let total = 0;

      const bt = F.writeBatch(fsdb); logEv(F, bt, "RECORDS_DELETED", `Semua ${noun} dipadam (${total} rekod)`); await bt.commit();
      selSet.clear(); toast(`Semua ${noun} dipadam (${total}).`); }) });
}

        if (g) { await F.updateDoc(ref("deviceGroups", g.id), base); const bt = F.writeBatch(fsdb); S.devices.filter((d) => d.groupId === g.id).forEach((d) => bt.set(ref("publicStatus", d.id), pubDoc(d, { groupName: name }))); await bt.commit(); } else await F.addDoc(F.collection(fsdb, "deviceGroups"), { ...base, policyIds: [], createdAt: F.serverTimestamp(), createdBy: S.user.uid }); });
        toast("Kumpulan disimpan."); closeModal(); } catch (e) { if (e.message !== "preview") toast(errMsg(e), true); }
    };
  });
}
function groupCmd(id, type) {
  const g = S.groups.find((x) => x.id === id), n = S.devices.filter((d) => d.groupId === id).length;
  confirmBox({ title: `${type} kumpulan ${g.name}`, body: `Arahan ${type} dihantar kepada ${n} peranti dalam kumpulan ini melalui queue. ${QUEUE_NOTE}`, label: type, danger: type === "LOCK", run: () => send({ commandType: type, groupId: id }) });
}
let qrP; const loadQR = () => qrP || (qrP = new Promise((res, rej) => { if (window.qrcode) return res(); const s = document.createElement("script"); s.src = QR_LIB; s.onload = res; s.onerror = rej; document.head.appendChild(s); }));

document.addEventListener("click", (e) => {
  const nl = e.target.closest("#nav a[data-nav]");
  if (nl) {
    e.preventDefault(); const id = nl.dataset.nav;
    nl.classList.remove("pop"); void nl.offsetWidth; nl.classList.add("pop"); setTimeout(() => nl.classList.remove("pop"), 750);
    if (id === S.page) return;
    S.nav = false; const c = $("#content");
    // tanda halaman aktif serta-merta supaya indicator mula meluncur sambil kandungan lama pudar
    S.page = id; updateNav();
    if (c && !REDUCE) { S.leaving = true; c.classList.add("leave"); setTimeout(() => { location.hash = id; }, 200); } else location.hash = id;
    return;
  }
  if (e.target.closest("[data-close]") || (e.target.matches("[data-close-bg]"))) return closeModal();
  const a = e.target.closest("[data-act]"); if (a && ACTIONS[a.dataset.act]) ACTIONS[a.dataset.act](a);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); render(); }
  else if (t.id === "selall") { const q = S.q.toLowerCase(); S.devices.filter((d) => (!S.fs || d.status === S.fs) && (!S.ft || d.deviceType === S.ft) && (!q || `${d.deviceName} ${d.deviceId} ${d.deviceModel} ${d.assignedUserId || ""}`.toLowerCase().includes(q))).slice(S.pg * 10, S.pg * 10 + 10).forEach((d) => (t.checked ? S.sel.add(d.id) : S.sel.delete(d.id))); render(); }
  else if (t.dataset && t.dataset.apppol) { fsWrite((F) => F.updateDoc(ref("applications", t.dataset.apppol), { policy: t.value, updatedAt: F.serverTimestamp() })).then(() => toast("Polisi dikemas kini.")).catch((e) => { if (e.message !== "preview") toast(errMsg(e), true); render(); }); }
  else if (t.id === "appdev") watchDevInfo(t.value);
  else if (t.id === "mondev") { S.monDay = ""; watchActivity(t.value); }
  else if (t.id === "monday") { S.monDay = t.value === dayKey() ? "" : t.value; watchActivity(S.mon); }
  else if (t.id === "fscope") { S.fscope = t.value; render(); }
  else if (t.dataset && t.dataset.cat) {
    const k = t.dataset.cat, ex = S.webRules.find((r) => r.type === "CATEGORY" && r.value === k && (r.groupId || null) === (S.fscope || null));
    fsWrite(async (F) => { const bt = F.writeBatch(fsdb);
      if (!t.value) { if (ex) bt.delete(ref("webFilteringRules", ex.id)); }
      else if (ex) bt.update(ref("webFilteringRules", ex.id), { action: t.value, updatedAt: F.serverTimestamp() });
      else bt.set(F.doc(F.collection(fsdb, "webFilteringRules")), { type: "CATEGORY", action: t.value, value: k, domains: CATS[k].domains, groupId: S.fscope || null, createdAt: F.serverTimestamp(), createdBy: S.user.uid });
      logEv(F, bt, "WEB_RULE", `Kategori ${CATS[k].label}: ${t.value || "tiada"} (${scopeName(S.fscope)})`); await bt.commit(); })
      .then(() => toast(`${CATS[k].label}: ${t.value || "tiada tindakan"}`)).catch((e) => { if (e.message !== "preview") toast(errMsg(e), true); render(); });
  }
  else if (t.dataset && t.dataset.sellog !== undefined) { t.checked ? S.selLog.add(t.dataset.sellog) : S.selLog.delete(t.dataset.sellog); render(); }
  else if (t.dataset && t.dataset.selcmd !== undefined) { t.checked ? S.selCmd.add(t.dataset.selcmd) : S.selCmd.delete(t.dataset.selcmd); render(); }
  else if (t.id === "logall") { S.logs.forEach((l) => (t.checked ? S.selLog.add(l.id) : S.selLog.delete(l.id))); render(); }
  else if (t.id === "cmdall") { S.commands.forEach((c) => (t.checked ? S.selCmd.add(c.id) : S.selCmd.delete(c.id))); render(); }
  else if (t.id === "fs") { S.fs = t.value; S.pg = 0; render(); } else if (t.id === "ft") { S.ft = t.value; S.pg = 0; render(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; S.pg = 0; render(); } else if (e.target.dataset && e.target.dataset.keep !== undefined) S.keep[e.target.id] = e.target.value; });

setPage();
boot().catch((e) => { $("#root").innerHTML = `<div class="loading" role="alert">Gagal memulakan: ${esc(errMsg(e))}<br><br><button class="btn" onclick="location.reload()">Cuba semula</button></div>`; });
</script>
</body>
