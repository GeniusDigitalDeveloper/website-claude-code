<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Ngap Admin</title>
  <meta name="theme-color" content="#f7f4ea">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/admin.css">
  <script src="assets/js/boot.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div></div>

  <section class="login" id="login">
    <div class="glass box">
      <img src="assets/logo.svg" alt="" width="72" height="72">
      <h1>Ngap Admin</h1>
      <p>Log masuk dengan akaun Google admin untuk urus platform, chatbot dan statistik.</p>
      <button class="btn gold" id="loginBtn" type="button"><span class="t">Log masuk dengan Google</span></button>
      <div class="divider">atau e-mel</div>
      <form class="em" id="emailForm">
        <label class="sr" for="em">E-mel</label><input id="em" type="email" autocomplete="username" placeholder="E-mel admin" required>
        <label class="sr" for="pw">Kata laluan</label><input id="pw" type="password" autocomplete="current-password" placeholder="Kata laluan" required>
        <button class="btn ghost" type="submit"><span class="t">Log masuk</span></button>
      </form>
      <small id="loginErr" role="alert"></small>
      <a href="./" data-nosfx>Kembali ke laman awam</a>
    </div>
  </section>

  <div class="shell" id="shell" hidden>
    <aside class="side glass" aria-label="Menu admin">
      <a class="brand" href="./"><img src="assets/logo.svg" alt="" width="36" height="36"><b>Ngap</b></a>
      <nav id="tabs">
        <button data-tab="overview" aria-current="page"><span class="ico" data-ico="dashboard"></span><span>Ringkasan</span></button>
        <button data-tab="platforms"><span class="ico" data-ico="layers"></span><span>Platform</span></button>
        <button data-tab="faq"><span class="ico" data-ico="help"></span><span>Chatbot</span></button>
        <button data-tab="settings"><span class="ico" data-ico="settings"></span><span>Tetapan</span></button>
      </nav>
      <div class="side-foot">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Bunyi" data-nosfx></button>
        <button class="icon-btn" id="logout" type="button" aria-label="Log keluar" data-ico="logout"></button>
      </div>
    </aside>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet glass"><div class="big" id="mIcon"></div><h3 id="mTitle"></h3><p id="mText"></p><div id="mBody"></div><div class="row" id="mActions"></div></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
