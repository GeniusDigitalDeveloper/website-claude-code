# Deploy backend ke Render (Blueprint). Frontend dilayan sekali oleh server yang sama.
services:
  - type: web
    name: zamrud
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk: { name: zamrud-data, mountPath: /data, sizeGB: 1 }
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://izzulisyraf011207.github.io
