<style>
/* ============ ASAS ============ */
:root{--red:#E10600;--red-hi:#FF4D4D;--ink:#07070A;--panel:#101015;--line:rgba(255,255,255,.12)}
*{-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--ink);color:#F4F4F5;font-family:'DM Sans',system-ui,sans-serif;margin:0;min-height:100vh;overflow-x:hidden}
a,button,[role=button],label.chip{cursor:pointer}

.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s;border:1px solid transparent;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-red{background:linear-gradient(135deg,#FF2A2A,#B80000);color:#fff;box-shadow:0 8px 30px -8px rgba(225,6,0,.7)}

.btn-ghost{background:rgba(255,255,255,.06);border-color:var(--line);color:#F4F4F5}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.inp{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff;font-size:16px}
.inp::placeholder{color:#9CA3AF}
.inp:focus{outline:none;border-color:var(--red-hi);box-shadow:0 0 0 3px rgba(255,77,77,.25)}
select.inp option{color:#111}
.lbl{display:block;font-size:13px;font-weight:600;color:#D1D5DB;margin:0 0 6px}
.hint{font-size:12.5px;color:#9CA3AF;margin-top:6px}
.err{font-size:13px;color:#FF8A8A;margin-top:6px}
.ok{font-size:13px;color:#6EE7A8;margin-top:6px}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
/* WOW 1: cahaya bergerak latar */
.aurora{position:absolute;inset:-20% -10% auto -10%;height:620px;pointer-events:none;
  background:radial-gradient(40% 50% at 30% 30%,rgba(255,42,42,.35),transparent 70%),radial-gradient(35% 45% at 75% 20%,rgba(255,255,255,.10),transparent 70%);
  filter:blur(30px);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,6%,0) scale(1.08)}}
/* WOW 2: kilat menyapu */
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;transform:translateX(-120%) skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%,60%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
/* WOW 3: telefon terapung */
.float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-12px)}}
/* WOW 4: reveal ketika skrol */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.aurora,.shine::after,.float{animation:none}.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}*{transition-duration:.01ms!important}}
.logo-glow{filter:drop-shadow(0 0 28px rgba(255,42,42,.55))}
.gradtxt{background:linear-gradient(90deg,#fff,#FF6B6B 60%,#E10600);-webkit-background-clip:text;background-clip:text;color:transparent}

.phone>.screen{height:100%;border-radius:32px;overflow:auto;scrollbar-width:none}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;max-width:92vw;padding:12px 18px;border-radius:12px;background:#1b1b22;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.6);font-weight:600}
.toast.bad{border-color:#FF4D4D}.toast.good{border-color:#34D399}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal-bg{align-items:center;padding:16px}}

@media(min-width:640px){.modal{border-radius:20px}}

#bgflow .bg-em2{background:radial-gradient(circle,rgba(255,214,120,.8) 0 .9px,transparent 1.8px) 23px 41px/97px 151px,radial-gradient(circle,rgba(255,70,70,.8) 0 1.1px,transparent 2px) 90px 120px/143px 211px;animation:bgem 110s linear infinite;opacity:.4}
#bgflow .bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% 108%,rgba(255,80,30,.20),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.62) 100%)}
@keyframes bggrid{to{transform:translate3d(58px,58px,0)}}
@keyframes bgem{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}
.aurora{display:none}
/* ============ iPHONE ============ */
.iphone{position:relative;width:292px;height:604px;border-radius:56px;padding:10px;background:linear-gradient(145deg,#9a9aa3 0%,#2b2b31 16%,#5d5d66 50%,#26262c 84%,#8b8b94 100%);box-shadow:0 0 0 1px #0b0b0d,inset 0 0 0 2px rgba(255,255,255,.2),0 40px 90px -25px rgba(56,189,248,.4),0 30px 70px -30px rgba(225,6,0,.55)}

/* ============ ANIMASI SKROL ============ */

/* ============ GAYA PROFIL BAHARU ============ */
.fl-bn{height:150px;margin:0 -16px;background-size:cover;background-position:center;border-radius:0 0 var(--r) var(--r);position:relative;display:grid;place-items:center}

.fl-ringwrap .fl-avatar{animation:ringspin 6s linear infinite reverse}

/* ============ ALAT POTONG GAMBAR + MEDAN GAMBAR + MODAL SISI ============ */
.crf{position:relative;width:100%;max-height:52vh;overflow:hidden;border-radius:14px;background:#000;touch-action:none;cursor:grab;border:1px solid var(--line)}

  .modal-bg.side{pointer-events:none;background:transparent;align-items:stretch;justify-content:flex-start;padding:12px}

}

/* ============ POSTER HERO (hero penuh + kad berbingkai) ============ */
.fl-tpl-poster .fl-wrap,.fl-pwrap{max-width:520px;padding:0;gap:0}

.fl-pbtn:hover{background:rgba(10,10,14,.75)}.fl-pbtn:active{transform:scale(.9)}.fl-pbtn-l{left:14px}.fl-pbtn-r{right:14px}
.fl-phero-txt{position:relative;width:100%;padding:0 18px 4px;text-align:center;z-index:2}
.fl-ptitle-main{margin:0;font-size:clamp(34px,11vw,56px);line-height:1.02;font-weight:800;text-transform:uppercase;letter-spacing:.01em;background:linear-gradient(180deg,color-mix(in srgb,var(--btn) 35%,#fff) 0%,var(--btn) 52%,color-mix(in srgb,var(--btn) 65%,#3a2200) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 14px rgba(0,0,0,.55))}
.fl-pbio{margin:12px 4px 0;font-size:17px;font-weight:600;line-height:1.45;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}

.fl-pbar:hover,.fl-pfeat:hover{transform:translate3d(0,-3px,0)}.fl-pbar:active,.fl-pfeat:active{transform:scale(.98)}
.fl-pb-a,.fl-pf-a{color:var(--btn);text-decoration:none}
.fl-pb-a{display:flex;align-items:center;gap:14px;padding:10px 54px 10px 10px;min-height:calc(76px * var(--sz,1))}
.fl-pth{width:56px;height:56px;border-radius:10px;flex:none;border:1px solid color-mix(in srgb,var(--btn) 60%,transparent);display:grid;place-items:center;overflow:hidden}

.fl-pmore:hover{opacity:1}.fl-pmore:active{transform:scale(.85)}

Rangkaian", "Networks"], ["Jadualkan", "Schedule"], ["Hantar sekarang", "Send now"], ["Tiada post", "No posts"], ["Senarai", "List"], ["Rekod", "Records"], ["Maklumat", "Information"], ["Papar", "Display"], ["Bahasa", "Language"], ["Tempahan", "Bookings"], ["Nama penuh", "Full name"], ["Mesej", "Message"], ["Hantar mesej", "Send message"], ["E-mel", "Email"], ["Telefon", "Phone"], ["Tarikh dan masa", "Date and time"], ["Hubungi sekarang", "Contact now"], ["Kata pelanggan", "Customer testimonials"], ["Dikuasakan oleh Flash Link", "Powered by Flash Link"], ["Cipta Flash Link anda", "Create your Flash Link"], ["Sertai", "Join"], ["di Flash Link", "on Flash Link"], ["Buat Flash Link anda sendiri. Satu pautan untuk semua jualan anda.", "Make your own Flash Link. One link for all your sales."], ["Bila ada versi lebih baharu, butang kuning Kemas kini muncul di sebelah Mula sekarang, serta-merta tanpa perlu tekan apa-apa. Aplikasi EXE/ZIP juga sambung ke pangkalan data yang sama.", "When a newer version exists, the yellow Update button appears next to Get started, instantly, with nothing to press. The EXE/ZIP app also connects to the same database."], ["Lupa kata laluan? Guna \"Lupa kata laluan?\" di halaman log masuk.", "Forgot your password? Use \"Forgot password?\" on the login page."], ["Teks post", "Post text"], ["Zon waktu:", "Time zone:"], ["(tukar di atas kalendar).", "(change it above the calendar)."], ["Baharu", "New"], ["Teks post anda akan dipaparkan di sini.", "Your post text will appear here."], ["Tulis kapsyen, hashtag dan pautan anda…", "Write your caption, hashtags and link…"], ["Jadualkan post media sosial pada tarikh dan masa pilihan anda.", "Schedule social media posts for your chosen date and time."], ["Gambar sedia ada", "Existing image"], ["Design saya", "My designs"], ["WhatsApp saya", "My WhatsApp"], ["Animasi butang", "Button animation"], ["Kad besar", "Large card"], ["Corak & gaya butang", "Pattern & button style"], ["Gaya butang", "Button style"], ["Kaca", "Glass"], ["Orbit kaca", "Glass orbit"], ["Diskaun 20%", "20% off"], ["Set Kek Lapis Premium", "Premium Layer Cake Set"], ["Video terbaru", "Latest video"], ["Bahasa dan terjemahan", "Language and translation"], ["Bahasa lalai ialah English. Guna suis EN / BM di bahagian atas halaman untuk tukar ke Bahasa Melayu atau kembali ke English. Pilihan anda diingati.", "The default language is English. Use the EN / BM switch at the top of the page to change to Bahasa Melayu or back to English. Your choice is remembered."], ["(Pengguna baharu sahaja)", "(New user only)"], ["Daftar akaun", "Register account"], ["Daftar dengan e-mel Google anda, kemudian tetapkan kata laluan (taip dua kali) sebelum masuk ke dashboard.", "Register with your Google email, then set a password (type it twice) before entering the dashboard."], ["Sudah ada akaun? Log masuk", "Already have an account? Log in"], ["Pengguna baharu? Daftar di sini", "New user? Register here"], ["Bunyi azan", "Azan sound"], ["Bila waktu solat masuk dan app dibuka, azan dilaungkan bersama pop-up. Azan Subuh khas untuk Subuh; azan lain untuk empat waktu selebihnya.", "When a prayer time begins and the app is open, the azan is called together with the pop-up. The Fajr azan is only for Fajr; the other azan is for the remaining four prayers."], ["Hidup: azan dibunyikan bersama pop-up.", "On: the azan plays with the pop-up."], ["Tutup: hanya pop-up, tiada bunyi azan.", "Off: pop-up only, no azan sound."], ["Cuba pop-up dan azan", "Test pop-up and azan"], ["Waktu solat belum dimuatkan.", "Prayer times are not loaded yet."], ["Sekarang sudah masuk waktu solat", "It is now time for prayer"], ["Jom sama-sama tunaikan solat awal waktu, semoga kita berjaya dunia dan akhirat.", "Let us perform our prayer together at the very beginning of its time, and may we find success in this world and the Hereafter."], ["Azan dan pop-up waktu solat", "Azan and prayer pop-up"], ["Bila waktu solat masuk dan app sedang dibuka, satu pop-up di tengah skrin memaparkan waktu itu dengan bunyi loceng lembut.", "When a prayer time begins and the app is open, a pop-up in the centre of the screen shows that time."], ["Bila waktu solat masuk dan app sedang dibuka, pop-up bergambar masjid keluar dengan kesan pudar, dan azan dibunyikan jika butang azan (ikon speaker di sebelah Tukar zon) dihidupkan. Azan Subuh khas untuk Subuh; azan lain untuk empat waktu selebihnya. Tekan pangkah untuk tutup: pop-up dan azan pudar hilang, dan tidak keluar lagi untuk waktu itu.", "When a prayer time begins and the app is open, a pop-up with a mosque picture appears with a fade-in, and the azan plays if the azan button (the speaker icon next to Change zone) is on. The Fajr azan is only for Fajr; the other azan is for the remaining four prayers. Press the close button: the pop-up and azan fade out, and it will not appear again for that prayer."], ["Azan daripada siapa?", "Who calls the azan?"], ["Azan Subuh dilaungkan oleh Furqan Fawaz (khas untuk waktu Subuh). Azan empat waktu lain (Zuhur, Asar, Maghrib dan Isyak) dilaungkan oleh Ustaz Asri (Rabbani). Kredit azan dipaparkan di bawah paparan waktu solat dan di bawah pop-up solat.", "The Fajr azan is called by Furqan Fawaz (only for the Fajr prayer). The azan for the other four prayers (Dhuhr, Asr, Maghrib and Isha) is called by Ustaz Asri (Rabbani). The azan credit is shown under the prayer times panel and under the prayer pop-up."], ["Hidup atau tutup azan", "Turn the azan on or off"], ["Tekan butang speaker di sebelah Tukar zon, kemudian tekan atau seret suis: ke kanan (hijau) untuk hidupkan, ke kiri (kelabu) untuk tutup. Jika ditutup, hanya pop-up keluar tanpa bunyi azan. Ada juga butang untuk mencuba pop-up dan azan.", "Press the speaker button next to Change zone, then tap or drag the switch: to the right (green) to turn it on, to the left (grey) to turn it off. When off, only the pop-up appears with no azan sound. There is also a button to test the pop-up and azan."], ["Sumber waktu solat", "Prayer time source"], ["Waktu solat diambil daripada data rasmi JAKIM (e-solat.gov.my) mengikut zon anda dan dikemas kini setiap hari.", "Prayer times come from the official JAKIM data (e-solat.gov.my) for your zone and are refreshed every day."], ["Tukar zon waktu solat", "Change prayer time zone"], ["Tekan Tukar zon di paparan waktu solat, pilih negeri dan zon, atau guna lokasi anda. Zon dikesan automatik pada mulanya. Negeri dan zon dalam pop-up solat mengikut pilihan ini.", "Press Change zone on the prayer times panel, pick the state and zone, or use your location. The zone is detected automatically at first. The state and zone in the prayer pop-up follow this choice."], ["Gambar masjid pop-up", "Pop-up mosque pictures"], ["Latar pop-up berubah mengikut waktu: Subuh Kaabah (Makkah), Zuhur Masjid Nabawi (Madinah), Asar Masjid Kristal (Terengganu), Maghrib Masjid Sultan Salahuddin Abdul Aziz Shah dan Isyak Masjid Wilayah Persekutuan. Kredit foto dipaparkan di bawah pop-up. Gambar di paparan waktu solat ialah Masjid Putra oleh Muhammad Faqih.", "The pop-up background changes with the prayer: Fajr the Kaaba (Makkah), Dhuhr Masjid Nabawi (Madinah), Asr the Crystal Mosque (Terengganu), Maghrib Sultan Salahuddin Abdul Aziz Shah Mosque and Isha the Federal Territory Mosque. Photo credits are shown under the pop-up. The picture on the prayer times panel is Putra Mosque by Muhammad Faqih."], ["Daftar dan log masuk", "Register and log in"], ["Butang merah Get started untuk pengguna baharu sahaja: daftar dengan e-mel Google, kemudian tetapkan kata laluan (taip dua kali) sebelum masuk dashboard. Butang hijau Log masuk untuk pengguna sedia ada: masukkan e-mel dan kata laluan (ikon mata untuk tunjuk atau sembunyi). Selepas log keluar anda dibawa ke laman utama.", "The red Get started button is for new users only: register with your Google email, then set a password (type it twice) before entering the dashboard. The green Log in button is for existing users: enter your email and password (use the eye icon to show or hide it). After logging out you are taken to the home page."], ["Kemas kini dengan peratusan", "Update with percentage"], ["Bila ada versi baharu, butang kuning Kemas kini muncul. Tekan dan ia menunjukkan peratusan muat turun (0 hingga 100%) serta anggaran masa berbaki. Selepas 100% paparan bertukar dengan peralihan lancar ke versi baharu.", "When a new version exists, a yellow Update button appears. Press it and it shows the download percentage (0 to 100%) with an estimated time remaining. After 100% the screen switches smoothly to the new version."], ["Profil kosong di PC lain", "Empty profile on another PC"], ["Satu e-mel hanya ada satu profil dan data disimpan dalam akaun, bukan dalam pelayar. Jika profil nampak kosong di PC lain, tekan Ctrl+Shift+R, log keluar dan log masuk semula dengan e-mel yang sama.", "One email has only one profile and your data is stored in the account, not in the browser. If the profile looks empty on another PC, press Ctrl+Shift+R, log out and log in again with the same email."], ["Kaunter pengguna dan pelawat", "User and visitor counters"], ["Di footer ada kaunter Pengguna, Pelawat hari ini, Pelawat bulan ini dan Pelawat keseluruhan. Pelawat dikira sekali setiap sesi pelayar dan ditetapkan semula mengikut hari dan bulan waktu Malaysia.", "The footer shows Users, Visitors today, Visitors this month and Total visitors. A visitor is counted once per browser session and resets by day and month in Malaysia time."], ["Pop-up solat tidak keluar", "Prayer pop-up does not appear"], ["Pop-up hanya keluar bila app dibuka ketika waktu solat masuk (dalam 30 minit pertama) dan belum dipangkah untuk waktu itu. Pastikan waktu solat dimuatkan (semak internet) dan zon betul. Jika azan tidak berbunyi, semak suis azan hidup dan sentuh skrin sekali kerana pelayar boleh menyekat bunyi automatik.", "The pop-up only appears when the app is open as a prayer time begins (within the first 30 minutes) and it has not been closed for that prayer. Make sure the prayer times are loaded (check your internet) and the zone is correct. If the azan does not sound, check the azan switch is on and touch the screen once because browsers can block automatic sound."], ["Pangkah dan batal edit", "Close and cancel editing"], ["Dalam tetingkap Edit design, tekan Siap untuk simpan atau pangkah (X) untuk batalkan semua perubahan dalam tetingkap itu.", "In the Edit design window, press Done to save or the close (X) button to cancel all changes made in that window."], ["Hubungi pentadbir", "Contact the administrator"], ["Jika soalan anda tiada jawapan di sini, sila hubungi pentadbir Genius Digital.", "If your question is not answered here, please contact the Genius Digital administrator."], ["Apa itu Flash Link", "What is Flash Link"], ["Flash Link ialah satu pautan untuk semua jualan anda: letak di bio Instagram atau TikTok dan pelanggan terus ke WhatsApp, Shopee, TikTok Shop atau YouTube. Tiada potongan jualan.", "Flash Link is one link for all your sales: put it in your Instagram or TikTok bio and customers go straight to your WhatsApp, Shopee, TikTok Shop or YouTube. There is no sales commission."], ["Bunyi dan kesan bunyi", "Sounds and sound effects"], ["Tiada muzik latar. Hanya kesan bunyi kecil ketika skrol dan klik butang di laman utama dan log masuk. Azan hanya berbunyi bersama pop-up solat jika suis azan hidup.", "There is no background music. Only small sound effects when scrolling and clicking buttons on the home and login pages. The azan only sounds with the prayer pop-up if the azan switch is on."], ["Maaf, saya hanya menjawab tentang Flash Link dan belum pasti maksud soalan itu. Adakah salah satu topik ini yang anda cari? Atau cuba soalan pendek, cth. “tambah pautan”, “azan”, “kemas kini”.", "Sorry, I only answer questions about Flash Link and I'm not sure what you mean. Is one of these topics what you are looking for? Or try a short question, e.g. “add link”, “azan”, “update”."], ["Siapa pembuat Flash Link", "Who made Flash Link"], ["Flash Link dibina oleh Genius Digital. Untuk pertanyaan lanjut atau bantuan, hubungi pentadbir Genius Digital.", "Flash Link is built by Genius Digital. For more questions or help, contact the Genius Digital administrator."], ["Terkecil", "Smallest"], ["Sangat kecil", "Extra small"], ["Harga (pilihan)", "Price (optional)"], ["Tiada harga", "No price"], ["Letak harga", "Show a price"], ["Percuma", "Free"], ["Harga (RM)", "Price (RM)"], ["Logo / gambar kecil pada butang", "Logo / small image on buttons"], ["Kecilkan logo dan tarik ke kanan supaya tidak terkeluar daripada kotak.", "Make the logo smaller and move it to the right so it stays inside the box."], ["Saiz logo", "Logo size"], ["Tarik ke kanan", "Move right"], ["atau daftar secara manual", "or register manually"], ["Cipta akaun", "Create account"], ["E-mel ini sudah berdaftar. Sila log masuk.", "This email is already registered. Please log in."], ["Daftar dengan e-mel Google, atau secara manual dengan e-mel dan kata laluan. Anda terus masuk ke dashboard tanpa sebarang kod pengesahan.", "Register with your Google email, or manually with an email and password. You go straight to the dashboard with no verification code."], ["Pendaftaran gagal: ", "Registration failed: "], ["Kolaborasi", "Collaboration"], ["Kolaborasi Utama", "Main Collaboration"], ["Produk Kami", "Our Products"], ["Kolaborasi utama dan produk-produk kami. Klik logo untuk membuka laman web masing-masing. Senarai ini dikawal oleh admin dan dikemas kini serta-merta.", "Our main collaboration and products. Click a logo to open its website. This list is managed by the admin and updates instantly."], ["Di bahagian Kolaborasi anda boleh lihat kolaborasi utama dan produk-produk kami. Klik mana-mana logo untuk membuka laman webnya. Senarai produk dikawal oleh admin dan berubah serta-merta tanpa perlu muat semula.", "In the Collaboration section you can see our main collaboration and products. Click any logo to open its website. The product list is managed by the admin and changes instantly with no reload."], ["Akses ditolak", "Access denied"], ["Panel Admin", "Admin Panel"], ["Masukkan e-mel dan kata laluan.", "Enter your email and password."], ["Ahli (e-mel direkodkan)", "Members (emails recorded)"], ["Profil Flash Link", "Flash Link profiles"], ["Produk kolaborasi", "Collaboration products"], ["Kolaborasi utama", "Main collaboration"], ["Dikemas kini serta-merta dalam app awam. Logo utama dipaparkan di tengah, produk di bawahnya.", "Updated instantly in the public app. The main logo is shown in the centre, with the products below it."], ["Nama (di bawah logo)", "Name (under the logo)"], ["Tajuk senarai produk", "Product list title"], ["Pautan laman web (apabila logo diklik)", "Website link (when the logo is clicked)"], ["Tukar logo utama", "Change main logo"], ["Produk kami", "Our products"], ["Tambah produk", "Add product"], ["Produk disusun kiri ke kanan mengikut nombor. Tukar kedudukan dengan butang naik/turun, taip nombor, atau seret pemegang.", "Order: number 1 at the top left, number 2 slightly lower on the right, and so on. Change the position with the up/down buttons, by typing a number, or by dragging the handle."], ["Pengguna / ahli", "Users / members"], ["E-mel direkodkan semasa log masuk. Pengguna lama muncul selepas mereka log masuk sekali lagi.", "Emails are recorded at login. Existing users appear after they log in once more."], ["Daftar", "Registered"], ["Log masuk akhir", "Last login"], ["Belum ada produk.", "No products yet."], ["Belum ada rekod.", "No records yet."], ["Tidak dapat memuatkan senarai ahli.", "Could not load the member list."], ["Disimpan ✓", "Saved ✓"], ["Logo dikemas kini ✓", "Logo updated ✓"], ["Produk ditambah ✓", "Product added ✓"], ["Dipadam.", "Deleted."], ["Produk baharu", "New product"], ["Nama produk", "Product name"], ["Kedudukan", "Position"], ["Naik", "Up"], ["Turun", "Down"], ["Tukar logo", "Change logo
