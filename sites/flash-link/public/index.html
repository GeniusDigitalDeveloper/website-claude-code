let FB = null, auth = null, db = null, rtdb = null;
let authReadyRes; const authReady = new Promise(r => (authReadyRes = r));
const S = { user: null, profile: null, links: [], tab: "links", events: null, leads: null, range: 7, loadingProfile: false, celebrate: false };

async function initFirebase() {
  if (!CONFIGURED) { authReadyRes(); return; }
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [app, a, f, r] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js"),
    HAS_RTDB ? import(base + "firebase-database.js") : Promise.resolve(null),
  ]);
  const inst = app.initializeApp(FIREBASE_CONFIG, "flashlink"); // nama app berasingan
  FB = { ...a, ...f, rt: r };
  auth = a.getAuth(inst); db = f.getFirestore(inst);
  if (r) rtdb = r.getDatabase(inst);
  a.onAuthStateChanged(auth, async u => {
    S.user = u; S.profile = null; S.links = [];
    if (u) { await loadProfile(); }
    authReadyRes(); route(true);
  });
}
async function loadProfile() {
  if (!S.user) return;
  S.loadingProfile = true;
  try {
    const s = await FB.getDoc(FB.doc(db, "flashlink_users", S.user.uid));
    S.profile = s.exists() ? normProfile(s.data()) : null;
    if (S.profile) await loadLinks();
  } catch (e) { console.error(e); toast("Tak dapat muat profil. Semak sambungan anda.", "bad"); }
  S.loadingProfile = false;
}
function normProfile(p) {
  const tpl = TPL[p.template] ? p.template : "minimal";
  return { username: "", displayName: "", bio: "", avatarUrl: "", bannerUrl: "", socialIcons: [], testimonials: [], plan: "free", ...p, template: tpl, theme: { ...TPL[tpl].theme, auto: false, ...(p.theme || {}) } };
}
async function loadLinks(uid = S.user.uid) {
  const q = FB.query(FB.collection(db, "flashlink_links"), FB.where("uid", "==", uid));
  const s = await FB.getDocs(q);
  const arr = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (uid === S.user?.uid) S.links = arr;
  return arr;
}

function rootStyle(p) {
  const t = p.theme, btn = hex(t.btn, "#111111");
  let bg = hex(t.bg1, "#ffffff");
  if (t.bgType === "gradient") bg = `linear-gradient(160deg,${hex(t.bg1, "#05060F")},${hex(t.bg2, "#1A0A12")})`;
  if (t.bgType === "image" && safeUrl(t.bgImg)) bg = `linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('${encodeURI(safeUrl(t.bgImg)).replace(/'/g, "%27")}') center/cover`;
  const font = FONTS.includes(t.font) ? t.font : "Inter";
  return `--bgcss:${bg};--text:${hex(t.text, "#111111")};--btn:${btn};--btnText:${onColor(btn)};--r:${SHAPES[t.shape] || "16px"};--font:'${font}'`;
}
function socialHtml(p) {
  const items = (p.socialIcons || []).filter(s => s.url);
  if (!items.length) return "";
  return `<div class="fl-social">${items.map(s => {
    const meta = SOCIALS.find(x => x[0] === s.type); if (!meta) return "";
    const href = s.type === "mail" ? "mailto:" + encodeURIComponent(s.url).replace(/%40/g, "@") : safeUrl(s.url);
    return href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" aria-label="${meta[1]}">${ic(meta[2], "w-5 h-5")}</a>` : "";
  }).join("")}</div>`;
}
const linkAttrs = l => `href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer" data-link="${esc(l.id)}"`;
function formHtml(l) {
  return `<form class="fl-card fl-form" data-lead="${esc(l.id)}" novalidate>

    <input name="email" type="email" placeholder="E-mel" autocomplete="email" maxlength="120" aria-label="E-mel" required>

    <input class="fl-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

}
function productHtml(l, badgeFirst) {

  return `<a class="fl-card fl-prod" ${linkAttrs(l)}>${img ? `<img src="${esc(img)}" alt="${esc(l.title)}" loading="lazy" decoding="async">` : `<div class="fl-ph">${ic("bag", "w-7 h-7")}</div>`}
    <div class="fl-pi">${badge}<b>${esc(l.title)}</b>${Number(l.price) ? `<div class="fl-price">${rm(l.price)}</div>` : ""}<span class="fl-buy">Beli sekarang ${ic("ext", "w-4 h-4")}</span></div></a>`;

function buttonHtml(l) {
  const icon = l.type === "youtube" ? "youtube" : l.type === "whatsapp" ? "whatsapp" : /\.pdf(\?|$)/i.test(l.url || "") ? "file" : /shopee|tiktok|lazada/i.test(l.url || "") ? "bag" : "link";
  const yt = l.type === "youtube" && ytId(l.url);

  return `<a class="fl-btn" ${linkAttrs(l)}>${ic(icon, "w-5 h-5")}<span class="fl-t">${esc(l.title)}</span></a>`;

function tileHtml(l) {
  if (l.type === "product") return productHtml(l);
  const img = safeUrl(l.thumbnailUrl);

  return `<a class="fl-card fl-tile" ${linkAttrs(l)}>${img ? `<img class="fl-img" src="${esc(img)}" alt="" loading="lazy" decoding="async">` : `<div class="fl-img" style="color:var(--btn)">${ic(icon, "w-12 h-12")}</div>`}<div class="fl-tt">${esc(l.title)}</div></a>`;

function renderProfile(p, links, { preview = false } = {}) {
  const t = p.theme, tpl = p.template, act = links.filter(l => l.active !== false);
  loadFont(t.font);
  const avatar = safeUrl(p.avatarUrl);

  } else if (tpl === "landing") {
    const cta = act.find(l => l.type === "whatsapp") || act.find(l => l.type !== "header" && l.type !== "email_form");
    const services = act.filter(l => l !== cta && l.type !== "email_form" && l.type !== "header");
    const forms = act.filter(l => l.type === "email_form");

      (services.length ? `<h2 class="fl-sec">Servis & pautan</h2>` + services.map(blockHtml).join("") : "") +
      (tests.length ? `<h2 class="fl-sec">Kata pelanggan</h2>` + tests.map(x => `<div class="fl-card fl-quote">“${esc(x.text)}”<small>— ${esc(x.name || "Pelanggan")}</small></div>`).join("") : "") +
      (forms.length ? `<h2 class="fl-sec">Tempahan</h2>` + forms.map(formHtml).join("") : "") +

function tileProduct(l) { return productHtml(l); }
function blockHtml(l) {
  if (l.type === "header") return `<h3 class="fl-header">${esc(l.title)}</h3>`;

/* ---------- Penjejak & borang awam ---------- */
function track(uid, linkId, type) {
  if (!db) return;
  FB.addDoc(FB.collection(db, "flashlink_events"), { uid, linkId: linkId || "", type, device: device(), referrer: (document.referrer || "langsung").slice(0, 200), createdAt: FB.serverTimestamp() }).catch(() => {});
}
function bindPublicEvents(root, uid) {
  root.addEventListener("click", e => {
    const a = e.target.closest("a[data-link]"); if (!a) return;
    const id = a.dataset.link; if (!db || id.startsWith("demo")) return;
    track(uid, id, "click");
    FB.updateDoc(FB.doc(db, "flashlink_links", id), { clicks: FB.increment(1) }).catch(() => {});
  });
  root.addEventListener("submit", async e => {
    const f = e.target.closest("form[data-lead]"); if (!f) return;
    e.preventDefault();
    const msg = $(".fl-msg", f), v = n => f.elements[n].value.trim();
    if (v("website")) return; // honeypot
    if (!v("name") || !/^\S+@\S+\.\S+$/.test(v("email"))) { msg.textContent = "Sila isi nama dan e-mel yang sah."; return; }
    let hist = []; try { hist = JSON.parse(localStorage.getItem("fl_leads") || "[]").filter(t => Date.now() - t < 3600e3); } catch {}
    if (hist.length >= 3) { msg.textContent = "Terlalu banyak hantaran. Cuba lagi sejam lagi."; return; }
    if (!db || f.dataset.lead.startsWith("demo")) { msg.textContent = "Mod demo: borang tidak dihantar."; return; }
    const btn = $("button", f); btn.disabled = true;
    try {
      await FB.addDoc(FB.collection(db, "flashlink_leads"), { uid, name: v("name"), email: v("email"), phone: v("phone"), message: v("message"), createdAt: FB.serverTimestamp() });
      hist.push(Date.now()); try { localStorage.setItem("fl_leads", JSON.stringify(hist)); } catch {}
      msg.textContent = "Terima kasih! Mesej anda telah dihantar ✓"; f.reset();
    } catch { msg.textContent = "Maaf, gagal menghantar. Cuba lagi."; }
    btn.disabled = false;
  });
}

  <section class="glass" style="border-radius:18px;padding:16px"><h2 class="lbl" style="font-size:15px;color:#fff">Testimoni (untuk templat Laman Mini)</h2>${tests.map((x, i) => inp("tn" + i, `Nama #${i + 1}`, x.name, "Nurul", 'maxlength="40"') + inp("tt" + i, `Ulasan #${i + 1}`, x.text, "Servis mesra dan laju!", 'maxlength="160"')).join("")}</section></div>`;
  $("#bt").value = t.bgType || "solid"; $("#sh").value = t.shape || "pill";
  const commit = (touchColors) => { if (touchColors) { S.profile.theme.auto = false; $("#au").checked = false; } checkContrast(); refreshPreview(); saveProfile(); };
  const checkContrast = () => { const th = S.profile.theme, bg = hex(th.bg1, "#fff"); const c = contrast(hex(th.text, "#000"), bg), b = contrast(onColor(th.btn), hex(th.btn, "#000")); $("#ctr").textContent = c < 4.5 ? `Kontras teks/latar rendah (${c.toFixed(1)}:1). Cuba warna teks lebih berbeza supaya mudah dibaca.` : ""; };
  $$("[data-t]").forEach(b => (b.onclick = () => { const k = b.dataset.t; const keep = S.profile.theme.btn; S.profile.template = k; S.profile.theme = { ...TPL[k].theme, auto: true, btn: S.profile.theme.auto ? TPL[k].theme.btn : keep }; if (!S.profile.theme.auto) S.profile.theme.auto = false; saveProfile(); designTab(); refreshPreview(); }));
  const on = (id, fn, ev = "input") => $("#" + id).addEventListener(ev, e => fn(e.target.value, e.target));
  on("dn", v => { p.displayName = v.slice(0, 40); commit(); }); on("bio", v => { p.bio = v; commit(); });
  on("av", v => { p.avatarUrl = v.trim(); commit(); }); on("bn", v => { p.bannerUrl = v.trim(); commit(); });
  on("bt", v => { t.bgType = v; $("#bgi").style.display = v === "image" ? "" : "none"; commit(true); }, "change");
  on("c1", v => { t.bg1 = v; commit(true); }); on("c2", v => { t.bg2 = v; commit(true); }); on("ct", v => { t.text = v; commit(true); }); on("cb", v => { t.btn = v; commit(true); });
  on("bi", v => { t.bgImg = v.trim(); commit(true); });
  on("ft", v => { t.font = v; commit(); }, "change"); on("sh", v => { t.shape = v; commit(); }, "change");
  on("au", (v, el) => { t.auto = el.checked; commit(); }, "change");
  const socs = () => { p.socialIcons = SOCIALS.map(([k]) => ({ type: k, url: $("#s_" + k).value.trim() })).filter(s => s.url); commit(); };
  SOCIALS.forEach(([k]) => on("s_" + k, socs));
  const tst = () => { p.testimonials = [0, 1, 2].map(i => ({ name: $("#tn" + i).value.trim(), text: $("#tt" + i).value.trim() })).filter(x => x.text); commit(); };
  [0, 1, 2].forEach(i => { on("tn" + i, tst); on("tt" + i, tst); });
  checkContrast();
}

/* --- Tab Statistik --- */
async function statsTab() {
  const pane = $("#pane"); pane.innerHTML = `<div style="display:grid;place-items:center;padding:48px"><div class="spin" role="status" aria-label="Memuatkan"></div></div>`;
  try {
    if (!S.events) { const [ev, ld] = await Promise.all([FB.getDocs(FB.query(FB.collection(db, "flashlink_events"), FB.where("uid", "==", S.user.uid))), FB.getDocs(FB.query(FB.collection(db, "flashlink_leads"), FB.where("uid", "==", S.user.uid)))]);
      S.events = ev.docs.map(d => { const x = d.data(); return { ...x, t: x.createdAt?.toDate?.() || new Date() }; }); S.leads = ld.docs.map(d => { const x = d.data(); return { ...x, t: x.createdAt?.toDate?.() || new Date() }; }).sort((a, b) => b.t - a.t); }
  } catch (e) { console.error(e); return (pane.innerHTML = `<div class="glass" style="border-radius:18px;padding:24px;text-align:center">Tak dapat muat statistik. Semak sambungan & Firestore rules.</div>`); }
  const draw = () => {
    const days = S.range, since = Date.now() - days * 864e5, ev = S.events.filter(e => e.t.getTime() >= since);
    const views = ev.filter(e => e.type === "view").length, clicks = ev.filter(e => e.type === "click").length, ctr = views ? Math.round(clicks / views * 100) : 0;
    const byDay = Array.from({ length: days }, (_, i) => { const d = new Date(Date.now() - (days - 1 - i) * 864e5); d.setHours(0, 0, 0, 0); return { d, v: 0, c: 0 }; });
    ev.forEach(e => { const i = byDay.findIndex(x => e.t >= x.d && e.t < new Date(x.d.getTime() + 864e5)); if (i >= 0) e.type === "view" ? byDay[i].v++ : byDay[i].c++; });
    const max = Math.max(1, ...byDay.map(x => x.v));
    const per = S.links.filter(l => l.type !== "header").map(l => ({ l, n: ev.filter(e => e.type === "click" && e.linkId === l.id).length })).sort((a, b) => b.n - a.n);
    const pm = Math.max(1, ...per.map(x => x.n));
    $("#st").innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${[["Lawatan", views], ["Klik", clicks], ["Kadar klik", ctr + "%"]].map(([n, v]) => `<div class="glass" style="border-radius:16px;padding:14px;text-align:center"><div class="font-display" style="font-size:28px;font-weight:700">${v}</div><div style="color:#9CA3AF;font-size:13px">${n}</div></div>`).join("")}</div>
    ${HAS_RTDB ? `<div class="glass" style="border-radius:16px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:center">${ic("users", "w-5 h-5")}<span>Pelawat aktif sekarang: <b id="live">0</b></span></div>` : ""}
    <div class="glass" style="border-radius:18px;padding:16px;margin-top:12px"><div class="lbl">Lawatan harian</div>${views || clicks ? `<div style="display:flex;align-items:flex-end;gap:${days > 7 ? 2 : 8}px;height:120px" role="img" aria-label="Carta lawatan harian">${byDay.map(x => `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="${x.d.toLocaleDateString("ms-MY")}: ${x.v} lawatan"><div class="bar" style="height:${x.v / max * 100}%"></div></div>`).join("")}</div>` : `<p style="color:#9CA3AF;margin:8px 0 0">Belum ada lawatan. Kongsi pautan anda untuk mula!</p>`}</div>
    <div class="glass" style="border-radius:18px;padding:16px;margin-top:12px"><div class="lbl">Klik setiap pautan</div>${per.length ? per.map(x => `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px">${esc(x.l.title)}</span><b>${x.n}</b></div><div style="height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden"><div style="height:100%;width:${x.n / pm * 100}%;background:linear-gradient(90deg,#B80000,#FF4D4D)"></div></div></div>`).join("") : `<p style="color:#9CA3AF;margin:0">Tiada pautan lagi.</p>`}</div>
    <div class="glass" style="border-radius:18px;padding:16px;margin-top:12px"><div class="lbl">Pelanggan daripada borang (${S.leads.length})</div>${S.leads.length ? S.leads.slice(0, 20).map(x => `<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${esc(x.name)}</b> · <a href="mailto:${esc(x.email)}" style="color:#FF8A8A">${esc(x.email)}</a>${x.phone ? ` · ${esc(x.phone)}` : ""}<div style="color:#C7C9D1;font-size:14px">${esc(x.message || "")}</div><small style="color:#9CA3AF">${x.t.toLocaleString("ms-MY")}</small></div>`).join("") : `<p style="color:#9CA3AF;margin:0">Belum ada. Tambah blok “Borang e-mel” untuk kumpul pelanggan.</p>`}</div>`;
    $$("[data-r]").forEach(b => b.setAttribute("aria-pressed", b.dataset.r == S.range));
  };
  pane.innerHTML = `<div style="display:flex;gap:8px;margin-bottom:12px">${[7, 30].map(n => `<button class="chip" data-r="${n}" aria-pressed="${S.range === n}">${n} hari</button>`).join("")}<button class="chip" id="rf" style="margin-left:auto">Muat semula</button></div><div id="st"></div>`;
  $$("[data-r]").forEach(b => (b.onclick = () => { S.range = +b.dataset.r; draw(); }));
  $("#rf").onclick = () => { S.events = null; statsTab(); };
  draw();
  if (HAS_RTDB && $("#live")) { try { FB.rt.onValue(FB.rt.ref(rtdb, `flashlink/live/${S.user.uid}`), s => { const el = $("#live"); if (el) el.textContent = s.val() || 0; }); } catch {} }
}

/* ---------- Router ---------- */
function nav(path, replace) { replace ? history.replaceState({}, "", path) : history.pushState({}, "", path); route(true); window.scrollTo(0, 0); }
function route() {
  document.documentElement.style.background = "";
  const p = location.pathname.replace(/\/+$/, "") || "/", seg = p.split("/").filter(Boolean);
  if (p === "/" || p === "/index.html") return landing();
  if (p === "/login") return loginView();
  if (p === "/dashboard") return dashView();
  if (seg.length === 1 && (USER_RE.test(seg[0]) || seg[0] === "demo") && !(RESERVED.has(seg[0]) && seg[0] !== "demo")) return publicView(seg[0]);
  notFound();
}
document.addEventListener("click", e => { const a = e.target.closest("a[data-nav]"); if (!a || e.metaKey || e.ctrlKey) return; e.preventDefault(); nav(a.getAttribute("href")); });
addEventListener("popstate", route);
const initPromise = initFirebase().catch(e => { console.error(e); authReadyRes(); toast("Gagal menyambung ke Firebase. Semak config.", "bad"); });
route();
</script>
