<style>
/* ============ ASAS ============ */
:root{--red:#E10600;--red-hi:#FF4D4D;--ink:#07070A;--panel:#101015;--line:rgba(255,255,255,.12)}
*{-webkit-tap-highlight-color:transparent}

body{background:var(--ink);color:#F4F4F5;font-family:'DM Sans',system-ui,sans-serif;margin:0;min-height:100vh;overflow-x:hidden}

.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s;border:1px solid transparent;text-decoration:none}

.inp:focus{outline:none;border-color:var(--red-hi);box-shadow:0 0 0 3px rgba(255,77,77,.25)}

.lbl{display:block;font-size:13px;font-weight:600;color:#D1D5DB;margin:0 0 6px}
.hint{font-size:12.5px;color:#9CA3AF;margin-top:6px}
.err{font-size:13px;color:#FF8A8A;margin-top:6px}
.ok{font-size:13px;color:#6EE7A8;margin-top:6px}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
/* WOW 1: cahaya bergerak latar */
.aurora{position:absolute;inset:-20% -10% auto -10%;height:620px;pointer-events:none;
  background:radial-gradient(40% 50% at 30% 30%,rgba(255,42,42,.35),transparent 70%),radial-gradient(35% 45% at 75% 20%,rgba(255,255,255,.10),transparent 70%);
  filter:blur(30px);animation:drift 14s ease-in-out infinite alternate}

@keyframes sweep{0%,60%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}

/* WOW 4: reveal ketika skrol */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}

@media (prefers-reduced-motion:reduce){.aurora,.shine::after,.float{animation:none}.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}*{transition-duration:.01ms!important}}

@keyframes gfx1{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(70vw,12vh,0) scale(1.18)}}
@keyframes gfx2{0%{transform:translate3d(0,0,0) scale(1.05)}100%{transform:translate3d(-75vw,18vh,0) scale(.92)}}

.aurora{display:none}
/* ============ iPHONE ============ */
.iphone{position:relative;width:292px;height:604px;border-radius:56px;padding:10px;background:linear-gradient(145deg,#9a9aa3 0%,#2b2b31 16%,#5d5d66 50%,#26262c 84%,#8b8b94 100%);box-shadow:0 0 0 1px #0b0b0d,inset 0 0 0 2px rgba(255,255,255,.2),0 40px 90px -25px rgba(56,189,248,.4),0 30px 70px -30px rgba(225,6,0,.55)}
.iscreen{height:100%;border-radius:46px;overflow:auto;background:#000;scrollbar-width:none;position:relative;isolation:isolate}

.iisland{position:absolute;top:19px;left:50%;width:94px;height:28px;margin-left:-47px;background:#000;border-radius:20px;z-index:4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.istatus{position:absolute;top:22px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;z-index:3;font-size:13px;font-weight:700;color:#fff;pointer-events:none;mix-blend-mode:difference}

.ib1{left:-3px;top:112px;height:28px}.ib2{left:-3px;top:160px;height:50px}.ib3{left:-3px;top:222px;height:50px}.ib4{right:-3px;top:180px;height:84px}

/* ============ ANIMASI SKROL ============ */
[data-fx]{opacity:0;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){[data-fx]{opacity:1}#bgflow i{animation:none}}
/* ============ LOG MASUK: mata, animasi berjaya, goncang ============ */
.backarrow{position:fixed;top:14px;left:14px;z-index:60;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(16,16,21,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);transition:transform .35s var(--ease),border-color .25s,background .25s}

.pwwrap{position:relative}.pwwrap .inp{padding-right:52px}

.okc svg{width:104px;height:104px;filter:drop-shadow(0 0 26px rgba(52,211,153,.65))}

.okchk{stroke:#34D399;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:okdraw .45s .6s ease-out forwards}
@keyframes okdraw{to{stroke-dashoffset:0}}@keyframes okin{from{opacity:0}}@keyframes okpop{from{opacity:0;transform:scale(.7)}}

@keyframes shk{10%,90%{transform:translate3d(-2px,0,0)}20%,80%{transform:translate3d(4px,0,0)}30%,50%,70%{transform:translate3d(-8px,0,0)}40%,60%{transform:translate3d(8px,0,0)}}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}

/* ============ PROFIL: GAYA FOTO (macam Linktree Pro) ============ */
.fl-bi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}

/* ============ BAR KEMAS KINI ============ */

.fl-banner3{position:relative;width:100%;height:clamp(72px,5.73vw,110px);overflow:hidden;border-bottom:1px solid rgba(255,77,77,.28);isolation:isolate}

  radial-gradient(34% 140% at 18% 50%,rgba(255,42,42,.34),transparent 70%),radial-gradient(34% 140% at 84% 50%,rgba(56,189,248,.34),transparent 70%),
  repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.035) 46px 48px),

:root{--ease:cubic-bezier(.32,.72,0,1)}

/* ============ HALAMAN PROFIL AWAM (5 templat) ============ */
.fl-root{--bgcss:#fff;--text:#111;--btn:#111;--btnText:#fff;--r:16px;--font:'Inter';font-family:var(--font),system-ui,sans-serif;color:var(--text);background:var(--bgcss);min-height:100%;line-height:1.45}
.fl-root *{box-sizing:border-box}
.fl-wrap{max-width:480px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:12px}
.fl-avatar{width:96px;height:96px;border-radius:9999px;object-fit:cover;margin:0 auto;display:block;border:3px solid color-mix(in srgb,var(--text) 25%,transparent);background:color-mix(in srgb,var(--text) 10%,transparent)}
.fl-name{font-size:22px;font-weight:700;text-align:center;margin:10px 0 0}
.fl-bio{text-align:center;opacity:.85;font-size:15px;margin:0 8px}
.fl-banner{height:120px;border-radius:var(--r);background-size:cover;background-position:center;margin-bottom:-48px}
.fl-social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fl-social a{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);background:color-mix(in srgb,var(--text) 10%,transparent);border:1px solid color-mix(in srgb,var(--text) 18%,transparent)}
.fl-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 18px;background:var(--btn);color:var(--btnText);font-weight:600;text-decoration:none;border-radius:var(--r);transition:transform .2s,box-shadow .2s;position:relative}
.fl-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--btn)}
.fl-btn .fl-t{flex:1;text-align:center;padding-right:24px}
.fl-btn svg{flex:none}
.fl-header{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:14px 0 0;text-align:center;font-weight:700}
.fl-card{background:color-mix(in srgb,var(--text) 8%,transparent);border:1px solid color-mix(in srgb,var(--text) 16%,transparent);border-radius:var(--r);overflow:hidden;color:var(--text);text-decoration:none;display:block}
.fl-prod{display:flex;gap:12px;padding:10px;align-items:center}
.fl-prod img,.fl-prod .fl-ph{width:84px;height:84px;border-radius:calc(var(--r) * .7);object-fit:cover;flex:none;background:color-mix(in srgb,var(--text) 12%,transparent);display:flex;align-items:center;justify-content:center}
.fl-prod .fl-pi{flex:1;min-width:0}
.fl-prod b{display:block;font-weight:700}
.fl-price{font-size:18px;font-weight:700}
.fl-badge{display:inline-block;padding:2px 9px;border-radius:999px;background:#E10600;color:#fff;font-size:11.5px;font-weight:700;margin-bottom:4px}
.fl-buy{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:7px 14px;background:var(--btn);color:var(--btnText);border-radius:999px;font-weight:700;font-size:13.5px}
.fl-form{display:flex;flex-direction:column;gap:8px;padding:14px}
.fl-form input,.fl-form textarea{width:100%;padding:11px 12px;border-radius:calc(var(--r) * .7);background:color-mix(in srgb,var(--text) 8%,transparent);border:1px solid color-mix(in srgb,var(--text) 22%,transparent);color:var(--text);font:inherit;font-size:16px}
.fl-form input::placeholder,.fl-form textarea::placeholder{color:color-mix(in srgb,var(--text) 55%,transparent)}
.fl-form button{min-height:46px;border-radius:var(--r);background:var(--btn);color:var(--btnText);font-weight:700;border:0;cursor:pointer}
.fl-hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.fl-foot{text-align:center;margin-top:18px;font-size:12.5px;opacity:.75}
.fl-foot a{color:inherit;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--text) 10%,transparent);text-decoration:none}
/* grid */
.fl-tpl-grid .fl-wrap{max-width:560px}
.fl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl-grid .span2{grid-column:1/-1}
.fl-tile{display:flex;flex-direction:column;height:100%}
.fl-tile .fl-img{aspect-ratio:1/1;width:100%;object-fit:cover;background:color-mix(in srgb,var(--text) 12%,transparent);display:flex;align-items:center;justify-content:center}
.fl-tile .fl-tt{padding:10px 12px;font-weight:700;font-size:14.5px}
.fl-tile .fl-ts{padding:0 12px 12px;font-size:13px;opacity:.85}
/* gelap/kaca */
.fl-tpl-dark .fl-btn{background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);color:var(--text)}
.fl-tpl-dark .fl-btn:hover{border-color:var(--btn);box-shadow:0 0 26px -4px var(--btn)}
.fl-tpl-dark .fl-avatar{box-shadow:0 0 0 3px #0000,0 0 34px -4px var(--btn);border-color:var(--btn)}
.fl-tpl-dark .fl-card{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.fl-tpl-dark .fl-buy{box-shadow:0 0 18px -4px var(--btn)}
/* laman mini */
.fl-hero{text-align:center;padding:26px 16px;border-radius:calc(var(--r) + 6px);background:linear-gradient(160deg,color-mix(in srgb,var(--btn) 30%,transparent),color-mix(in srgb,var(--text) 6%,transparent));border:1px solid color-mix(in srgb,var(--text) 16%,transparent)}
.fl-hero h1{font-size:26px;line-height:1.2;margin:10px 0 6px;font-weight:800}
.fl-sec{font-size:15px;font-weight:800;margin:18px 0 0}
.fl-quote{padding:14px;font-size:14.5px}
.fl-quote small{display:block;margin-top:6px;opacity:.75;font-weight:700}
/* auto cerah/gelap peranti */
@media (prefers-color-scheme:dark){
  .fl-auto.fl-tpl-minimal,.fl-auto.fl-tpl-grid,.fl-auto.fl-tpl-store{--bgcss:#0B0B0F!important;--text:#F4F4F5!important;--btn:#F4F4F5!important;--btnText:#0B0B0F!important}
}
.pv-wrap .fl-wrap{padding-top:22px}
</style>

function compressImage(file, w, h, q = .82) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error("Fail mesti gambar."));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); const r = Math.max(w / im.width, h / im.height), dw = im.width * r, dh = im.height * r; x.drawImage(im, (w - dw) / 2, (h - dh) * (h > w ? .3 : .5), dw, dh); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Gambar tidak boleh dibaca.")); };
    im.src = url;

}

let FB = null, auth = null, db = null, rtdb = null;
let authReadyRes; const authReady = new Promise(r => (authReadyRes = r));
const S = { user: null, profile: null, links: [], tab: "links", view: "home", events: null, leads: null, range: 7, loadingProfile: false, celebrate: false };

async function initFirebase() {
  if (!CONFIGURED) { authReadyRes(); return; }
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [app, a, f, r] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js"),
    HAS_RTDB ? import(base + "firebase-database.js") : Promise.resolve(null),
  ]);
  const inst = app.initializeApp(FIREBASE_CONFIG, "flashlink"); // nama app berasingan
  FB = { ...a, ...f, rt: r };
  auth = a.getAuth(inst); db = f.getFirestore(inst);
  if (r) rtdb = r.getDatabase(inst);
  a.onAuthStateChanged(auth, onAuthChange);
}
const hasPassword = u => !!u && (u.providerData || []).some(p => p.providerId === "password");
async function onAuthChange(u) {
  S.user = u; S.profile = null; S.links = []; S.needPw = !!u && !hasPassword(u);
  if (u && !S.needPw) await loadProfile();
  authReadyRes(); if (!S.holdRoute) route(true);
}
async function loadProfile() {
  if (!S.user) return;
  S.loadingProfile = true;
  try {
    const s = await FB.getDoc(FB.doc(db, "flashlink_users", S.user.uid));
    S.profile = s.exists() ? normProfile(s.data()) : null;
    if (S.profile) await loadLinks();
  } catch (e) { console.error(e); toast("Tak dapat muat profil. Semak sambungan anda.", "bad"); }
  S.loadingProfile = false;
}
function normProfile(p) {
  const tpl = TPL[p.template] ? p.template : "minimal";
  return { username: "", displayName: "", bio: "", avatarUrl: "", bannerUrl: "", socialIcons: [], testimonials: [], profileStyle: "classic", plan: "free", ...p, template: tpl, theme: { ...TPL[tpl].theme, auto: false, ...(p.theme || {}) } };
}
async function loadLinks(uid = S.user.uid) {
  const q = FB.query(FB.collection(db, "flashlink_links"), FB.where("uid", "==", uid));
  const s = await FB.getDocs(q);
  const arr = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (uid === S.user?.uid) S.links = arr;
  return arr;
}

function track(uid, linkId, type) {

function bindPublicEvents(root, uid) {
  root.addEventListener("click", e => {
    const a = e.target.closest("a[data-link]"); if (!a) return;
    const id = a.dataset.link; if (!db || id.startsWith("demo")) return;
    track(uid, id, "click");
    FB.updateDoc(FB.doc(db, "flashlink_links", id), { clicks: FB.increment(1) }).catch(() => {});
  });

    const f = e.target.closest("form[data-lead]"); if (!f) return;
    e.preventDefault();
    const msg = $(".fl-msg", f), v = n => f.elements[n].value.trim();
    if (v("website")) return; // honeypot
    if (!v("name") || !/^\S+@\S+\.\S+$/.test(v("email"))) { msg.textContent = "Sila isi nama dan e-mel yang sah."; return; }
    let hist = []; try { hist = JSON.parse(localStorage.getItem("fl_leads") || "[]").filter(t => Date.now() - t < 3600e3); } catch {}
    if (hist.length >= 3) { msg.textContent = "Terlalu banyak hantaran. Cuba lagi sejam lagi."; return; }
    if (!db || f.dataset.lead.startsWith("demo")) { msg.textContent = "Mod demo: borang tidak dihantar."; return; }
    const btn = $("button", f); btn.disabled = true;
    try {
      await FB.addDoc(FB.collection(db, "flashlink_leads"), { uid, name: v("name"), email: v("email"), phone: v("phone"), message: v("message"), createdAt: FB.serverTimestamp() });
      hist.push(Date.now()); try { localStorage.setItem("fl_leads", JSON.stringify(hist)); } catch {}
      msg.textContent = "Terima kasih! Mesej anda telah dihantar ✓"; f.reset();
    } catch { msg.textContent = "Maaf, gagal menghantar. Cuba lagi."; }
    btn.disabled = false;
  });
}

/* ---------- Statistik masa nyata (RTDB: flashlink/stats) + footer ----------
   Setiap lawatan (sekali setiap sesi pelayar) menaikkan TIGA kaunter serentak: hari, bulan, keseluruhan.
   - Harian: kunci tarikh waktu Malaysia (UTC+8) => "reset" automatik tepat 12 malam.
   - Bulanan: kunci bulan => jumlah semua hari dalam bulan itu, "reset" automatik pada awal bulan.
   - Keseluruhan: jumlah semua bulan. Tiada kerja berjadual / Cloud Functions diperlukan (kekal Spark). */
const mytKeys = () => { const t = new Date(Date.now() + 8 * 36e5).toISOString(); return { d: t.slice(0, 10), m: t.slice(0, 7) }; };
const msToMidnight = () => 864e5 - ((Date.now() + 8 * 36e5) % 864e5) + 300;
const fmtN = n => (Number(n) || 0).toLocaleString("ms-MY");

let statOff = [], statTimer = 0;
const bump = path => FB.rt.runTransaction(FB.rt.ref(rtdb, path), v => (v || 0) + 1).catch(() => {});

  await initPromise; if (!rtdb) return;
  try { if (sessionStorage.getItem("fl_vis")) return; sessionStorage.setItem("fl_vis", "1"); } catch {}

  bump("flashlink/stats/total"); bump(`flashlink/stats/monthly/${k.m}`); bump(`flashlink/stats/daily/${k.d}`);
}

  return `<footer class="container" style="padding:28px 16px 44px;text-align:center;border-top:1px solid var(--line);margin-top:8px">

function fillStat() {
  statOff.forEach(f => { try { f(); } catch {} }); statOff = []; clearTimeout(statTimer);
  if (!$("#ustat")) return;
  initPromise.then(() => {
    if (!rtdb || !$("#ustat")) return;
    const R = FB.rt, k = mytKeys();
    const put = (id, v) => { const n = Number(v) || 0; statCache[id] = n; const el = $("#" + id); if (el) el.textContent = fmtN(n); try { localStorage.setItem("fl_stats", JSON.stringify(statCache)); } catch {} };
    const sub = (id, path) => statOff.push(R.onValue(R.ref(rtdb, path), s => put(id, s.val()), () => {}));

    sub("s_month", `flashlink/stats/monthly/${k.m}`); sub("s_day", `flashlink/stats/daily/${k.d}`);

}

    const r = await fetch("https://api.microlink.io/?url=" + encodeURIComponent(url), { signal: ctl.signal }); clearTimeout(to);
    const j = await r.json(); if (j.status === "success") return { image: j.data?.image?.url || "", title: j.data?.title || "" };
  } catch {}
  return {};
}

  } catch (e) { console.error(e); return (pane.innerHTML = `<div class="glass" style="border-radius:18px;padding:24px;text-align:center">Tak dapat muat statistik. Semak sambungan & Firestore rules.</div>`); }
  const draw = () => {
    const days = S.range, since = Date.now() - days * 864e5, ev = S.events.filter(e => e.t.getTime() >= since);
    const views = ev.filter(e => e.type === "view").length, clicks = ev.filter(e => e.type === "click").length, ctr = views ? Math.round(clicks / views * 100) : 0;
    const byDay = Array.from({ length: days }, (_, i) => { const d = new Date(Date.now() - (days - 1 - i) * 864e5); d.setHours(0, 0, 0, 0); return { d, v: 0, c: 0 }; });
    ev.forEach(e => { const i = byDay.findIndex(x => e.t >= x.d && e.t < new Date(x.d.getTime() + 864e5)); if (i >= 0) e.type === "view" ? byDay[i].v++ : byDay[i].c++; });
    const max = Math.max(1, ...byDay.map(x => x.v));
    const per = S.links.filter(l => l.type !== "header").map(l => ({ l, n: ev.filter(e => e.type === "click" && e.linkId === l.id).length })).sort((a, b) => b.n - a.n);
    const pm = Math.max(1, ...per.map(x => x.n));
    $("#st").innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${[["Lawatan", views], ["Klik", clicks], ["Kadar klik", ctr + "%"]].map(([n, v]) => `<div class="glass" style="border-radius:16px;padding:14px;text-align:center"><div class="font-display" style="font-size:28px;font-weight:700">${v}</div><div style="color:#9CA3AF;font-size:13px">${n}</div></div>`).join("")}</div>
    ${HAS_RTDB ? `<div class="glass" style="border-radius:16px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:center">${ic("users", "w-5 h-5")}<span>Pelawat aktif sekarang: <b id="live">0</b></span></div>` : ""}
    <div class="glass" style="border-radius:18px;padding:16px;margin-top:12px"><div class="lbl">Lawatan harian</div>${views || clicks ? `<div style="display:flex;align-items:flex-end;gap:${days > 7 ? 2 : 8}px;height:120px" role="img" aria-label="Carta lawatan harian">${byDay.map(x => `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="${x.d.toLocaleDateString("ms-MY")}: ${x.v} lawatan"><div class="bar" style="height:${x.v / max * 100}%"></div></div>`).join("")}</div>` : `<p style="color:#9CA3AF;margin:8px 0 0">Belum ada lawatan. Kongsi pautan anda untuk mula!</p>`}</div>
    <div class="glass" style="border-radius:18px;padding:16px;margin-top:12px"><div class="lbl">Klik setiap pautan</div>${per.length ? per.map(x => `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px">${esc(x.l.title)}</span><b>${x.n}</b></div><div style="height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden"><div style="height:100%;width:${x.n / pm * 100}%;background:linear-gradient(90deg,#B80000,#FF4D4D)"></div></div></div>`).join("") : `<p style="color:#9CA3AF;margin:0">Tiada pautan lagi.</p>`}</div>
    <div id="leadsblk" class="glass" style="border-radius:18px;padding:16px;margin-top:12px"><div class="lbl">Pelanggan daripada borang (${S.leads.length})</div>${S.leads.length ? S.leads.slice(0, 20).map(x => `<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${esc(x.name)}</b> · <a href="mailto:${esc(x.email)}" style="color:#FF8A8A">${esc(x.email)}</a>${x.phone ? ` · ${esc(x.phone)}` : ""}<div style="color:#C7C9D1;font-size:14px">${esc(x.message || "")}</div><small style="color:#9CA3AF">${x.t.toLocaleString("ms-MY")}</small></div>`).join("") : `<p style="color:#9CA3AF;margin:0">Belum ada. Tambah blok “Borang e-mel” untuk kumpul pelanggan.</p>`}</div>`;
    if (part === "leads") { $$("#st > :not(#leadsblk)").forEach(x => x.remove()); const lb = $("#leadsblk"); if (lb) lb.style.marginTop = "0"; } else if ($("#leadsblk")) $("#leadsblk").remove();
    $$("[data-r]").forEach(b => b.setAttribute("aria-pressed", b.dataset.r == S.range));
  };
  pane.innerHTML = `<div id="rangerow" style="display:flex;gap:8px;margin-bottom:12px">${[7, 30].map(n => `<button class="chip" data-r="${n}" aria-pressed="${S.range === n}">${n} hari</button>`).join("")}<button class="chip" id="rf" style="margin-left:auto">Muat semula</button></div><div id="st"></div>`;
  $$("[data-r]").forEach(b => (b.onclick = () => { S.range = +b.dataset.r; draw(); }));
  $("#rf").onclick = () => { S.events = null; statsTab(part); };
  draw(); if (part === "leads") $("#rangerow").remove(); stagger("#st > *", 0, 60);
  if (HAS_RTDB && $("#live")) { try { FB.rt.onValue(FB.rt.ref(rtdb, `flashlink/live/${S.user.uid}`), s => { const el = $("#live"); if (el) el.textContent = s.val() || 0; }); } catch {} }
}

/* ---------- Kesan bunyi gaya gaming (laman utama & log masuk; tiada muzik) ----------
   Semua dijana dengan Web Audio (tiada fail audio, tiada hak cipta). Volum sengaja rendah.
   Pelayar hanya benarkan bunyi selepas pelawat menyentuh skrin. */
const SFX = {
  ctx: null, master: null, mus: null, scope: false, last: null, lastPop: 0,
  muted: false,
  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .55; this.master.connect(this.ctx.destination); } catch { return false; }
    return true;
  },
  tone(type, f1, f2, dur, vol, delay = 0) {
    if (!this.scope || this.muted || !this.ctx || this.ctx.state !== "running") return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .02);
  },
  hover() { this.tone("triangle", 1500, 1900, .045, .03); },
  click() { this.tone("square", 520, 880, .07, .028); this.tone("triangle", 880, 1320, .09, .03, .05); },
  power() { [523, 659, 784, 1047].forEach((f, i) => this.tone("square", f, f * 1.01, .1, .024, i * .07)); },
  success() { [659, 784, 988, 1319].forEach((f, i) => this.tone("triangle", f, f * 1.005, .16, .045, i * .085)); this.tone("sine", 2637, 2637, .3, .014, .3); },
  error() { this.tone("sawtooth", 190, 120, .2, .04); this.tone("sawtooth", 150, 90, .26, .04, .2); },
  type() { this.tone("sine", 700, 600, .03, .02); },
  pop() { const n = performance.now(); if (n - this.lastPop < 110) return; this.lastPop = n; this.tone("sine", 320, 980, .09, .05); this.tone("triangle", 1250, 1650, .05, .018, .05); },
};
function sfxUnlock() {
  if (!SFX.scope || !SFX.init()) return Promise.resolve(false);
  return SFX.ctx.resume().then(() => SFX.ctx.state === "running", () => false);
}
function sfxScope(on) { SFX.scope = on; if (on) sfxUnlock(); }
const SFX_SEL = "a.btn,button.btn,a[data-nav],.chip,.ptile,.dcard";
["pointerdown", "touchend", "keydown", "click"].forEach(ev => addEventListener(ev, e => {
  if (!SFX.scope) return;
  sfxUnlock().then(ok => {
    if (!ok) return;
    if (ev === "pointerdown") { const t = e.target.closest?.(SFX_SEL); if (t) /Cipta Flash Link|Mula sekarang|Tambah/.test(t.textContent) ? SFX.power() : SFX.click(); }
    else if (ev === "keydown" && e.key.length === 1) SFX.type();
  });
}, { passive: true }));
document.addEventListener("pointerover", e => { if (!SFX.scope || e.pointerType === "touch") return; const t = e.target.closest(SFX_SEL); if (!t || t === SFX.last) return; SFX.last = t; SFX.hover(); }, { passive: true });
document.addEventListener("pointerout", e => { if (SFX.last && !SFX.last.contains(e.relatedTarget)) SFX.last = null; }, { passive: true });
document.addEventListener("visibilitychange", () => { if (!SFX.ctx || !SFX.scope) return; document.hidden ? SFX.ctx.suspend() : SFX.ctx.resume(); });

/* ---------- Kemas kini automatik: semak versi baharu, butang untuk muat semula ---------- */
const APP_VERSION = "V-29";
const CENTRAL = "https://genius-digital-flashlink-40bc9-5effc.web.app", ZIP_URL = "https://github.com/GeniusDigitalDeveloper/website-claude-code/releases/download/flashlink-latest/Flash-Link-Web.zip";
const IS_CENTRAL = ["genius-digital-flashlink-40bc9-5effc.web.app", "localhost", "127.0.0.1"].includes(location.hostname);
async function fetchLatest() { const r = await fetch((IS_CENTRAL ? "" : CENTRAL) + "/version.json?t=" + Date.now(), { cache: "no-store" }); return r.json(); }
function hardReload() { try { navigator.serviceWorker?.getRegistrations?.().then(rs => rs.forEach(r => r.unregister())); } catch {} location.reload(); }
/* Butang Kemas kini (kuning): hanya wujud bila ada versi baharu; hilang selepas dikemas kini. Diletak di kanan "Mula sekarang". */
const verNum = v => parseInt(String(v || "").replace(/\D/g, ""), 10) || 0;
const isNewer = v => verNum(v) > verNum(APP_VERSION);
let UPD = null;
function setUpdate(j) { UPD = j; renderUpdateBtn(); }
function renderUpdateBtn() {
  $("#updbtn")?.remove(); $("#updfix")?.remove();
  if (!UPD || !document.body.classList.contains("flow")) return;
  const b = document.createElement("button"); b.id = "updbtn"; b.type = "button"; b.className = "btn btn-yellow btn-sm";
  b.title = UPD.notes || ("Versi " + UPD.version); b.setAttribute("aria-label", "Kemas kini ke versi " + UPD.version);
  b.innerHTML = `${ic("refresh", "w-4 h-4")}<span class="hidden sm:inline">Kemas kini</span>`;
  b.onclick = () => (IS_CENTRAL ? hardReload() : window.open(ZIP_URL, "_blank", "noopener"));
  const host = $("header nav") || $("#dhead-actions");
  if (host) host.appendChild(b); else { const d = document.createElement("div"); d.id = "updfix"; d.appendChild(b); document.body.appendChild(d); }
}
let LATEST = { version: "", notes: "" };
function announceCheck() {
  if (!LATEST.version) return;
  if (isNewer(LATEST.version)) setUpdate({ ...LATEST }); else if (UPD) setUpdate(null);
}
function watchVersion() {
  if (!rtdb) return; const R = FB.rt;
  try {
    R.onValue(R.ref(rtdb, "flashlink/stats/versionNotes"), s => { LATEST.notes = s.val() || ""; if (UPD) { UPD.notes = LATEST.notes; $("#updbtn") && ($("#updbtn").title = LATEST.notes); } }, () => {});
    R.onValue(R.ref(rtdb, "flashlink/stats/version"), s => { LATEST.version = s.val() || ""; announceCheck(); }, () => {}); // masa nyata
  } catch {}
}
let lastUpd = 0;
async function checkUpdate(force) {
  if (!document.body.classList.contains("flow")) return;
  if (!force && Date.now() - lastUpd < 20000) return; lastUpd = Date.now();
  try { const j = await fetchLatest(); if (j.version && isNewer(j.version)) setUpdate(j); } catch {}
}
setInterval(() => checkUpdate(true), 45000); document.addEventListener("visibilitychange", () => !document.hidden && checkUpdate(true)); addEventListener("focus", () => checkUpdate());
new MutationObserver(() => renderUpdateBtn()).observe($("#app"), { childList: true });

/* ---------- Router ---------- *//* ---------- Router ---------- */
function nav(path, replace) { replace ? history.replaceState({}, "", path) : history.pushState({}, "", path); route(true); window.scrollTo(0, 0); }
function route() {
  document.documentElement.style.background = ""; sfxScope(false); setTimeout(() => checkUpdate(), 1200);
  const p = location.pathname.replace(/\/+$/, "") || "/", seg = p.split("/").filter(Boolean);
  document.body.classList.toggle("flow", !(seg.length === 1 && USER_RE.test(seg[0]) && !RESERVED.has(seg[0])));
  if (p === "/" || p === "/index.html") return landing();
  if (p === "/login") return loginView();
  if (p === "/dashboard") return dashView();
  if (seg.length === 1 && USER_RE.test(seg[0]) && !RESERVED.has(seg[0])) return publicView(seg[0]);
  notFound();
}
document.addEventListener("click", e => { const a = e.target.closest("a[data-nav]"); if (!a || e.metaKey || e.ctrlKey) return; e.preventDefault(); nav(a.getAttribute("href")); });
addEventListener("popstate", route);
const initPromise = initFirebase().catch(e => { console.error(e); authReadyRes(); toast("Gagal menyambung ke Firebase. Semak config.", "bad"); });
initPromise.then(() => { countVisit(); checkUpdate(); watchVersion(); });
route();
