  colors: { ink:'#07070A', panel:'#101015', flash:'#E10600', flashhi:'#FF4D4D', silver:'#E5E7EB' } } } };
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

<style>
/* ============ ASAS ============ */
:root{--red:#E10600;--red-hi:#FF4D4D;--ink:#07070A;--panel:#101015;--line:rgba(255,255,255,.12)}
*{-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--ink);color:#F4F4F5;font-family:'DM Sans',system-ui,sans-serif;margin:0;min-height:100vh;overflow-x:hidden}
a,button,[role=button],label.chip{cursor:pointer}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:3px;border-radius:8px}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;font-weight:700;transition:transform .2s,box-shadow .2s,background .2s;border:1px solid transparent;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-red{background:linear-gradient(135deg,#FF2A2A,#B80000);color:#fff;box-shadow:0 8px 30px -8px rgba(225,6,0,.7)}
.btn-red:hover{box-shadow:0 10px 40px -6px rgba(255,42,42,.9)}
.btn-ghost{background:rgba(255,255,255,.06);border-color:var(--line);color:#F4F4F5}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.inp{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff;font-size:16px}
.inp::placeholder{color:#9CA3AF}
.inp:focus{outline:none;border-color:var(--red-hi);box-shadow:0 0 0 3px rgba(255,77,77,.25)}
select.inp option{color:#111}
.lbl{display:block;font-size:13px;font-weight:600;color:#D1D5DB;margin:0 0 6px}
.hint{font-size:12.5px;color:#9CA3AF;margin-top:6px}
.err{font-size:13px;color:#FF8A8A;margin-top:6px}
.ok{font-size:13px;color:#6EE7A8;margin-top:6px}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
/* WOW 1: cahaya bergerak latar */
.aurora{position:absolute;inset:-20% -10% auto -10%;height:620px;pointer-events:none;
  background:radial-gradient(40% 50% at 30% 30%,rgba(255,42,42,.35),transparent 70%),radial-gradient(35% 45% at 75% 20%,rgba(255,255,255,.10),transparent 70%);
  filter:blur(30px);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,6%,0) scale(1.08)}}
/* WOW 2: kilat menyapu */
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;transform:translateX(-120%) skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%,60%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
/* WOW 3: telefon terapung */
.float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-12px)}}
/* WOW 4: reveal ketika skrol */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.aurora,.shine::after,.float{animation:none}.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}*{transition-duration:.01ms!important}}
.logo-glow{filter:drop-shadow(0 0 28px rgba(255,42,42,.55))}
.gradtxt{background:linear-gradient(90deg,#fff,#FF6B6B 60%,#E10600);-webkit-background-clip:text;background-clip:text;color:transparent}
.phone{width:290px;height:580px;border-radius:42px;padding:10px;background:linear-gradient(160deg,#2a2a32,#0c0c10);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 80px -20px rgba(225,6,0,.55)}
.phone>.screen{height:100%;border-radius:32px;overflow:auto;scrollbar-width:none}
.phone>.screen::-webkit-scrollbar{display:none}
.tabbtn{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:#9CA3AF;border-bottom:3px solid transparent}
.tabbtn[aria-selected=true]{color:#fff;border-color:var(--red-hi)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:600;color:#F4F4F5;transition:background .2s,border-color .2s}
.chip:hover,.chip[aria-pressed=true]{background:rgba(255,42,42,.18);border-color:var(--red-hi)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;max-width:92vw;padding:12px 18px;border-radius:12px;background:#1b1b22;border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.6);font-weight:600}
.toast.bad{border-color:#FF4D4D}.toast.good{border-color:#34D399}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal-bg{align-items:center;padding:16px}}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#12121a;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px}
@media(min-width:640px){.modal{border-radius:20px}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--red-hi);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toggle{position:relative;width:46px;height:28px;border-radius:999px;background:#3a3a44;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked=true]{background:#E10600}.toggle[aria-checked=true]::after{transform:translateX(18px)}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px}
.sortable-ghost{opacity:.35}
.bar{background:linear-gradient(180deg,#FF4D4D,#B80000);border-radius:6px 6px 0 0;min-height:2px}

/* ============ LATAR GRADIEN MERAH + BIRU CERAH (bergerak kiri-kanan) ============ */
#bgflow{position:fixed;inset:0;z-index:-1;overflow:hidden;display:none;pointer-events:none;background:#05060B}
body.flow #bgflow{display:block}
#bgflow i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform;opacity:.62}
#bgflow .g1{width:60vmax;height:60vmax;left:-20vmax;top:-26vmax;background:radial-gradient(circle,#FF2A2A 0%,rgba(255,42,42,0) 66%);animation:gfx1 24s ease-in-out infinite alternate}
#bgflow .g2{width:62vmax;height:62vmax;right:-22vmax;top:-10vmax;background:radial-gradient(circle,#38BDF8 0%,rgba(37,99,235,.5) 38%,rgba(37,99,235,0) 68%);animation:gfx2 28s ease-in-out infinite alternate}
#bgflow .g3{width:56vmax;height:56vmax;left:18vw;bottom:-30vmax;background:radial-gradient(circle,#4FC3F7 0%,rgba(79,195,247,0) 66%);animation:gfx3 32s ease-in-out infinite alternate;opacity:.42}
@keyframes gfx1{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(70vw,12vh,0) scale(1.18)}}
@keyframes gfx2{0%{transform:translate3d(0,0,0) scale(1.05)}100%{transform:translate3d(-75vw,18vh,0) scale(.92)}}
@keyframes gfx3{0%{transform:translate3d(-30vw,0,0)}100%{transform:translate3d(46vw,-8vh,0) scale(1.15)}}
.aurora{display:none}
/* ============ iPHONE ============ */
.iphone{position:relative;width:292px;height:604px;border-radius:56px;padding:10px;background:linear-gradient(145deg,#9a9aa3 0%,#2b2b31 16%,#5d5d66 50%,#26262c 84%,#8b8b94 100%);box-shadow:0 0 0 1px #0b0b0d,inset 0 0 0 2px rgba(255,255,255,.2),0 40px 90px -25px rgba(56,189,248,.4),0 30px 70px -30px rgba(225,6,0,.55)}
.iscreen{height:100%;border-radius:46px;overflow:auto;background:#000;scrollbar-width:none;position:relative;isolation:isolate}
.iscreen::-webkit-scrollbar{display:none}
.iisland{position:absolute;top:19px;left:50%;width:94px;height:28px;margin-left:-47px;background:#000;border-radius:20px;z-index:4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.istatus{position:absolute;top:22px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;z-index:3;font-size:13px;font-weight:700;color:#fff;pointer-events:none;mix-blend-mode:difference}
.ihome{position:absolute;bottom:18px;left:50%;width:104px;height:4px;margin-left:-52px;border-radius:9px;background:#fff;mix-blend-mode:difference;z-index:3;opacity:.85}
.ib{position:absolute;width:3.5px;background:linear-gradient(#a0a0a8,#4a4a52);border-radius:2px}
.ib1{left:-3px;top:112px;height:28px}.ib2{left:-3px;top:160px;height:50px}.ib3{left:-3px;top:222px;height:50px}.ib4{right:-3px;top:180px;height:84px}
.iscreen.pv-wrap .fl-wrap{padding-top:54px}
.iscreen.pv-wrap .fl-sty-hero .fl-wrap{padding-top:0}
/* ============ ANIMASI SKROL ============ */
[data-fx]{opacity:0;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){[data-fx]{opacity:1}#bgflow i{animation:none}}
/* ============ GAYA PROFIL BAHARU ============ */
.fl-bn{height:150px;margin:0 -16px;background-size:cover;background-position:center;border-radius:0 0 var(--r) var(--r);position:relative;display:grid;place-items:center}
.fl-bn.empty{background:linear-gradient(135deg,color-mix(in srgb,var(--btn) 60%,#000),color-mix(in srgb,var(--text) 14%,transparent))}
.fl-bn span{color:rgba(255,255,255,.65);font-size:13px}
.fl-bnav{margin-top:-52px;position:relative;z-index:1}
.fl-sidehead{display:flex;gap:16px;align-items:center;text-align:left}
.fl-sidehead .fl-avatar{margin:0;flex:none;width:92px;height:92px}
.fl-side-t{min-width:0;flex:1}.fl-side-t .fl-name,.fl-side-t .fl-bio{text-align:left;margin-left:0;margin-right:0}.fl-side-t .fl-social{justify-content:flex-start}
.fl-glasshead{padding:22px 18px;border-radius:calc(var(--r) + 10px);background:color-mix(in srgb,var(--text) 9%,transparent);border:1px solid color-mix(in srgb,var(--text) 20%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:8px}
.fl-ringhead{display:flex;justify-content:center;padding:10px 0 4px}
.fl-ringwrap{position:relative;display:block;padding:5px;border-radius:50%;background:conic-gradient(from 0deg,var(--btn),#38BDF8,var(--btn),#FF4D4D,var(--btn));animation:ringspin 6s linear infinite}
.fl-ringwrap .fl-avatar{width:132px;height:132px;margin:0;border:4px solid var(--ovc,#000)}
@keyframes ringspin{to{transform:rotate(360deg)}}
.fl-ringwrap .fl-avatar{animation:ringspin 6s linear infinite reverse}
@media (prefers-reduced-motion:reduce){.fl-ringwrap,.fl-ringwrap .fl-avatar{animation:none}}
/* ============ ALAT POTONG GAMBAR + MEDAN GAMBAR + MODAL SISI ============ */
.crf{position:relative;width:100%;max-height:52vh;overflow:hidden;border-radius:14px;background:#000;touch-action:none;cursor:grab;border:1px solid var(--line)}
.crf.grab{cursor:grabbing}.crf img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none}
.crmodal{max-width:480px}
.imgf{display:flex;gap:14px;align-items:center;margin-top:12px}
.imgf-p{width:84px;height:84px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none;border:1px solid var(--line);color:#9CA3AF}
.imgf-p.round{border-radius:50%}.imgf-p.wide{width:132px;height:58px;border-radius:12px}
.imgf-p img{width:100%;height:100%;object-fit:cover}
@media(min-width:1360px){
  .modal-bg.side{pointer-events:none;background:transparent;align-items:stretch;justify-content:flex-start;padding:12px}
  .modal-bg.side .modal{pointer-events:auto;max-width:560px;max-height:none;height:calc(100vh - 24px);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.65)}
}
.modal.wide{max-width:620px}
.edsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.edsec h3{margin:0 0 6px;font-size:15px;font-weight:700}
/* ============ POSTER HERO (hero penuh + kad berbingkai) ============ */
.fl-tpl-poster .fl-wrap,.fl-pwrap{max-width:520px;padding:0;gap:0}
.fl-phero{position:relative;aspect-ratio:4/5;max-height:640px;display:flex;align-items:flex-end}
.fl-phero-media{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 62%,transparent 100%)}
.fl-phero-bg{position:absolute;inset:-4% 0 0;background-size:cover;background-position:center top;will-change:transform}
.fl-phero.noimg .fl-phero-media{background:linear-gradient(160deg,color-mix(in srgb,var(--btn) 55%,#000),#08060a)}
.fl-phero-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22) 0%,transparent 26%,transparent 44%,rgba(0,0,0,.62) 100%)}
.fl-pbtn{position:absolute;top:14px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;background:rgba(10,10,14,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);z-index:3;text-decoration:none;transition:transform .4s cubic-bezier(.32,.72,0,1),background .3s}
.fl-pbtn:hover{background:rgba(10,10,14,.75)}.fl-pbtn:active{transform:scale(.9)}.fl-pbtn-l{left:14px}.fl-pbtn-r{right:14px}
.fl-phero-txt{position:relative;width:100%;padding:0 18px 4px;text-align:center;z-index:2}
.fl-ptitle-main{margin:0;font-size:clamp(34px,11vw,56px);line-height:1.02;font-weight:800;text-transform:uppercase;letter-spacing:.01em;background:linear-gradient(180deg,color-mix(in srgb,var(--btn) 35%,#fff) 0%,var(--btn) 52%,color-mix(in srgb,var(--btn) 65%,#3a2200) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 14px rgba(0,0,0,.55))}
.fl-pbio{margin:12px 4px 0;font-size:17px;font-weight:600;line-height:1.45;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.fl-pbody{padding:8px 16px 34px;display:flex;flex-direction:column;gap:14px}
.fl-pbar,.fl-pfeat{position:relative;border:2px solid var(--btn);border-radius:18px;background:rgba(0,0,0,.5);box-shadow:4px 5px 0 -1px color-mix(in srgb,var(--btn) 50%,#000),inset 0 0 20px color-mix(in srgb,var(--btn) 14%,transparent);transition:transform .55s cubic-bezier(.32,.72,0,1),box-shadow .55s cubic-bezier(.32,.72,0,1)}
.fl-pbar:hover,.fl-pfeat:hover{transform:translate3d(0,-3px,0)}.fl-pbar:active,.fl-pfeat:active{transform:scale(.98)}
.fl-pb-a,.fl-pf-a{color:var(--btn);text-decoration:none}
.fl-pb-a{display:flex;align-items:center;gap:14px;padding:10px 54px 10px 10px;min-height:calc(76px * var(--sz,1))}
.fl-pth{width:56px;height:56px;border-radius:10px;flex:none;border:1px solid color-mix(in srgb,var(--btn) 60%,transparent);display:grid;place-items:center;overflow:hidden}
.fl-pt{flex:1;text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:calc(15.5px * var(--fs,1));line-height:1.3}
.fl-pmore{position:absolute;right:6px;top:50%;margin-top:-22px;width:44px;height:44px;display:grid;place-items:center;color:var(--btn);opacity:.85;border-radius:12px;transition:opacity .2s,transform .3s}
.fl-pmore:hover{opacity:1}.fl-pmore:active{transform:scale(.85)}
.fl-pfeat .fl-pmore{top:auto;bottom:6px;margin-top:0}
.fl-pf-a{display:block;padding:10px 10px 4px}
.fl-pimg2{aspect-ratio:1.9/1;border-radius:12px;width:100%}
.fl-pcap{display:flex;align-items:center;justify-content:center;padding:12px 46px 8px;min-height:52px}
.fl-pjoin{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:999px;background:#fff;color:#111;font-weight:700;text-decoration:none;margin-top:10px;transition:transform .45s cubic-bezier(.32,.72,0,1)}
.fl-pjoin:active{transform:scale(.96)}
.fl-ptitle-main.fl-phold{background:none;color:#fff;-webkit-text-fill-color:#fff;opacity:.4;font-size:clamp(26px,8vw,40px);filter:none}
.fl-name.fl-phold{opacity:.45;font-weight:600}
.fl-hint-img{position:absolute;left:16px;right:16px;top:34%;text-align:center;color:rgba(255,255,255,.55);font-size:14px;z-index:2}
.fl-pmeta{text-align:center;font-size:12px;color:rgba(255,255,255,.7)}
.fl-tpl-poster .fl-social{margin:8px 0}.fl-tpl-poster .fl-social a{background:none;border:0;color:#fff;width:50px;height:50px}.fl-tpl-poster .fl-social svg{width:30px;height:30px}
.fl-tpl-poster .fl-header{color:var(--btn)}
.iscreen.pv-wrap .fl-tpl-poster .fl-wrap{padding-top:0}
.iscreen.pv-wrap .fl-pbtn{top:52px}
/* ============ HELAIAN KONGSI ============ */
.modal.light{background:#fff;color:#111;border-color:rgba(0,0,0,.08)}
.modal.light .btn-ghost{color:#111;background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.1)}
.sh-head{text-align:center;font-size:17px;margin:-34px 0 14px}
.sh-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px;border-radius:18px;background:#F3F4F6;margin-bottom:16px;text-align:center}
.sh-card small{color:#6B7280;word-break:break-all}.sh-card b{font-size:17px}
.sh-av{width:84px;height:84px;border-radius:20px;object-fit:cover}.sh-ini{display:grid;place-items:center;background:linear-gradient(135deg,#FF2A2A,#9B0000);color:#fff;font-size:34px;font-weight:800}
.sh-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:18px}
.sh-i{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#111;text-decoration:none;text-align:center}
.sh-i{font-size:11px;line-height:1.2}.sh-i span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.sh-join{border-top:1px solid #E5E7EB;padding-top:14px}.sh-join p{color:#6B7280;margin:4px 0 12px;font-size:14px}
.sh-b1,.sh-b2{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:999px;font-weight:700;text-decoration:none}
.sh-b1{background:#111;color:#fff}.sh-b2{background:#F3F4F6;color:#111}
/* ============ DASHBOARD BAHARU ============ */
.dtop{position:sticky;top:0;z-index:30;background:rgba(7,7,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.dtop-in{max-width:1500px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dlogo img{height:38px;width:auto}
.dtop-act{display:flex;gap:8px;align-items:center}
.dsh{max-width:1500px;margin:0 auto;padding:18px 16px 120px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.dmain{min-width:0}
.dnav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:space-around;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(10,11,18,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}

function socialHref(type, v) {
  v = String(v || "").trim(); if (!v) return "";

}
function compressImage(file, w, h, q = .82) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error("Fail mesti gambar."));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); const r = Math.max(w / im.width, h / im.height), dw = im.width * r, dh = im.height * r; x.drawImage(im, (w - dw) / 2, (h - dh) * (h > w ? .3 : .5), dw, dh); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Gambar tidak boleh dibaca.")); };
    im.src = url;
  });
}

/* ---------- Statistik masa nyata (RTDB: flashlink/stats) + footer ----------
   Setiap lawatan (sekali setiap sesi pelayar) menaikkan TIGA kaunter serentak: hari, bulan, keseluruhan.
   - Harian: kunci tarikh waktu Malaysia (UTC+8) => "reset" automatik tepat 12 malam.
   - Bulanan: kunci bulan => jumlah semua hari dalam bulan itu, "reset" automatik pada awal bulan.

let statOff = [], statTimer = 0;

    pop: [{ opacity: 0, transform: "translate3d(0,30px,0) scale(.8)" }, { opacity: 1, transform: "translate3d(0,-5px,0) scale(1.035)", offset: .68 }, { opacity: 1, transform: "none" }],

    right: [{ opacity: 0, transform: "translate3d(64px,0,0) scale(.96)" }, { opacity: 1, transform: "none" }],
  };

    a.finished.then(() => { el.style.opacity = 1; a.cancel(); }).catch(() => {});

  els.forEach(e => io.observe(e));
}

  out.push({ k: "design template templat tema gaya papar rupa warna fon", q: "Design & template", a: () => `Di bahagian Design anda ada ${DESIGNS.length} template siap: ${DESIGNS.map(d => d.n).join(", ")}. Klik template untuk pilih, lalu ubah nama, bio, gambar, warna, fon, saiz kad dan bentuk butang dalam panel edit. Boleh simpan sehingga ${MAXD} design dan tukar bila-bila masa. Pautan anda tidak hilang bila design bertukar.`, go: "design" });
  out.push({ k: "gaya profil kepala klasik hero banner cincin kaca sebelah header", q: "Gaya profil", a: () => `Ada ${STYLES.length} gaya kepala profil: ${STYLES.map(x => x[1]).join(", ")}. Tukar di Profil atau dalam panel edit design.`, go: "profile" });
  out.push({ k: "susun atur layout poster grid katalog bento", q: "Susun atur", a: () => `Susun atur tersedia: ${Object.values(TPL).map(x => x.name).join(", ")}.`, go: "design" });
  out.push({ k: "platform sokongan whatsapp shopee tiktok instagram lazada youtube", q: "Platform disokong", a: () => `Logo platform dikesan automatik untuk: ${LINK_KEYS.map(k => BRANDS[k].n).join(", ")}.`, go: "links" });
  out.push({ k: "pratonton preview telefon laptop", q: "Pratonton", a: "Pratonton telefon dan laptop dipaparkan serentak dan berubah langsung semasa anda edit." });
  return out;
}
const CB_NORM = t => String(t).toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
function cbAnswer(text) {
  const q = CB_NORM(text), words = q.split(" ").filter(w => w.length > 2); if (!words.length) return null;
  const scored = cbKB().map(e => { const keys = CB_NORM(e.k + " " + e.q).split(" "); let sc = 0; words.forEach(w => { if (keys.includes(w)) sc += 3; else if (keys.some(k => k.length > 3 && (k.startsWith(w) || w.startsWith(k)))) sc += 1.5; }); return { e, sc }; }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc);
  return scored;
}
function cbInit() {
  const fabs = $("#fabs"); if (!fabs || $("#cbfab")) return;
  const fab = document.createElement("button"); fab.id = "cbfab"; fab.type = "button"; fab.setAttribute("aria-label", "Buka pembantu bantuan Flash Link"); fab.setAttribute("aria-expanded", "false");
  fab.innerHTML = `<img src="/assets/icon.png" alt="" width="44" height="44"><span class="cb-dot" aria-hidden="true"></span>`;
  const tip = document.createElement("div"); tip.id = "cbtip"; tip.innerHTML = `<span>Ada masalah?? Chat saya...</span><button type="button" aria-label="Tutup mesej">${ic("x", "w-4 h-4")}</button>`;
  const panel = document.createElement("section"); panel.id = "cbpanel"; panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", "Pembantu Flash Link"); panel.hidden = true;
  panel.innerHTML = `<header><img src="/assets/icon.png" alt="" width="34" height="34"><div><b>Pembantu Flash Link</b><small>Tanya apa-apa tentang app ini</small></div><button type="button" id="cbx" aria-label="Tutup">${ic("x", "w-5 h-5")}</button></header><div id="cbmsgs" aria-live="polite"></div><div id="cbchips"></div><form id="cbform"><input id="cbin" class="inp" placeholder="Tulis soalan anda…" autocomplete="off" maxlength="200" aria-label="Soalan anda"><button class="btn btn-red" aria-label="Hantar">${ic("send", "w-5 h-5")}</button></form>`;
  fabs.appendChild(fab); document.body.appendChild(tip); document.body.appendChild(panel);
  const msgs = $("#cbmsgs", panel);
  const say = (t, who, go) => { const d = document.createElement("div"); d.className = "cbm " + who; d.textContent = t; msgs.appendChild(d); if (go && NAV.some(n => n.k === go)) { const nv = NAV.find(n => n.k === go), bt = document.createElement("button"); bt.type = "button"; bt.className = "cbgo"; bt.textContent = "Buka " + nv.n; bt.onclick = () => { if (S.user && S.profile && $("#stage")) openView(go); else nav("/dashboard"); panel.hidden = true; fab.setAttribute("aria-expanded", "false"); }; msgs.appendChild(bt); } msgs.scrollTop = msgs.scrollHeight; };
  const chips = () => { const c = $("#cbchips", panel); c.innerHTML = ""; ["Cara tambah pautan", "Gambar pecah", "Shorten link", "Kemas kini", "Analitik"].forEach(t => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t; b.onclick = () => ask(t); c.appendChild(b); }); };
  const ask = t => {
    t = t.trim(); if (!t) return; say(t, "me");
    const r = cbAnswer(t);
    if (!r || !r.length) return say("Maaf, saya belum jumpa jawapan untuk itu. Cuba soalan pendek, cth. “tambah pautan”, “gambar pecah”, “kemas kini”. Atau pilih topik di bawah.", "bot");
    const top = r[0].e, a = typeof top.a === "function" ? top.a() : top.a; say(a, "bot", top.go);
    if (r[1] && r[1].sc >= r[0].sc * .7) say("Mungkin anda juga maksudkan: " + r[1].e.q + ".", "bot");
  };
  const open = o => { panel.hidden = !o; fab.setAttribute("aria-expanded", String(o)); tip.classList.remove("on"); if (o) { if (!msgs.children.length) { say("Hai! Saya pembantu Flash Link. Saya boleh jawab soalan tentang pautan, design, gambar, analitik, shorten link dan kemas kini.", "bot"); chips(); } anim(panel, [{ opacity: 0, transform: "translate3d(0,18px,0) scale(.96)" }, { opacity: 1, transform: "none" }], { duration: 380 }); setTimeout(() => $("#cbin", panel).focus(), 60); } else fab.focus(); };
  fab.onclick = () => open(panel.hidden); $("#cbx", panel).onclick = () => open(false);
  $("#cbform", panel).onsubmit = e => { e.preventDefault(); const i = $("#cbin", panel); const v = i.value; i.value = ""; ask(v); };
  panel.addEventListener("keydown", e => { if (e.key === "Escape") open(false); });
  $("button", tip).onclick = () => tip.classList.remove("on");
  setTimeout(() => { if (panel.hidden && document.body.classList.contains("flow")) tip.classList.add("on"); }, 2500); setTimeout(() => tip.classList.remove("on"), 15000);
}
cbInit();

/* ---------- Router ---------- */
function nav(path, replace) { replace ? history.replaceState({}, "", path) : history.pushState({}, "", path); route(true); window.scrollTo(0, 0); }
function route() {
  document.documentElement.style.background = ""; sfxScope(false); setTimeout(() => checkUpdate(), 1200);
  const p = location.pathname.replace(/\/+$/, "") || "/", seg = p.split("/").filter(Boolean);
  document.body.classList.toggle("flow", !(seg.length === 1 && USER_RE.test(seg[0]) && !RESERVED.has(seg[0])) && seg[0] !== "s");
  if (p === "/" || p === "/index.html") return landing();
  if (p === "/login") return loginView();
  if (p === "/dashboard") return dashView();
  if (seg.length === 2 && seg[0] === "s" && /^[a-z0-9]{4,12}$/.test(seg[1])) return shortView(seg[1]);
  if (seg.length === 1 && USER_RE.test(seg[0]) && !RESERVED.has(seg[0])) return publicView(seg[0]);
  notFound();
}
document.addEventListener("click", e => { const a = e.target.closest("a[data-nav]"); if (!a || e.metaKey || e.ctrlKey) return; e.preventDefault(); nav(a.getAttribute("href")); });
addEventListener("popstate", route);
const initPromise = initFirebase().catch(e => { console.error(e); authReadyRes(); toast("Gagal menyambung ke Firebase. Semak config.", "bad"); });
initPromise.then(() => { countVisit(); checkUpdate(); watchVersion(); });
route();
