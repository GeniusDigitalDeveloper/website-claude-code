<body>
<main style="max-width:1000px;margin:0 auto"><div id="pray"></div></main>
<script>

/* ===== Pembantu kecil (menggantikan kod app induk) ===== */
const $ = (q, r = document) => r.querySelector(q), $$ = (q, r = document) => [...r.querySelectorAll(q)];
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
const REDUCE = () => matchMedia("(prefers-reduced-motion:reduce)").matches;
const wallIn = (d, tz) => { const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(d).map(x => [x.type, x.value])); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`; };
const ic = name => `<svg class="w-4 h-4" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>`;
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function modal(html, after) {
  const bg = document.createElement("div"); bg.className = "modal-bg"; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div style="display:flex;justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-x aria-label="Tutup">&times;</button></div>${html}</div>`;
  const close = () => { bg.remove(); document.removeEventListener("keydown", k); }, k = e => e.key === "Escape" && close();
  document.addEventListener("keydown", k); bg.onclick = e => { if (e.target === bg) close(); }; $("[data-x]", bg).onclick = close; document.body.appendChild(bg); bg.close = close; after && after(bg); return bg;
}

/* ===== Slideshow latar (pilihan): letak sehingga 10 URL gambar dalam SLIDES.imgs ===== */
/* ---- Slideshow latar waktu solat (maks. 10 gambar, gerakan slow-motion boleh dilaras) ---- */
const SLIDES = { imgs: [], anim: "kenburns", secs: 10, zoom: 112, px: 50, py: 30 }, PS = { timers: [] };
function psStart() {
  PS.timers.forEach(clearInterval); PS.timers = [];
  $$(".pray-scr").forEach(box => {
    let ss = $(".pz-ss", box); const imgs = (SLIDES.imgs || []).slice(0, 10).filter(Boolean);
    if (!imgs.length) { ss && ss.remove(); return; }
    if (!ss) { ss = document.createElement("div"); ss.className = "pz-ss"; ss.setAttribute("aria-hidden", "true"); box.prepend(ss); }
    ss.innerHTML = imgs.map(() => '<div class="pz-sl"></div>').join(""); const L = $$(".pz-sl", ss); L.forEach((e, i) => (e.style.backgroundImage = `url("${imgs[i]}")`));
    const secs = Math.max(4, Math.min(30, +SLIDES.secs || 10)), z = Math.max(100, Math.min(150, +SLIDES.zoom || 112)) / 100, org = `${Math.max(0, Math.min(100, +SLIDES.px >= 0 ? +SLIDES.px : 50))}% ${Math.max(0, Math.min(100, +SLIDES.py >= 0 ? +SLIDES.py : 30))}%`;
    const kinds = SLIDES.anim === "campur" ? ["in", "out", "l", "r"] : [SLIDES.anim === "zoomout" ? "out" : SLIDES.anim === "pan" ? "l" : SLIDES.anim === "fade" ? "none" : "in"];
    const mk = (k, to) => (k === "in" ? (to ? `scale(${z})` : "scale(1)") : k === "out" ? (to ? "scale(1)" : `scale(${z})`) : k === "l" ? (to ? `translate3d(3%,0,0) scale(${z})` : `translate3d(-3%,0,0) scale(${z})`) : k === "r" ? (to ? `translate3d(-3%,0,0) scale(${z})` : `translate3d(3%,0,0) scale(${z})`) : "none");
    let i = -1;
    const step = () => {
      if (!document.body.contains(ss)) return; const prev = L[i]; i = (i + 1) % L.length; const e = L[i], k = kinds[i % kinds.length];
      if (prev && prev !== e) prev.classList.remove("on");
      e.style.transition = "none"; e.style.transformOrigin = org; e.style.transform = REDUCE() ? "none" : mk(k, false); void e.offsetWidth;
      e.style.transition = `opacity 1.8s ease, transform ${secs + 2.5}s linear`; e.classList.add("on"); if (!REDUCE()) e.style.transform = mk(k, true);
    };
    step(); if (L.length > 1) PS.timers.push(setInterval(step, secs * 1000));
  });
}

/* ===== Jam Malaysia (segerak dengan pelayan JAKIM) ===== */
const CLK = { off: 0, hij: null, day: "", busy: false };
const klNow = () => new Date(Date.now() + CLK.off);
const klDay = d => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kuala_Lumpur", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
async function syncClock() {
  if (CLK.busy) return; CLK.busy = true; const day = klDay(klNow());
  try {
    const r = await fetch("https://www.e-solat.gov.my/index.php?r=esolatApi/TakwimSolat&period=today&zone=SGR01", { cache: "no-store" }), j = await r.json();
    const st = String(j.serverTime || "").match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})$/); if (st) CLK.off = new Date(`${st[1]}T${st[2]}+08:00`).getTime() - Date.now();
    CLK.day = klDay(klNow());
  } catch {}

    const draw = () => { const st = $("#zm-st", bg).value; list.innerHTML = ZONES.filter(z => z[1] === st).map(z => `<button type="button" class="zrow" data-z="${z[0]}" aria-pressed="${z[0] === PR.zone}"><b>${z[0]}</b>${esc(z[2])}</button>`).join(""); $$("[data-z]", list).forEach(b => (b.onclick = () => { PR.zone = b.dataset.z; PR.auto = false; lsSet("fl_zone", PR.zone); bg.close(); initPray(); })); };
    $("#zm-st", bg).onchange = draw; draw();
    $("#zm-geo", bg).onclick = async () => { er.textContent = ""; try { PR.zone = await geoZone(); PR.auto = false; lsSet("fl_zone", PR.zone); bg.close(); initPray(); } catch { er.textContent = "Lokasi tidak dapat dikesan. Benarkan akses lokasi atau pilih zon di bawah."; } };
    $("#zm-auto", bg).onclick = () => { lsSet("fl_zone", ""); PR.zone = ""; bg.close(); initPray(true); };
  });
}



/* ===== Mula ===== */
$("#pray").outerHTML = prayHtml();
syncClock(); initPray(); setInterval(tickPray, 1000);

</script>
