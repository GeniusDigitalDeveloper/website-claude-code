# Hoskan frontend Zamrud di GitHub Pages.
# Satu kali: Settings > Pages > Source = "GitHub Actions". Kemudian merge ke branch utama.
# Pilihan: Settings > Secrets and variables > Actions > Variables > ZAMRUD_API_BASE = https://pelayan-anda.example.com
name: Zamrud - Deploy Pages
on:
  push:
    branches: [main, ccr-0e48f698-6e8bal]
    paths: ['sites/zamrud/public/**', '.github/workflows/zamrud-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tetapkan alamat pelayan (API_BASE)
        env:
          API_BASE: ${{ vars.ZAMRUD_API_BASE }}
        run: |
          if [ -n "$API_BASE" ]; then
            echo "$API_BASE" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?$' || { echo "ZAMRUD_API_BASE tidak sah"; exit 1; }
            printf "window.ZAMRUD = { API_BASE: '%s', SITE_NAME: 'Zamrud' };\n" "$API_BASE" > sites/zamrud/public/assets/js/config.js
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/zamrud/public
      - id: deployment
        uses: actions/deploy-pages@v4
