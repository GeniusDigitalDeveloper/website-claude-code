name: Ngap - CI
on:
  push:
    paths: ['sites/ngap/**']
  pull_request:
    paths: ['sites/ngap/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Semak sintaks server dan frontend
        working-directory: sites/ngap
        run: |
          node --check server/server.mjs
          for f in public/assets/js/*.js; do node --check "$f"; done
      - name: Imbas rahsia
        run: "! grep -rEn '(ADMIN_PASSWORD|SECRET)=[^ ]{6,}' sites/ngap --exclude='.env.example' --exclude-dir=node_modules"
