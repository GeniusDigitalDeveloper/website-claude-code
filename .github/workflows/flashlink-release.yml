name: Flash Link — bina EXE dan ZIP

# Hasilkan Flash-Link-Setup.exe (Windows) dan Flash-Link-Web.zip (Netlify), kemudian
# kemas kini Release tetap "flashlink-latest" supaya pautan muat turun tidak berubah.
on:
  push:
    paths:
      - "sites/flash-link-app/**"
      - "sites/flash-link/public/**"
      - ".github/workflows/flashlink-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flashlink-release
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bina ZIP
        run: node sites/flash-link-app/scripts/make-zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: sites/flash-link-app/out/Flash-Link-Web.zip

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang kebergantungan
        working-directory: sites/flash-link-app
        run: npm install --no-audit --no-fund
      - name: Bina EXE
        working-directory: sites/flash-link-app
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: sites/flash-link-app/dist/Flash-Link-Setup.exe

  release:
    needs: [zip, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Terbitkan Release flashlink-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./sites/flash-link/public/version.json').version")
          EXEV=$(node -p "require('./sites/flash-link-app/package.json').version")
          NOTES="Genius Digital Flash Link — web ${VER}, desktop ${EXEV}. Dibina automatik dari commit ${GITHUB_SHA::7}."
          ls -la files
          if ! gh release view flashlink-latest >/dev/null 2>&1; then
            gh release create flashlink-latest --title "Genius Digital Flash Link — muat turun terkini" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release edit flashlink-latest --notes "$NOTES"
          fi
          gh release upload flashlink-latest files/Flash-Link-Setup.exe files/Flash-Link-Web.zip --clobber
          echo "### Pautan muat turun" >> "$GITHUB_STEP_SUMMARY"
          echo "- EXE: https://github.com/${GITHUB_REPOSITORY}/releases/download/flashlink-latest/Flash-Link-Setup.exe" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP: https://github.com/${GITHUB_REPOSITORY}/releases/download/flashlink-latest/Flash-Link-Web.zip" >> "$GITHUB_STEP_SUMMARY"
